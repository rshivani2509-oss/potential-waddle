<script id="exam-priority-visible-js">
(function(){
  function d0(s){return String(s||'').slice(0,10);}
  function localToday(){const d=new Date();d.setHours(0,0,0,0);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function tomorrow(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function escV(v){return typeof esc==='function'?esc(String(v??'')):String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
  function examType(t){
    const raw=(String(t.source||'')+' '+String(t.testType||'')+' '+String(t.name||'')).toLowerCase();
    if(raw.includes('school')||t.schoolWeekly===true||raw.includes('cbse')||raw.includes('periodic')||raw.includes('month-end')) return 'CBSE / School';
    if(raw.includes('aakash')||raw.includes('aiats')||raw.includes('tym')) return 'Aakash';
    if(raw.includes('vedantu')) return 'Vedantu';
    if(raw.includes('neet')) return 'NEET';
    if(raw.includes('jee')) return 'JEE';
    return t.source||t.testType||'Other';
  }
  window.renderVisibleExamPriority=function(){
    const host=document.getElementById('exam-priority-visible-mount');
    if(!host)return;
    const tests=Array.isArray(DATA?.upcomingTests)?DATA.upcomingTests:[];
    const today=localToday(),tmr=tomorrow();
    const upcoming=tests.filter(t=>d0(t.date)>=today).sort((a,b)=>d0(a.date).localeCompare(d0(b.date)));
    const tomorrowTests=upcoming.filter(t=>d0(t.date)===tmr);
    const weights=DATA.examPlanWeights||{};
    const pref=DATA.examPreferredWindow||{};
    const shown=upcoming.slice(0,10);
    const types=['NEET','JEE','CBSE / School','Aakash','Vedantu'];
    host.innerHTML=`<div class="exam-priority-visible">
      <div class="epv-head"><div><h3>🎯 Exam Priority + Preferred Timing</h3><div class="hint">This control applies to <b>NEET, JEE, CBSE/School, Aakash, Vedantu</b> and any other exam you add to Test Calendar.</div></div><span class="epv-universal">ALL EXAMS</span></div>
      ${tomorrowTests.length?`<div class="epv-exam epv-tomorrow">🔴 <b>EXAM TOMORROW</b> — ${tomorrowTests.map(t=>escV(t.name||'Exam')).join(', ')}<br><span>Set its percentage below. Today's generated plan will give it the requested priority.</span></div>`:`<div class="epv-exam epv-normal">📅 No exam tomorrow. You can still set percentages for any upcoming exam.</div>`}
      <div class="epv-types">${types.map(x=>`<span>${x}</span>`).join('')}</div>
      ${shown.length?`<div class="epv-grid">${shown.map(t=>{const id=String(t.id||t.name||t.date),type=examType(t),val=Number(weights[t.id]??t.planWeight??0);return `<div class="epv-item"><label>${escV(type)}</label><b>${escV(t.name||'Exam')}</b><div class="epv-date">${escV(t.date)}</div><input type="number" min="0" max="100" data-ep-id="${escV(id)}" value="${val}" placeholder="% of today's study time"></div>`}).join('')}</div>`:`<div class="epv-empty">No upcoming exams are entered yet. Add the exam in <b>Test Calendar</b> first; it will automatically appear here.</div>`}
      <div class="epv-grid epv-time-grid"><div class="epv-item"><label>Preferred study start</label><input id="epv-start" type="time" value="${escV(pref.start||'')}"></div><div class="epv-item"><label>Preferred study end</label><input id="epv-end" type="time" value="${escV(pref.end||'')}"></div></div>
      <div class="epv-example">Example: School Chemistry tomorrow <b>70%</b> + NEET test <b>20%</b> + JEE <b>10%</b>. Pragati uses these as proportional priorities inside your preferred time window.</div>
      <button class="btn btn-primary" id="epv-save">💾 Save exam priorities & timing</button>
    </div>`;
  };
  window.saveVisibleExamPriority=function(){
    DATA.examPlanWeights=DATA.examPlanWeights||{};
    document.querySelectorAll('[data-ep-id]').forEach(x=>{const t=(DATA.upcomingTests||[]).find(t=>String(t.id||t.name||t.date)===x.dataset.epId);if(t)DATA.examPlanWeights[t.id]=Math.max(0,Math.min(100,Number(x.value)||0));});
    DATA.examPreferredWindow=DATA.examPreferredWindow||{};
    DATA.examPreferredWindow.start=document.getElementById('epv-start')?.value||'';
    DATA.examPreferredWindow.end=document.getElementById('epv-end')?.value||'';
    if(typeof save==='function')save();
    if(typeof toast==='function')toast('🎯 Exam priorities and preferred timing saved.');
    if(typeof render==='function')render();
  };
  document.addEventListener('click',e=>{if(e.target.closest('#epv-save'))window.saveVisibleExamPriority();});
  document.addEventListener('DOMContentLoaded',()=>setTimeout(window.renderVisibleExamPriority,150));
})();

<script id="study-log-weekly-js">
function pslEnsure(){
  DATA.studySessionLogs=Array.isArray(DATA.studySessionLogs)?DATA.studySessionLogs:[];
}
function pslSaveSession(){
  pslEnsure();
  const subject=document.getElementById('pslSubject')?.value||'';
  const chapter=(document.getElementById('pslChapter')?.value||'').trim();
  const topic=(document.getElementById('pslTopic')?.value||'').trim();
  const type=document.getElementById('pslType')?.value||'Concept';
  const minutes=Math.max(0,Number(document.getElementById('pslMinutes')?.value)||0);
  const questions=Math.max(0,Number(document.getElementById('pslQuestions')?.value)||0);
  const correct=Math.max(0,Number(document.getElementById('pslCorrect')?.value)||0);
  const note=(document.getElementById('pslNote')?.value||'').trim();
  if(!subject||!chapter||!minutes)return toast('Add subject, chapter and actual study time.');
  DATA.studySessionLogs.push({
    id:uid(),date:todayStr(),subject,chapter,topic,type,minutes,questions,correct,
    accuracy:questions?Math.round(correct/questions*100):null,note
  });
  save();closeModal();render();toast('📚 Study session logged.');
}
function pslOpenLog(){
  pslEnsure();
  const subs=Object.keys(DATA.subjects||{});
  openModal(`<div class="card-head"><h3>📚 Study Session Log</h3></div>
    <div class="text-sm muted">Record what you actually studied — separate from what was planned.</div>
    <div class="psl-form">
      <label>Subject<select id="pslSubject">${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
      <label>Chapter<select id="pslChapter"><option value="">Select chapter</option></select></label>
      <label>Topic<input id="pslTopic" placeholder="Optional topic"></label>
      <label>Work type<select id="pslType"><option>Concept</option><option>NCERT</option><option>Questions</option><option>PYQ</option><option>Revision</option><option>Mistake correction</option></select></label>
      <label>Actual minutes<input id="pslMinutes" type="number" min="1" placeholder="45"></label>
      <label>Questions completed<input id="pslQuestions" type="number" min="0" placeholder="20"></label>
      <label>Correct<input id="pslCorrect" type="number" min="0" placeholder="16"></label>
    </div>
    <label style="display:block;margin-top:10px;font-size:10px;color:var(--ink-soft)">Notes<textarea id="pslNote" rows="3" placeholder="What did you learn / what remains confusing?"></textarea></label>
    <button class="btn btn-primary" style="margin-top:12px" onclick="pslSaveSession()">Save Study Session</button>`,true);
}
function pslWeeklyData(){
  pslEnsure();
  const end=new Date();end.setHours(0,0,0,0);
  const start=new Date(end);start.setDate(start.getDate()-6);
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const a=DATA.studySessionLogs.filter(x=>x.date>=iso(start)&&x.date<=iso(end));
  const planned=(DATA.plannerEvents||[]).filter(x=>x.date>=iso(start)&&x.date<=iso(end));
  const done=planned.filter(x=>x.done);
  const actualMin=a.reduce((n,x)=>n+Number(x.minutes||0),0);
  const q=a.reduce((n,x)=>n+Number(x.questions||0),0);
  const correct=a.reduce((n,x)=>n+Number(x.correct||0),0);
  const plannedMin=planned.reduce((n,x)=>n+Number(x.duration||0),0);
  const completedMin=done.reduce((n,x)=>n+Number(x.duration||0),0);
  const bySubject={};
  a.forEach(x=>bySubject[x.subject]=(bySubject[x.subject]||0)+Number(x.minutes||0));
  const top=Object.entries(bySubject).sort((x,y)=>y[1]-x[1])[0];
  return {a,plannedMin,completedMin,actualMin,q,correct,accuracy:q?Math.round(correct/q*100):0,completion:plannedMin?Math.round(completedMin/plannedMin*100):0,top};
}
function pslWeeklyReport(){
  const r=pslWeeklyData();
  return `<div class="psl-card">
    <div class="psl-title">📅 Weekly Reality Report</div>
    <div class="psl-sub">What you planned versus what you actually did, using both planner completion and your Study Session Log.</div>
    <div class="psl-grid">
      <div class="psl-stat">Planned time<b>${(r.plannedMin/60).toFixed(1)}h</b></div>
      <div class="psl-stat">Planner completed<b>${(r.completedMin/60).toFixed(1)}h</b></div>
      <div class="psl-stat">Actual logged<b>${(r.actualMin/60).toFixed(1)}h</b></div>
      <div class="psl-stat">Plan completion<b>${r.completion}%</b></div>
      <div class="psl-stat">Questions<b>${r.q}</b></div>

}
function pslLogList(){

<script id="one-tap-plan-js">
/* ============================================================
   ONE-TAP PLAN MY DAY
   Uses the existing planner engine; it does not create a second
   planner or duplicate the user's existing generation workflow.
   ============================================================ */
function otpEnsure(){
  DATA.oneTapPlan=DATA.oneTapPlan||{lastGenerated:'',lastSummary:null};
  DATA.oneTapPlan.lastSummary ||= null;
}
function otpTomorrow(){
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function otpUpcomingExams(){
  return (DATA.upcomingTests||[]).filter(t=>String(t.date||'').slice(0,10)>=todayStr())
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function otpTomorrowExams(){
  return otpUpcomingExams().filter(t=>String(t.date||'').slice(0,10)===otpTomorrow());
}
function otpAvailableMinutes(){
  const pref=typeof examPlanPreferredWindow==='function'?examPlanPreferredWindow():{};
  if(pref.start&&pref.end&&typeof toMin==='function'){
    let a=toMin(pref.start),b=toMin(pref.end);if(b<a)b+=1440;
    return Math.max(0,b-a);
  }
  // Fall back to existing free-slot calculator when no preferred window is set.
  try{
    if(typeof getAvailableStudyMinutes==='function')return Math.max(0,getAvailableStudyMinutes(todayStr()));
  }catch(e){}
  return 120;
}
function otpExamWeight(test){
  const weights=DATA.examPlanWeights||{};
  return Math.max(0,Number(weights[test.id]??test.planWeight??0));
}
function otpPickTopics(){
  const mode=DATA.prgPack?.mode||'CBSE';
  const rows=[];
  Object.entries(DATA.subjects||{}).forEach(([subject,s])=>{
    if(typeof prgPackAllowed==='function'&&!prgPackAllowed(subject,mode))return;
    (s.chapters||[]).forEach(ch=>{
      const risk=typeof prgRisk==='function'?prgRisk(subject,ch.name):{days:0};
      const mistakes=(DATA.mistakes||[]).filter(m=>!m.mastered&&m.subject===subject&&m.chapter===ch.name).length;
      const stateStates=(DATA.topicStates||{});
      const lowState=Object.values(stateStates).some(v=>typeof v==='string'&&/learning|understanding|practicing|error/i.test(v));
      const priority=(100-(typeof prgChapterReadiness==='function'?prgChapterReadiness(subject,ch):0))
        +mistakes*8+(risk.days>7?20:risk.days>2?8:0)+(lowState?3:0);
      rows.push({subject,chapter:ch.name,priority});
    });
  });
  return rows.sort((a,b)=>b.priority-a.priority);
}
function otpBuildSelection(){
  const exams=otpUpcomingExams(),tom=otpTomorrowExams(),rows=otpPickTopics();
  const selected=[];
  // Tomorrow's exam chapters always come first.
  tom.forEach(t=>(t.chapters||[]).forEach(c=>{
    selected.push({subject:c.subject,chapter:c.chapter,reason:'Exam tomorrow',exam:t.name});
  }));
  rows.forEach(r=>{
    if(!selected.some(x=>x.subject===r.subject&&x.chapter===r.chapter))selected.push({...r,reason:'Weak / unfinished'});
  });
  return {exams,tomorrow:tom,selected};
}
function otpShowPreview(){
  otpEnsure();
  const x=otpBuildSelection(), mins=otpAvailableMinutes();
  const weights=x.exams.map(t=>otpExamWeight(t));
  const total=weights.reduce((a,b)=>a+b,0);
  const rows=x.selected.slice(0,8);
  openModal(`<div class="card-head"><h3>🪄 Plan My Day</h3></div>
    <div class="text-sm muted mb-10">Pragati will use today's available time, your preferred timing, upcoming exams, percentages, fixed commitments, backlog and weak/unfinished topics.</div>
    <div class="otpp-preview">
      <div class="otpp-row"><b>Available study time</b><span>${mins} min</span></div>
      <div class="otpp-row"><b>Preferred timing</b><span>${esc((DATA.examPreferredWindow||{}).start||'Automatic')} → ${esc((DATA.examPreferredWindow||{}).end||'Automatic')}</span></div>
      <div class="otpp-row"><b>Tomorrow's exams</b><span>${x.tomorrow.length||'None'}</span></div>
      <div class="otpp-row"><b>Exam allocation</b><span>${total?weights.join(' / ')+'%':'Use urgency + weakness'}</span></div>
    </div>
    <div class="mt-10"><b>Priority topics</b>
      ${rows.length?rows.map(r=>`<div class="otpp-row"><span>${esc(r.subject)} → ${esc(r.chapter)}</span><span>${esc(r.reason||'Priority')}</span></div>`).join(''):'<div class="text-sm muted">No chapter data available.</div>'}
    </div>
    <div class="flex gap-8 mt-14">
      <button class="btn btn-primary" onclick="otpGenerate()">🪄 Generate My Day</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>`,true);
}
function otpGenerate(){
  closeModal();
  // Reuse the existing generator so selected topics, preferred timings,
  // fixed blocks and swap/edit functionality remain compatible.
  try{
    if(typeof generateTodaysPlan==='function'){
      generateTodaysPlan();
      otpEnsure();DATA.oneTapPlan.lastGenerated=todayStr();DATA.oneTapPlan.lastSummary=otpBuildSelection();
      save();
      return;
    }
  }catch(e){console.warn('Existing planner generator failed; using safe fallback.',e);}
  toast('Open Generate Today’s Plan once to initialize the planner, then use Plan My Day again.');
}
function otpRenderButton(){
  otpEnsure();
  const tom=otpTomorrowExams();
  return `<div class="one-tap-plan">
    <h3>🪄 Plan My Day</h3>
    <div class="sub">One tap. Pragati checks tomorrow's exam, exam percentages, preferred timings, school/tuition/coaching, backlog, weak topics and today's available time.</div>
    ${tom.length?`<div class="otpp-preview">🔴 <b>Exam tomorrow:</b> ${tom.map(t=>esc(t.name||'Exam')).join(', ')}</div>`:''}
    <button class="btn btn-primary one-tap-plan-btn" onclick="otpShowPreview()">🪄 PLAN MY DAY</button>
    <div class="sub" style="margin-top:7px">You can still swap, resize, move, lock or skip every generated block.</div>
  </div>`;
}
</script>

<script id="planner-addons-js">
/* ============================================================
   PRAGATI PLANNER ADD-ONS
   Included:
   1. Auto-Replan After Skip
   2. What Can I Finish In X Time?
   3. Topic Completion Picker
   4. Smart Swap with Class 11/12 + exam filters
   5. Hard-copy Practice Counter
   6. Clean My Plan
   7. Only X Hours Today
   Excluded by request: Exam-Eve Mode and Exam-Morning Mode.
   ============================================================ */
function pafEnsure(){
  DATA.paf=DATA.paf||{};
  DATA.paf.lastAutoReplan ||= '';
  DATA.paf.lastClean ||= '';
}
function pafTomorrow(){
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function pafTimeToMin(s){
  if(typeof toMin==='function')return toMin(s);
  const m=String(s||'').match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):0;
}
function pafTodayFree(){
  try{
    if(typeof getAvailableStudyMinutes==='function')return Math.max(0,getAvailableStudyMinutes(todayStr()));
  }catch(e){}
  const p=DATA.examPreferredWindow||{};
  if(p.start&&p.end){
    let a=pafTimeToMin(p.start),b=pafTimeToMin(p.end);if(b<a)b+=1440;return Math.max(0,b-a);
  }
  return 120;
}
function pafAllowedSubjects(exam){
  if(exam==='NEET')return ['Physics','Chemistry','Biology'];
  if(exam==='JEE')return ['Physics','Chemistry','Maths'];
  return ['Physics','Chemistry','Maths','Biology'];
}
function pafExamMode(){
  return DATA.prgPack?.mode||'CBSE';
}
function pafChapterOptions(exam='CBSE',subject=''){
  const subs=subject?[subject]:pafAllowedSubjects(exam);
  const out=[];
  subs.forEach(s=>{
    const chs=DATA.subjects?.[s]?.chapters||[];
    const c11=chs.filter(c=>String(chapterClassLevel(s,c))==='11');
    const c12=chs.filter(c=>String(chapterClassLevel(s,c))==='12');
    if(c11.length)out.push({group:`${s} · Class 11`,items:c11});
    if(c12.length)out.push({group:`${s} · Class 12`,items:c12});
  });
  return out;
}
function pafTopicStatePicker(subject,chapter){
  const c=(DATA.subjects?.[subject]?.chapters||[]).find(x=>x.name===chapter);
  const topics=c?.topics||[];
  if(!topics.length)return `<div class="planner-addon-sub">No topics listed yet. Add topics from the Subject Tracker.</div>`;
  return topics.map(t=>`<label class="paf-chip"><input type="checkbox" value="${esc(t)}" style="margin-right:4px"> ${esc(t)}</label>`).join('');
}
function pafOpenCompletion(){
  const subs=Object.keys(DATA.subjects||{});
  openModal(`<div class="card-head"><h3>✅ Complete a Topic</h3></div>
    <div class="planner-addon-sub">Choose exactly what you completed. This updates the selected topic's study record without assuming the whole chapter is finished.</div>
    <label class="mt-10">Subject<select id="pafCS">${subs.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
    <label class="mt-10">Chapter<select id="pafCC"><option value="">Select chapter</option></select></label>
    <div id="pafCT" class="mt-10"></div>
    <label class="mt-10">Result<select id="pafCR"><option value="done">Completed</option><option value="practice">Practiced</option><option value="pyq">PYQ completed</option><option value="revision">Revised</option><option value="error">Needs improvement</option></select></label>
    <button class="btn btn-primary mt-12" onclick="pafSaveCompletion()">Save</button>`,true);
  setTimeout(()=>pafPopulateCompletionChapters(),0);
}
function pafPopulateCompletionChapters(){
  const s=document.getElementById('pafCS'),c=document.getElementById('pafCC');if(!s||!c)return;
  const groups=pafChapterOptions('CBSE',s.value);
  c.innerHTML='<option value="">Select chapter</option>'+groups.map(g=>`<optgroup label="${esc(g.group)}">${g.items.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
  document.getElementById('pafCT').innerHTML='';
}
function pafPopulateTopics(){
  const s=document.getElementById('pafCS')?.value,c=document.getElementById('pafCC')?.value;
  const el=document.getElementById('pafCT');if(el)el.innerHTML=pafTopicStatePicker(s,c);
}
document.addEventListener('change',e=>{
  if(e.target?.id==='pafCS')pafPopulateCompletionChapters();
  if(e.target?.id==='pafCC')pafPopulateTopics();
});
function pafSaveCompletion(){
  const s=pafCS?.value,c=pafCC?.value, result=pafCR?.value;
  if(!s||!c)return toast('Choose a subject and chapter.');
  const topics=[...document.querySelectorAll('#pafCT input[type=checkbox]:checked')].map(x=>x.value);
  DATA.studyCompletions=Array.isArray(DATA.studyCompletions)?DATA.studyCompletions:[];
  DATA.studyCompletions.push({id:uid(),date:todayStr(),subject:s,chapter:c,topics,result});
  save();closeModal();render();toast('✅ Completion recorded for the selected topic(s).');
}
function pafOpenTimeFit(){
  openModal(`<div class="card-head"><h3>⏱️ What Can I Finish?</h3></div>
    <div class="planner-addon-sub">Tell Pragati how much time you have. It will select the highest-priority work that can fit without pretending you have more time.</div>
    <label class="mt-10">Available minutes<input id="pafMinutes" type="number" min="10" step="5" value="60"></label>
    <button class="btn btn-primary mt-12" onclick="pafTimeFit()">Find best work</button>`,true);
}
function pafTimeFit(){
  const mins=Math.max(10,Number(document.getElementById('pafMinutes')?.value)||60);
  const rows=[];
  Object.entries(DATA.subjects||{}).forEach(([s,x])=>{
    if(!pafAllowedSubjects(pafExamMode()).includes(s))return;
    (x.chapters||[]).forEach(c=>{
      const risk=typeof prgRisk==='function'?prgRisk(s,c.name):{days:0};
      const mistakes=(DATA.mistakes||[]).filter(m=>!m.mastered&&m.subject===s&&m.chapter===c.name).length;
      rows.push({s,c:c.name,score:mistakes*10+(risk.days>7?20:risk.days>2?8:0)});
    });
  });
  const best=rows.sort((a,b)=>b.score-a.score).slice(0,Math.max(1,Math.floor(mins/30)));
  closeModal();
  openModal(`<div class="card-head"><h3>⏱️ Best Use of ${mins} Minutes</h3></div>
    ${best.map((x,i)=>`<div class="list-item"><span class="txt"><b>${i+1}. ${esc(x.s)} → ${esc(x.c)}</b><br><span class="faint">Suggested ~${Math.min(45,Math.max(20,mins-best.slice(0,i).reduce((n)=>n,0)))} min</span></span></div>`).join('')}
    <button class="btn btn-outline mt-12" onclick="closeModal()">Close</button>`,true);
}
function pafSmartSwap(){
  const mode=pafExamMode();
  const groups=pafChapterOptions(mode);
  openModal(`<div class="card-head"><h3>🔀 Smart Swap</h3></div>
    <div class="planner-addon-sub">All eligible chapters are separated by subject and Class 11/12. Choose a chapter to replace a planner block.</div>
    <label class="mt-10">Exam mode<select id="pafSwapExam"><option>CBSE</option><option>NEET</option><option>JEE</option></select></label>
    <label class="mt-10">Chapter<select id="pafSwapChapter"><option value="">Select chapter</option></select></label>
    <button class="btn btn-primary mt-12" onclick="pafChooseSwap()">Use This Chapter</button>`,true);
  setTimeout(()=>pafPopulateSwap(),0);
}
function pafPopulateSwap(){
  const e=document.getElementById('pafSwapExam'),s=document.getElementById('pafSwapChapter');if(!e||!s)return;
  const groups=pafChapterOptions(e.value);
  s.innerHTML='<option value="">Select chapter</option>'+groups.map(g=>`<optgroup label="${esc(g.group)}">${g.items.map(x=>`<option value="${esc(g.items.map?x.name:x)}">${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
}
function pafChooseSwap(){
  const c=document.getElementById('pafSwapChapter')?.value;
  if(!c)return toast('Choose a chapter.');
  closeModal();
  // Preserve the user's existing block swap mechanism; store the requested chapter
  // so the next swap control can use it.
  DATA.pendingSmartSwap={chapter:c,date:todayStr()};
  save();toast(`🔀 ${c} selected. Use Swap on the target block to apply it.`);
}
document.addEventListener('change',e=>{if(e.target?.id==='pafSwapExam')pafPopulateSwap()});
function pafPractice(){
  if(typeof prgPractice==='function'){const s=Object.keys(DATA.subjects||{})[0]||'Physics';return prgPractice(s,prompt('Chapter name'));} 
  toast('Practice Counter is available from the Subject Tracker.');
}
function pafCleanPlan(){
  const date=plannerViewDate||todayStr();
  const before=(DATA.plannerEvents||[]).length;
  DATA.plannerEvents=(DATA.plannerEvents||[]).filter(b=>{
    if(b.date!==date)return true;
    const label=String(b.activity||b.title||b.name||'');
    const empty=!label.trim()&&!b.subject;
    const generated=b.generated===true||b.source==='ai'||b.source==='generated';
    return !(empty||generated&&(!b.locked&&!b.done));
  });
  const after=DATA.plannerEvents.length;
  pafEnsure();DATA.paf.lastClean=date;save();render();toast(`🧹 Cleaned ${before-after} stale/duplicate generated block${before-after===1?'':'s'}.`);
}
function pafAutoReplanAfterSkip(){
  const date=plannerViewDate||todayStr(),ov=(DATA.scheduleOverrides||{})[date]||{};
  if(!(ov.noAakash||ov.noTuition||ov.noVedantu||ov.holiday))return toast('No skipped commitment found for this day.');
  try{
    if(typeof generateTodaysPlan==='function'){generateTodaysPlan();pafEnsure();DATA.paf.lastAutoReplan=date;save();toast('🔄 Day replanned using the new available time.');return;}
  }catch(e){}
  toast('Use Plan My Day to rebuild the remaining schedule.');
}
function pafLimitedDay(){
  openModal(`<div class="card-head"><h3>🛟 I Have Only X Hours Today</h3></div>
    <div class="planner-addon-sub">Pragati will prioritize the most important work and avoid trying to fit your entire backlog into a short day.</div>
    <label class="mt-10">Hours available<input id="pafHours" type="number" min="0.5" step="0.5" value="2"></label>
    <button class="btn btn-primary mt-12" onclick="pafGenerateLimited()">Build priority plan</button>`,true);
}
function pafGenerateLimited(){
  const h=Math.max(.5,Number(document.getElementById('pafHours')?.value)||2);
  closeModal();
  DATA.limitedPlanMinutes=Math.round(h*60);
  save();
  try{if(typeof generateTodaysPlan==='function'){generateTodaysPlan();toast(`🛟 Plan rebuilt for ${h} hours of available study time.`);return;}}catch(e){}
  toast('Your time limit was saved. Generate Today’s Plan to apply it.');
}
function pafRenderTools(){
  pafEnsure();
  return `<div class="planner-addon">
    <h3>🛠️ Planner Controls</h3>
    <div class="planner-addon-sub">Small controls for real-life changes — no Exam-Eve or Exam-Morning modes.</div>
    <div class="planner-addon-grid">
      <button class="btn btn-soft" onclick="pafAutoReplanAfterSkip()">🔄 Replan After Skip</button>
      <button class="btn btn-soft" onclick="pafOpenTimeFit()">⏱️ What Can I Finish?</button>
      <button class="btn btn-soft" onclick="pafOpenCompletion()">✅ Complete Topic</button>
      <button class="btn btn-soft" onclick="pafSmartSwap()">🔀 Smart Swap</button>
      <button class="btn btn-soft" onclick="pafPractice()">🔢 Practice Counter</button>
      <button class="btn btn-soft" onclick="pafCleanPlan()">🧹 Clean My Plan</button>
      <button class="btn btn-primary" onclick="pafLimitedDay()">🛟 I Have Only X Hours</button>
    </div>
  </div>`;
}
</script>
