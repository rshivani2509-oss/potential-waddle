function chapterInUpcomingTest(subject, chapter, withinDays, date){
  return (DATA.upcomingTests||[]).some(t=>{
    const d = daysBetween(date, t.date);
    if(d < 0 || d > withinDays) return false;
    return t.chapters.some(c=>c.subject===subject && c.chapter===chapter);
  });
}
function testsCoveringChapter(subject, chapter, withinDays, date){
  return (DATA.upcomingTests||[]).filter(t=>{
    const d = daysBetween(date, t.date);
    if(d < 0 || d > withinDays) return false;
    return t.chapters.some(c=>c.subject===subject && c.chapter===chapter);
  });
}
function yesterdayGeneratedNotDone(date){
  const y = new Date(date); y.setDate(y.getDate()-1);
  const yStr = y.toISOString().slice(0,10);
  return (DATA.plannerEvents||[]).filter(b=>b.date===yStr && b.generated && !b.done);
}
// Weighted Priority Engine — Exam 40% / Weak Chapter 25% / Revision Due 20% / Homework 10% / Missed Yesterday 5%
// (+ a small extra boost when the covering test is a Periodic Test or Month-end Exam)
function computeChapterPriorities(date){
  date = date || todayStr();
  const missed = yesterdayGeneratedNotDone(date);
  const missedKeys = new Set(missed.map(b=>(b.subject||'')+'::'+(b.chapter||b.activity||'')));
  const slipSubjectRaw = getSlipTestSubject(date);
  const slipSubject = slipSubjectRaw ? (SLIP_SUBJECT_ALIASES[slipSubjectRaw] || slipSubjectRaw) : null;
  const rows = [];
  const relevantSubs = subjectNames();
  Object.keys(DATA.subjects).forEach(subj=>{
    if(!relevantSubs.includes(subj)) return;
    DATA.subjects[subj].chapters.forEach(ch=>{
      let examScore = 0, examWindow = 0;
      if(chapterInUpcomingTest(subj, ch.name, 1, date)){ examScore = 40; examWindow = 1; }
      else if(chapterInUpcomingTest(subj, ch.name, 3, date)){ examScore = 30; examWindow = 3; }
      else if(chapterInUpcomingTest(subj, ch.name, 7, date)){ examScore = 15; examWindow = 7; }
      let examTypeBoost = 0, priorityTestName = null;
      if(examWindow){
        const covering = testsCoveringChapter(subj, ch.name, examWindow, date);
        const priorityTest = covering.find(t=>isPriorityTestType(t.testType));
        if(priorityTest){ examTypeBoost = 6; priorityTestName = priorityTest.testType; }
      }
      const weakScore = ch.accuracy>0 ? Math.round(25*(1-ch.accuracy/100)) : (ch.ncert||ch.questions>0 ? 6 : 4);
      const dueRev = getDueRevisions().find(r=>r.subject===subj && r.chapter===ch.name);
      const revisionScore = dueRev ? 20 : 0;
      const homeworkScore = chapterHasPendingHomework(subj) ? 10 : 0;
      const missedScore = missedKeys.has(subj+'::'+ch.name) ? 5 : 0;
      const slipScore = (slipSubject && subj===slipSubject) ? 18 : 0;
      const mockFixScore = mockFixScoreFor(subj, ch.name) ? 22 : 0;
      // Chapters the student is deliberately compressing/skipping (Catch-Up Mode) don't compete
      // for study blocks — same treatment as an off-syllabus Class 11 chapter.
      if(ch.skipped) return;
      const total = examScore+examTypeBoost+weakScore+revisionScore+homeworkScore+missedScore+slipScore+mockFixScore;
      // Class 11 (last year's) chapters don't compete for full-size study blocks unless a real
      // upcoming exam actually covers them — otherwise they'd keep resurfacing and eating the day.
      // They still get a small guaranteed daily revision slot via the Class 11 recap block.
      if(chapterClassLevel(subj, ch)===11 && examScore===0) return;
      if(total>0) rows.push({subject:subj, chapter:ch.name, examScore, examTypeBoost, priorityTestName, weakScore, revisionScore, homeworkScore, missedScore, slipScore, mockFixScore, total, revisionStage: dueRev?(dueRev.stage||0)+1:null});
    });
  });
  return rows.sort((a,b)=>b.total-a.total);
}
function slotEnergyLevel(startMin){ return startMin < 11*60 ? 3 : startMin < 17*60 ? 2 : 1; } // morning=hardest, afternoon=medium, night=lightest
function pickChapterForEnergy(remaining, level){
  const match = remaining.find(r=>{
    const rank = SUBJECT_ENERGY_RANK[r.subject]||2;
    if(r.revisionScore>0 && level===1) return true; // revision naturally suits low-energy night slots
    return level===3 ? rank>=3 : level===2 ? rank===2 : rank<=2;
  });
  return match || remaining[0];
}
// Rough realistic-capacity estimate for the chapter-picker modal: how many free minutes today,
// after Vedantu + slip-test prep are accounted for, and how many chapters that translates to
// at a sane ~50 min/chapter (study chunk + its breather).
function estimateFreePlanningMinutes(date){
  const busyExtra = [];
  const vd = (((DATA.scheduleOverrides||{})[date]||{}).noVedantu) ? null : vedantuDecision(date);
  if(vd){
    const r = DATA.routine;
    busyExtra.push({start:r.vedantuSlot1Start, end:r.vedantuSlot1End});
    if(vd.attend===2) busyExtra.push({start:r.vedantuSlot2Start, end:r.vedantuSlot2End});
  }
  const free = getFreeSlots(date, busyExtra);
  let mins = free.reduce((a,s)=>a+(s.end-s.start),0);
  if(getSlipTestSubject(date)) mins = Math.max(0, mins-30);
  return mins;
}
// ---- Realistic capacity, grounded in actual follow-through, not just today's stated energy ----
// Looks at how much of the last 2 weeks' *generated* plan the student actually completed
// (excluding Fixed/Break blocks, which aren't "chosen" study). A student who reliably finishes
// what they plan gets the full time-based estimate; one who's been leaving a lot unfinished gets
// a gently lower, more honest number today — the plan should match real life, not just the clock.
function recentPlanCompletionRate(days=14){
  const today = todayStr();
  let total = 0, done = 0;
  for(let i=1;i<=days;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    (DATA.plannerEvents||[]).forEach(b=>{
      if(b.date!==ds || !b.generated) return;
      if(b.subject==='Fixed' || b.subject==='Break') return;
      total++;
      if(b.done) done++;
    });
  }
  if(total < 6) return null; // not enough history yet to say anything meaningful
  return done/total;
}
function realisticChapterCapacity(freeMin, date){
  const base = Math.max(2, Math.min(8, Math.round(freeMin/50)));
  const rate = date ? recentPlanCompletionRate(14) : null;
  if(rate==null) return base;
  // A small grace margin means 80%+ actual completion still gets the full time-based estimate —
  // this only pulls capacity DOWN for a real, sustained gap between planned and done, never up.
  const factor = clamp(rate + 0.2, 0.55, 1);
  return Math.max(2, Math.round(base * factor));
}
// Step 1 of plan generation: show the sorted priority list and let the student pick which
// chapters actually go into today's plan, with a realistic default selection pre-checked.
function openGeneratePlanModal(date){
  date = date || plannerViewDate || todayStr();
  const taper = isTaperWindow(date);
  let priorities = computeChapterPriorities(date);
  if(taper) priorities = filterPrioritiesForTaper(priorities);
  const mandatoryKeys = new Set(todaysMandatoryTopics(date).map(m=>m.subject+'::'+m.chapter));
  const freeMin = estimateFreePlanningMinutes(date);
  const energy = todaysEnergy(date);
  const energyMeta = ENERGY_LEVELS[energy];

function setGenPlanEnergy(date, level){
  setEnergy(date, level);
  openGeneratePlanModal(date); // rebuild the modal so capacity/durations reflect the new energy level
}
function setGenPlanSelection(n){
  document.querySelectorAll('.genplan-chk').forEach((el,i)=>{ el.checked = i<n; });
  updateGenPlanCount();
}
function updateGenPlanCount(){
  const boxes = Array.from(document.querySelectorAll('.genplan-chk:checked'));
  const n = boxes.length;
  let total = 0;
  boxes.forEach(b=>{
    document.querySelectorAll(`.genplan-task[data-key="${CSS.escape(b.value)}"]`).forEach(inp=>{
      total += parseInt(inp.value)||0;
    });
  });
  const c11On = document.getElementById('c11_on');
  if(c11On && c11On.checked){
    const c11Dur = document.getElementById('c11_dur');
    total += c11Dur ? (parseInt(c11Dur.value)||0) : 0;
  }
  const el = document.getElementById('genPlanCount');
  if(!el) return;
  const freeMin = parseInt(el.dataset.freeMin)||0;
  const freeH = Math.floor(freeMin/60), freeM = freeMin%60;
  const diff = freeMin - total;
  const baseText = n===0 ? 'No chapters selected — ' : `${n} chapter${n===1?'':'s'} selected, ~${Math.floor(total/60)}h ${total%60}m of study — `;
  if(diff < -15){
    el.innerHTML = `${baseText}<strong style="color:var(--coral);">${Math.abs(diff)} min over your ~${freeH}h ${freeM}m free today.</strong> Trim a step or uncheck a chapter to keep it realistic.`;
  } else if(diff > 60){
    el.innerHTML = `${baseText}<strong style="color:var(--sky);">${diff} min of free time left over.</strong> Room to add another chapter if you like.`;
  } else {
    el.innerHTML = `${baseText}<strong style="color:var(--sage);">fits comfortably</strong> within your ~${freeH}h ${freeM}m free today.`;
  }
}
function confirmGeneratePlan(date){
  const TASK_LABEL = {Lecture:'🎥 Lecture', NCERT:'📖 NCERT Reading', Qns:'✍️ Questions'};
  const selected = Array.from(document.querySelectorAll('.genplan-chk:checked')).map(el=>{
    const [subject, chapter] = el.value.split('::');
    const tasks = [];
    document.querySelectorAll(`.genplan-task[data-key="${CSS.escape(el.value)}"]`).forEach(inp=>{
      const dur = parseInt(inp.value)||0;
      if(dur > 0) tasks.push({type: TASK_LABEL[inp.dataset.type] || inp.dataset.type, duration: dur});
    });
    return {subject, chapter, tasks};
  }).filter(c => c.tasks.length); // chapters with every step zeroed out just don't get scheduled
  const c11On = document.getElementById('c11_on');
  let class11Override = {mode:'skip', duration: 15};
  if(c11On && c11On.checked){
    const sel = document.getElementById('c11_select');
    const dur = Math.max(5, parseInt(document.getElementById('c11_dur').value)||15);
    if(sel && sel.value){
      const [subject, chapter] = sel.value.split('::');
      class11Override = {mode:'manual', subject, chapter, duration: dur};
    } else {
      class11Override = {mode:'skip', duration: dur};
    }

  let vedantuOverride = null;
  if(document.getElementById('ved_name_1')){
    vedantuOverride = [];

      if(!nameEl) return;
      vedantuOverride.push({slot:n, subject: subjEl ? subjEl.value : subjectNames()[0], lessonName: nameEl.value.trim()});
    });
  }
  closeModal();
  generateTodaysPlan(date, selected, class11Override, vedantuOverride);
}
// The button the whole feature revolves around: reads routine + syllabus + exams + revisions + homework + yesterday, and lays out the whole day
function generateTodaysPlan(date, selectedChapters, class11Override, vedantuOverride){
  date = date || plannerViewDate || todayStr();
  let selectedSet = null;
  const durationMap = new Map(); // chapter key -> array of {type, duration} steps
  if(Array.isArray(selectedChapters)){
    selectedSet = new Set();
    selectedChapters.forEach(item=>{
      if(typeof item === 'string'){ selectedSet.add(item); }
      else if(item && item.subject && item.chapter){
        const key = item.subject+'::'+item.chapter;
        selectedSet.add(key);
        if(Array.isArray(item.tasks) && item.tasks.length){
          durationMap.set(key, item.tasks.map(t=>({type:t.type||null, duration:Math.max(5, t.duration)})));
        } else if(item.duration){ // backward-compat: a plain single duration, no step split
          durationMap.set(key, [{type:null, duration:Math.max(15, item.duration)}]);
        }
      }
    });
  } else if(selectedChapters instanceof Set){
    selectedSet = selectedChapters;
  }
  // Regeneration only replaces unfinished AI work. Completed work is history and must keep its
  // time slot so the next plan cannot accidentally schedule over it. Locked/manual blocks are untouched.
  DATA.plannerEvents = (DATA.plannerEvents||[]).filter(b => !(b.date===date && b.generated && !b.locked && !b.done));
  const events = [], busyExtra = [];
  // Master Schedule fixed commitments (school, travel, get ready, dinner, tuition/Aakash) —
  // inserted as real blocks so the Timeline visually matches the routine, not just avoids it.
  getFixedBlocksForDate(date).forEach(b=>{
    events.push({id:uid(), date, startTime:b.start, endTime:b.end, subject:'Fixed', activity:b.label, done:false, generated:true, locked:true});
  });
  const vd = (((DATA.scheduleOverrides||{})[date]||{}).noVedantu) ? null : vedantuDecision(date);
  if(vd){
    const r = DATA.routine;
    // Each slot keeps subject:'Vedantu' (so the completion tracker still groups them together),
    // but when the student typed an actual lesson name/subject in the modal, that becomes the
    // visible label — and is stashed as vedantuSubject/chapter so it's still filterable by subject.
    const ov1 = vedantuOverride && vedantuOverride.find(v=>v.slot===1);
    const label1 = ov1 && ov1.lessonName ? `🟣 Vedantu — ${ov1.subject}: ${ov1.lessonName}` : 'Attend lecture — '+vd.reason;
    events.push({id:uid(), date, startTime:r.vedantuSlot1Start, endTime:r.vedantuSlot1End, subject:'Vedantu', activity:label1, done:false, generated:true, chapter: ov1?.lessonName || undefined, vedantuSubject: ov1?.subject || undefined});
    busyExtra.push({start:r.vedantuSlot1Start, end:r.vedantuSlot1End});
    if(vd.attend===2){
      const ov2 = vedantuOverride && vedantuOverride.find(v=>v.slot===2);
      const label2 = ov2 && ov2.lessonName ? `🟣 Vedantu — ${ov2.subject}: ${ov2.lessonName}` : 'Attend second lecture — clearing backlog';
      events.push({id:uid(), date, startTime:r.vedantuSlot2Start, endTime:r.vedantuSlot2End, subject:'Vedantu', activity:label2, done:false, generated:true, chapter: ov2?.lessonName || undefined, vedantuSubject: ov2?.subject || undefined});
      busyExtra.push({start:r.vedantuSlot2Start, end:r.vedantuSlot2End});
    }
  }
  const free = getFreeSlots(date, busyExtra);
  // Daily slip test: dedicate the first chunk of the earliest free slot (usually the pre-school
  // morning window) to targeted prep, since the test itself happens early in the school day.
  const slipSubjectRaw = getSlipTestSubject(date);
  if(slipSubjectRaw && free.length){
    const first = free[0];
    const dur = Math.min(30, first.end - first.start);
    if(dur >= 15){
      events.push({id:uid(), date, startTime:toTimeStr(first.start), endTime:toTimeStr(first.start+dur), subject:'Slip Test', activity:`📝 Slip Test Prep — ${slipSubjectRaw} (yesterday's mistakes + quick revision)`, done:false, generated:true, subtasks:[makeSubtask('ncert'), makeSubtask('qns')]});
      first.start += dur;
    }
  }
  const priorities0 = computeChapterPriorities(date);
  const taper = isTaperWindow(date);
  const recap = !taper ? isRecapWindow(date) : null;
  if(recap && free.length){
    const pick = recapBlockPick(date);
    const range = consumeFromSlots(free, RECAP_BLOCK_MIN);
    if(range){
      events.push({id:uid(), date, startTime:toTimeStr(range.start), endTime:toTimeStr(range.end), subject:pick.subject, activity: pick.label + ` (ramp-down · ${recap.key} in ${recap.days}d)`, done:false, generated:true, chapter:pick.chapter, subtasks:pick.chapter?undefined:[makeSubtask('qns')]});
    }
  }
  const priorities = taper ? filterPrioritiesForTaper(priorities0) : priorities0;
  const used = new Set();
  // Guarantee daily coverage: at least one topic each for Aakash and School upcoming exams,
  // scheduled before the weighted priority engine fills the rest of the day.
  ['Aakash','School'].forEach(src=>{
    const pick = nearestUpcomingChapterForSource(src, date, used);
    if(!pick) return;
    if(selectedSet && !selectedSet.has(pick.subject+'::'+pick.chapter)) return;
    const wantTasks = durationMap.get(pick.subject+'::'+pick.chapter);
    const wantDur = wantTasks ? taskListTotal(wantTasks) : null;
    const range = consumeFromSlots(free, wantDur ? clamp(wantDur, 20, 60) : 35);
    if(!range) return;
    used.add(pick.subject+'::'+pick.chapter);
    events.push({id:uid(), date, startTime:toTimeStr(range.start), endTime:toTimeStr(range.end), subject:pick.subject, activity:`🎯 ${src} Exam Prep — ${pick.chapter} (${pick.testName})`, done:false, generated:true, chapter:pick.chapter, subtasks:defaultStudySubtasks()});
  });
  // Class 11 recap — either the student's explicit pick/skip from the plan modal (class11Override),
  // or, for calls that bypass the modal (e.g. schedule-override regeneration), the automatic
  // prerequisite-linked suggestion, same as before. A manual pick always overrides the on/off setting
  // since ticking the box in the modal IS the student's explicit "yes, today" choice.
  const wantClass11 = class11Override ? class11Override.mode === 'manual' : (DATA.routine.class11Enabled !== false);
  if(wantClass11){
    let c11pick = null, c11min;
    if(class11Override && class11Override.mode === 'manual'){
      c11min = Math.max(5, Number(class11Override.duration)||15);
      if(findChapterByName(class11Override.subject, class11Override.chapter)){
        c11pick = {subject: class11Override.subject, chapter: class11Override.chapter, linkedTo: null};
      }
    } else {
      c11min = Math.max(5, Number(DATA.routine.class11DailyMin)||15);
      const focusChapters = priorities
        .filter(p=>{ const cObj = findChapterByName(p.subject, p.chapter); return cObj && chapterClassLevel(p.subject, cObj)===12; })
        .slice(0,5)
        .map(p=>({subject:p.subject, chapter:p.chapter}));
      c11pick = nearestClass11RecapChapter(date, used, focusChapters);
    }
    if(c11pick && !used.has(c11pick.subject+'::'+c11pick.chapter)){
      const range = consumeFromSlots(free, c11min);
      if(range){
        used.add(c11pick.subject+'::'+c11pick.chapter);
        const label = c11pick.linkedTo ? `📘 Class 11 Recap — ${c11pick.chapter} (basics for ${c11pick.linkedTo})` : `📘 Class 11 Recap — ${c11pick.chapter}`;
        events.push({id:uid(), date, startTime:toTimeStr(range.start), endTime:toTimeStr(range.end), subject:c11pick.subject, activity:label, done:false, generated:true, chapter:c11pick.chapter, subtasks:[makeSubtask('ncert'), makeSubtask('qns')]});
      }
    }
  }
  // When the student picked specific chapters in the modal, the free-slot filler only draws
  // from that pool — everything else (Fixed/Vedantu/slip-prep/guaranteed picks/Class 11 recap)
  // still happens automatically. Each chapter is split into its own steps (Lecture/NCERT/Qns, or
  // a single "Study" step for auto-pulled fallback chapters), and each step is scheduled as its
  // own block, for exactly as long as the student set — a step (or a whole chapter) can span more
  // than one free window across the day rather than being forced into one lump block.
  const pool = selectedSet ? priorities.filter(p=>selectedSet.has(p.subject+'::'+p.chapter)) : priorities;
  const remainingMin = new Map();   // task key -> minutes left
  const taskPool = [];              // flattened {subject, chapter, type, key, ...scoring fields}
  const pooledChapterKeys = new Set();
  const addChapterTasks = (p)=>{
    const ckey = p.subject+'::'+p.chapter;
    if(pooledChapterKeys.has(ckey)) return;
    pooledChapterKeys.add(ckey);
    const tasks = durationMap.has(ckey) ? durationMap.get(ckey) : [{type:null, duration: suggestedChapterDuration(p, date)}];
    tasks.forEach(t=>{
      const tkey = ckey+'::'+(t.type||'Study');
      remainingMin.set(tkey, t.duration);
      taskPool.push({subject:p.subject, chapter:p.chapter, type:t.type, key:tkey, examScore:p.examScore, revisionScore:p.revisionScore, slipScore:p.slipScore, revisionStage:p.revisionStage});
    });
  };
  pool.forEach(addChapterTasks);
  free.forEach(slot=>{
    let cursor = slot.start;
    const level = slotEnergyLevel(slot.start);
    let usedFallback = false;
    while(slot.end - cursor >= 15){
      let remaining = taskPool.filter(t=>!used.has(t.key) && (remainingMin.get(t.key)||0) > 0);
      // Once the chosen chapters run out but real study time is still left, don't dump it
      // all into one long undifferentiated block — pull the next-priority chapters from the
      // full syllabus so surplus time stays chapter-relevant instead of vague "revision".
      if(!remaining.length && selectedSet){
        priorities.filter(p=>!pooledChapterKeys.has(p.subject+'::'+p.chapter)).forEach(addChapterTasks);
        remaining = taskPool.filter(t=>!used.has(t.key) && (remainingMin.get(t.key)||0) > 0);
        usedFallback = true;
      }
      if(!remaining.length) break;
      const pick = pickChapterForEnergy(remaining, level);
      if(!pick) break;
      const want = remainingMin.get(pick.key) || 40;
      // Cap a single sitting at 60 min for realistic focus — anything longer continues later in
      // the day (or after a break) rather than one unbroken marathon block.
      const chunk = Math.max(15, Math.min(want, slot.end-cursor, 60));
      let label = pick.slipScore>0 ? `${pick.chapter} — slip test focus` : (pick.revisionScore>0 ? `Revision (Stage ${pick.revisionStage}): ${pick.chapter}` : (pick.examScore>=30 ? `${pick.chapter} — exam prep` : pick.chapter));
      if(pick.type) label += ` — ${pick.type}`;
      if(usedFallback) label += ' (extra — more free time than chapters picked)';
      // A block that already IS one specific step (Lecture/NCERT/Qns, from the plan modal's split)

      // e.g. surplus free time or a simple add) gets the full lecture/NCERT/questions checklist.
      events.push({id:uid(), date, startTime:toTimeStr(cursor), endTime:toTimeStr(cursor+chunk), subject:pick.subject, activity:label, done:false, generated:true, chapter:pick.chapter, taskType:pick.type||undefined, subtasks: pick.type ? undefined : defaultStudySubtasks()});

      cursor += chunk;
      // A breather after every study chunk keeps the day realistic instead of a wall-to-wall grind —
      // longer after a full 45+ min sitting, and longer still after a draining task type (solving
      // questions/numericals) than after a lighter one (watching a lecture or reading NCERT).

        cursor += breakLen;
      }
    }

    // with breathers between, instead of one unrealistic multi-hour undifferentiated block.

      const activity = DATA.mistakes.length ? 'Mistake Notebook review' : 'Quick revision / flashcards';
      events.push({id:uid(), date, startTime:toTimeStr(cursor), endTime:toTimeStr(cursor+dur), subject:'Revision', activity, done:false, generated:true});
      cursor += dur;
      if(slot.end - cursor >= 25){
        events.push({id:uid(), date, startTime:toTimeStr(cursor), endTime:toTimeStr(cursor+2), subject:'Break', activity:'☕ 2-min reset — water + eye rest + stretch', done:false, generated:true});
        cursor += 2;
      }

}

// Compact "how are you today" strip at the top of the planner — same energy state that drives
// Generate Plan's realistic chapter count, editable right here so the whole page (priority list,
// MIT Top 3, generate plan) stays in sync without a trip to the Health tab. Also surfaces the
// sleep-based auto-suggestion and a nudge for doubts that have been sitting unresolved.
// ---- Shared "make the rest of today more realistic" compressor ----
// Used both when energy drops mid-day and when something eats into study time unexpectedly.
// Removes lowest-value not-yet-started blocks first (Breaks, then filler Revision, then regular
// chapters — Exam Prep and Slip Test survive longest) until enough minutes are freed, leaving a
// visible gap rather than pretending the lost time didn't happen.
function compressRemainingBlocks(date, minutesToFree){
  if(minutesToFree<=0) return {removed:0, freed:0};
  const nowMin = date===todayStr() ? (new Date().getHours()*60+new Date().getMinutes()) : 0;
  const blocks = (DATA.plannerEvents||[]).filter(b=>b.date===date && !b.done && !b.locked && b.subject!=='Fixed' && toMin(b.startTime)!=null && toMin(b.startTime)>=nowMin);
  if(!blocks.length) return {removed:0, freed:0};
  const rank = b => {
    if(b.subject==='Break') return 0;
    if(b.subject==='Revision') return 1;
    if(b.activity && /Exam Prep/.test(b.activity)) return 4;
    if(b.subject==='Slip Test') return 5;
    return 2; // regular chapter study blocks
  };
  const ordered = [...blocks].sort((a,b)=>rank(a)-rank(b));
  let freed = 0; const toRemove = [];
  for(const b of ordered){
    if(freed >= minutesToFree) break;
    toRemove.push(b.id);
    freed += (toMin(b.endTime)-toMin(b.startTime))||0;
  }
  if(!toRemove.length) return {removed:0, freed:0};
  const removeSet = new Set(toRemove);
  DATA.plannerEvents = DATA.plannerEvents.filter(b=>!(b.date===date && removeSet.has(b.id)));
  save();
  return {removed:toRemove.length, freed};
}
// Mid-day energy re-check: if energy is dialed DOWN after some of today's plan already exists,
// trim the not-yet-started portion of the day to match — instead of only affecting tomorrow's
// Generate Plan like before. Dialing energy UP never adds anything back automatically.
function setEnergyAndReflow(date, level){
  const before = ENERGY_LEVELS[todaysEnergy(date)].mult;
  setEnergy(date, level, true);
  if(date===todayStr()){
    const after = ENERGY_LEVELS[level].mult;
    if(after < before){
      const nowMin = new Date().getHours()*60 + new Date().getMinutes();
      const remaining = (DATA.plannerEvents||[]).filter(b=>b.date===date && !b.done && !b.locked && b.subject!=='Fixed' && toMin(b.startTime)!=null && toMin(b.startTime)>=nowMin);
      const totalMin = remaining.reduce((a,b)=>a+((toMin(b.endTime)-toMin(b.startTime))||0),0);
      const target = Math.round(totalMin * (1 - after/before));
      if(target > 15){
        const r = compressRemainingBlocks(date, target);
        if(r.removed) toast(`${ENERGY_LEVELS[level].icon} Energy dropped — trimmed ${r.removed} block${r.removed===1?'':'s'} (~${r.freed}m) from the rest of today so the plan stays realistic.`);
      }
    }
  }
  render();
}

function weeklyRetrospectiveByWeekday(weeks=6){

function todayTimeSnapshot(date){

  const studyBlocks = blocks.filter(b=>!['Break','Fixed','Sleep'].includes(b.subject));
  const plannedStudyMin = studyBlocks.reduce((a,b)=>a+Math.max(0,(toMin(b.endTime)||0)-(toMin(b.startTime)||0)),0);
  const completedStudyMin = studyBlocks.filter(b=>b.done).reduce((a,b)=>a+Math.max(0,(toMin(b.endTime)||0)-(toMin(b.startTime)||0)),0);
  const upcoming = blocks.filter(b=>!b.done && toMin(b.startTime)!=null && (!isToday || toMin(b.endTime)>nowMin))
    .sort((a,b)=>toMin(a.startTime)-toMin(b.startTime));
  const active = isToday ? currentActiveBlock() : null;
  const next = upcoming.find(b=>!active || b.id!==active.id) || null;
  const free = estimateFreePlanningMinutes(date);
  const remainingPlanned = studyBlocks.filter(b=>!b.done && (!isToday || (toMin(b.endTime)||0)>nowMin))
    .reduce((a,b)=>a+Math.max(0,(toMin(b.endTime)||0)-Math.max(nowMin,toMin(b.startTime)||0)),0);
  const remainingFree = isToday ? Math.max(0, free) : free;
  const buffer = remainingFree - remainingPlanned;
  const overdue = isToday ? studyBlocks.filter(b=>!b.done && (toMin(b.endTime)||0)<nowMin) : [];
  const availableUntilBed = isToday ? Math.max(0,toMin(DATA.routine.bedtime)-nowMin) : free;
  return {nowMin,isToday,active,next,plannedStudyMin,completedStudyMin,remainingPlanned,remainingFree,buffer,overdue,availableUntilBed,studyBlocks,taskBlocks};
}

function todayFocusProfile(date){
  date = date || todayStr();
  const mandatory = todaysMandatoryTopics(date).map(m=>({subject:m.subject, chapter:m.chapter, mandatory:true, score:1000-(m.daysAway||0)*10}));
  let priorities = computeChapterPriorities(date).map(p=>({subject:p.subject, chapter:p.chapter, mandatory:false, score:Number(p.total)||0, raw:p}));
  const merged = [];
  const seen = new Set();
  [...mandatory,...priorities].forEach(x=>{ const k=x.subject+'::'+x.chapter; if(!seen.has(k)){seen.add(k); merged.push(x);} });
  merged.sort((a,b)=>(b.mandatory-a.mandatory)||(b.score-a.score));
  const subjectScore = {};
  merged.forEach(x=>{ subjectScore[x.subject]=(subjectScore[x.subject]||0)+(x.score||0)+(x.mandatory?350:0); });
  const subjects = Object.entries(subjectScore).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,2);
  if(!subjects.length) subjects.push('Physics');
  const major = subjects[0];
  const light = subjects[1] || null;
  const focusChapters = subjects.map(s=>{
    const x=merged.find(m=>m.subject===s);
    return x ? x.chapter : null;
  }).filter(Boolean);
  return {subjects,major,light,focusChapters,items:merged};
}

  if(!b || b.subject==='Fixed' || b.subject==='Break' || b.done) return toast('Only an unfinished study block can be resized.');
  const oldStart=toMin(b.startTime), oldEnd=toMin(b.endTime); if(oldStart==null||oldEnd==null) return;
  const newEnd=oldEnd+delta;
  if(newEnd<=oldStart+5) return toast('Keep at least 5 minutes in a study block.');
  if(newEnd>24*60) return toast('That extension would go past midnight.');

  const later=blocks.filter(x=>x.id!==b.id && toMin(x.startTime)>=oldEnd);
  const movable=later.filter(x=>x.subject!=='Fixed' && x.subject!=='Break');
  const fixedLater=later.filter(x=>x.subject==='Fixed');

  // Simulate the complete shift before changing anything. This prevents a later
  // movable block from being pushed into a fixed commitment.
  const proposed=movable.map(x=>({
    x,
    start:toMin(x.startTime)+delta,
    end:toMin(x.endTime)+delta
  }));
  for(const q of proposed){
    if(q.start<0 || q.end>24*60) return toast('Not enough room to shift the following study blocks.');
  }
  const proposedFixed = fixedLater.map(x=>({x,start:toMin(x.startTime),end:toMin(x.endTime)}));
  const allAfter = [...proposed.map(q=>({start:q.start,end:q.end,subject:q.x.subject})), ...proposedFixed]
    .sort((a,b)=>a.start-b.start);
  for(let i=1;i<allAfter.length;i++){
    if(allAfter[i-1].end > allAfter[i].start){
      const conflict = allAfter[i].subject==='Fixed' ? 'a fixed commitment' : 'another study block';
      return toast(`Cannot change this block — it would overlap ${conflict}.`);
    }
  }

  for(const q of proposed){ q.x.startTime=toTimeStr(q.start); q.x.endTime=toTimeStr(q.end); }
  b.endTime=toTimeStr(newEnd);
  b.manualDuration=true;
  b.generated=false;
  save(); render();
  toast(`${delta>0?'Extended':'Reduced'} ${Math.abs(delta)} min — no time conflicts created.`);
}
function plannerAddReset(id,minutes=2){
  const b=(DATA.plannerEvents||[]).find(x=>x.id===id);
  if(!b || b.subject==='Fixed' || b.subject==='Break') return;
  const end=toMin(b.endTime);
  if(end==null) return;
  if(minutes<1) return toast('Reset must be at least 1 minute.');
  if(end+minutes>24*60) return toast('There is not enough time for a reset before midnight.');

  const all=(DATA.plannerEvents||[]).filter(x=>x.date===b.date && x.id!==b.id);
  const later=all.filter(x=>{ const st=toMin(x.startTime); return st!=null && st>=end; })
    .sort((a,c)=>toMin(a.startTime)-toMin(c.startTime));

  // Simulate every shifted block before mutating anything. This catches:
  // 1) a shifted study block running past midnight, and
  // 2) a shifted study block colliding with any later fixed or unshifted block.
  const shifted=later.filter(x=>x.subject!=='Fixed').map(x=>({
    x, start:toMin(x.startTime)+minutes, end:toMin(x.endTime)+minutes
  }));
  for(const q of shifted){
    if(q.start<0 || q.end>24*60) return toast('Not enough room to insert this reset without going past midnight.');
  }

  const fixed=later.filter(x=>x.subject==='Fixed').map(x=>({
    x, start:toMin(x.startTime), end:toMin(x.endTime)
  }));
  const shiftedAndFixed=[...shifted.map(q=>({start:q.start,end:q.end,subject:q.x.subject})),
                         ...fixed.map(q=>({start:q.start,end:q.end,subject:'Fixed'}))]
    .sort((a,c)=>a.start-c.start);
  for(let i=1;i<shiftedAndFixed.length;i++){
    if(shiftedAndFixed[i-1].end>shiftedAndFixed[i].start){
      const conflict=shiftedAndFixed[i].subject==='Fixed'?'a fixed commitment':'another study block';
      return toast(`Cannot insert the reset — it would overlap ${conflict}.`);
    }
  }

  for(const q of shifted){
    q.x.startTime=toTimeStr(q.start);
    q.x.endTime=toTimeStr(q.end);
  }
  DATA.plannerEvents.push({
    id:uid(), date:b.date, startTime:b.endTime, endTime:toTimeStr(end+minutes),
    subject:'Break', activity:`${minutes}-min reset · water + eye rest + stretch`,
    goals:['Reset briefly — no scrolling'], subtasks:[], done:false, generated:false, locked:true
  });
  save(); render(); toast(`☕ ${minutes}-minute reset inserted safely.`);
}

  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}

function savePlannerBlock(editId){
  const date = document.getElementById('f_date').value;
  const startTime = document.getElementById('f_start').value;
  const endTime = document.getElementById('f_end').value;
  if(!date || !startTime || !endTime) return toast('Please fill date, start and end time.');
  if(endTime <= startTime) return toast('End time must be after start time.');
  const subject = document.getElementById('f_subject').value;
  const activity = document.getElementById('f_activity').value.trim();
  const goals = document.getElementById('f_goals').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!DATA.plannerEvents) DATA.plannerEvents = [];
  // Build the subtask checklist from whichever of the three step-checkboxes are ticked,
  // carrying over each subtask's existing done-state (by kind) so re-saving never resets progress.
  const priorSubtasks = editId ? ((DATA.plannerEvents.find(x=>x.id===editId)||{}).subtasks||[]) : [];
  const subtasks = [];
  ['lecture','ncert','qns'].forEach(kind=>{
    const el = document.getElementById('f_sub_'+kind);
    if(el && el.checked){
      const prior = priorSubtasks.find(s=>s.kind===kind);
      subtasks.push(prior ? prior : makeSubtask(kind));
    }
  });
  if(editId){
    const b = DATA.plannerEvents.find(x=>x.id===editId);
    Object.assign(b, {date, startTime, endTime, subject, activity, goals, subtasks});
    // The moment you hand-edit an auto-generated block, it becomes yours — Generate Plan
    // will never silently overwrite it again unless you delete it yourself.
    if(b.generated && b.subject!=='Fixed') b.generated = false;
  } else {
    DATA.plannerEvents.push({id:uid(), date, startTime, endTime, subject, activity, goals, subtasks, done:false});
  }
  plannerViewDate = date;
  save(); closeModal(); render(); toast('Time block saved.');
}
// ---- Actual-time calibration: learn each subject's real pace vs. the estimate ----
// When a study block is marked done, we ask how long it actually took (optional — cancel/blank
// just skips it) and fold the ratio into a per-subject running average, so future plan durations
// for that subject drift toward what's actually true instead of a flat guess.
function subjectTimeCalibrationFactor(subject){
  const c = (DATA.timeCalibration||{})[subject];
  if(!c || c.count < 3) return 1;
  return clamp(c.sumRatio / c.count, 0.7, 1.6);
}
function recordActualTime(subject, estimatedMin, actualMin){
  if(!estimatedMin || !actualMin || actualMin<=0) return;
  const ratio = clamp(actualMin/estimatedMin, 0.3, 3);
  if(!DATA.timeCalibration) DATA.timeCalibration = {};
  const c = DATA.timeCalibration[subject] || {sumRatio:0, count:0};
  c.sumRatio += ratio; c.count += 1;
  DATA.timeCalibration[subject] = c;
}
function togglePlannerBlockDone(id){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===id);
  if(!b) return;
  const turningOn = !b.done;
  b.done = !b.done;
  // Ask for real elapsed time only when finishing (not un-checking) a real study block for a
  // tracked subject — skip Fixed/Break/Revision-filler blocks where "estimate vs actual" isn't meaningful.
  if(turningOn && subjectNames().includes(b.subject) && toMin(b.startTime)!=null && toMin(b.endTime)!=null){
    const estimated = toMin(b.endTime) - toMin(b.startTime);
    const answer = window.prompt(`How many minutes did "${b.activity||b.chapter||b.subject}" actually take? (Planned: ${estimated}m — leave blank to skip)`, '');
    if(answer && answer.trim() !== ''){
      const actual = parseInt(answer);
      if(actual > 0) recordActualTime(b.subject, estimated, actual);
    }
  }
  save(); render();
}
/* ---------------- Study-block subtasks: NCERT reading / Lecture / Question solving ----------------
   Each academic study block can carry its own little checklist so the three natural steps of
   learning a chapter — watch the lecture, read the NCERT portion, solve questions — are tracked
   as ticks inside that one block instead of needing separate blocks for each. */
const SUBTASK_KIND_META = {
  lecture: {icon:'🎥', label:'Watch lecture'},
  ncert:   {icon:'📖', label:'Read NCERT'},
  qns:     {icon:'✍️', label:'Solve questions'},
};
function makeSubtask(kind, label){
  const meta = SUBTASK_KIND_META[kind] || {icon:'☑️', label:label||'Task'};
  return {id:uid(), kind, label: label || meta.label, done:false, timerRunning:false, timerStartedAt:null, timerAccumMs:0, breakPrompted:false};
}
// Default checklist for a plain study session covering a chapter end-to-end.
function defaultStudySubtasks(){
  return [makeSubtask('lecture'), makeSubtask('ncert'), makeSubtask('qns')];

function subtaskElapsedMs(st){
  return (st.timerAccumMs||0) + (st.timerRunning && st.timerStartedAt ? (Date.now()-st.timerStartedAt) : 0);
}
function findSubtask(blockId, subtaskId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  const st = b && Array.isArray(b.subtasks) ? b.subtasks.find(s=>s.id===subtaskId) : null;
  return {b, st};
}
// Small inline ▶/⏸ timer per subtask — lets the student time each step (lecture / NCERT /
// questions) individually without opening full Focus Mode. Persisted on the subtask itself so
// it survives a reload, same way Focus Sessions do. Pomodoro-style: after subtaskPomodoroMin
// minutes of continuous running on one subtask, it auto-pauses and nudges a short break.
function toggleSubtaskTimer(blockId, subtaskId){
  const {st} = findSubtask(blockId, subtaskId);
  if(!st || st.done) return;
  if(st.timerRunning){
    st.timerAccumMs = subtaskElapsedMs(st); st.timerRunning = false; st.timerStartedAt = null;
    save(); render();
  } else {
    st.timerRunning = true; st.timerStartedAt = Date.now(); st.breakPrompted = false;
    save(); render(); tickSubtaskTimers();
  }
}
let subtaskTimerInterval = null;
function tickSubtaskTimers(){
  clearInterval(subtaskTimerInterval);
  subtaskTimerInterval = setInterval(()=>{
    let anyRunning = false;
    const pomodoroMs = (DATA.routine.subtaskPomodoroMin||25)*60000;
    let breakFired = null;
    (DATA.plannerEvents||[]).forEach(b=>{
      (b.subtasks||[]).forEach(st=>{
        if(!st.timerRunning) return;
        anyRunning = true;
        const continuousMs = st.timerStartedAt ? (Date.now()-st.timerStartedAt) : 0;
        if(!st.breakPrompted && continuousMs >= pomodoroMs){
          // Auto-pause and bank the time — same effect as tapping ⏸ — then flag so it doesn't
          // keep re-firing every second while paused.
          st.timerAccumMs = subtaskElapsedMs(st); st.timerRunning = false; st.timerStartedAt = null;
          st.breakPrompted = true;
          breakFired = st;
          return;

// Free time on a given date excluding a specific block (so it can be re-placed) and excluding
// every OTHER already-scheduled block that day, not just Master Schedule fixed commitments —
// used when moving a missed block, not when generating from scratch.
function getFreeSlotsExcludingBlock(date, excludeBlockId){
  const r = DATA.routine;
  const dayEnd = toMin(r.bedtime);
  let dayStart = toMin(r.wakeTime);
  if(date === todayStr()){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    dayStart = Math.max(dayStart, Math.min(Math.ceil(nowMin/5)*5, dayEnd));
  }
  const busy = (DATA.plannerEvents||[])
    .filter(b=>b.date===date && b.id!==excludeBlockId && b.startTime && b.endTime)
    .map(b=>({start:b.startTime, end:b.endTime}));
  const merged = mergeBusyBlocks(busy);
  const free = []; let cursor = dayStart;
  merged.forEach(b=>{
    if(b.start > cursor) free.push({start:cursor, end:Math.min(b.start,dayEnd)});
    cursor = Math.max(cursor, b.end);
  });
  if(cursor < dayEnd) free.push({start:cursor, end:dayEnd});
  return free.filter(s=>s.end-s.start >= 10);
}
// "Realistic planner" adaptation #1: didn't finish something in time today — move it into the
// next open gap today instead of leaving it stranded as a red missed block.
function rescheduleBlockToNextSlot(blockId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  if(!b) return;
  const duration = Math.max(10, (toMin(b.endTime)||0) - (toMin(b.startTime)||0));
  const free = getFreeSlotsExcludingBlock(b.date, b.id);
  const slot = free.find(s => (s.end-s.start) >= duration);
  if(!slot){ toast("No free slot big enough left today — try pushing it to tomorrow instead."); return; }
  b.startTime = toTimeStr(slot.start);
  b.endTime = toTimeStr(slot.start+duration);
  b.rescheduled = (b.rescheduled||0) + 1;
  save(); render();
  toast(`↻ Moved to ${fmtTime(b.startTime)}–${fmtTime(b.endTime)} today.`);
}
// "Realistic planner" adaptation #2: couldn't get to it today at all — carry it into tomorrow's
// timeline (locked, so a fresh Generate Plan won't wipe it out) instead of just losing it.
function rescheduleBlockToTomorrow(blockId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  if(!b) return;
  const tmr = new Date(b.date); tmr.setDate(tmr.getDate()+1);
  const tmrDate = tmr.toISOString().slice(0,10);
  const duration = Math.max(10, (toMin(b.endTime)||0) - (toMin(b.startTime)||0));
  const free = getFreeSlotsExcludingBlock(tmrDate, null);
  const slot = free.find(s => (s.end-s.start) >= duration) || free[0];
  const startMin = slot ? slot.start : toMin(DATA.routine.wakeTime);
  const endMin = slot ? Math.min(slot.start+duration, slot.end) : startMin+duration;
  b.date = tmrDate;
  b.startTime = toTimeStr(startMin);
  b.endTime = toTimeStr(endMin);
  b.carriedOver = true;
  b.locked = true;
  save(); render();
  toast(`→ Moved "${b.activity||b.chapter||b.subject}" to tomorrow (${fmtTime(b.startTime)}).`);
}

function backlogWeekStart(date){
  const d = new Date((date||todayStr())+'T00:00:00');
  const day = d.getDay(); const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10);
}
function backlogWeekDates(start){
  const out=[]; const d=new Date((start||backlogWeekStart())+'T00:00:00');
  for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(x.toISOString().slice(0,10)); }
  return out;
}
function backlogStage(ch){
  if(!ch) return {key:'foundation',label:'Foundation',icon:'🧱'};
  if(!ch.lecture && !ch.ncert && chapterCompletion(ch)<15) return {key:'foundation',label:'Foundation',icon:'🧱'};
  if((ch.questions||0)<30) return {key:'questions',label:'Question Bank',icon:'✏️'};
  if((ch.pyqCount||0)<10) return {key:'pyq',label:'PYQ Revision',icon:'📄'};
  if((ch.accuracy||0)>0 && ch.accuracy<70) return {key:'errors',label:'Error Review',icon:'🧯'};
  return {key:'revision',label:'Revision',icon:'🔁'};
}
function backlogPriorityScore(subject,ch){
  if(!ch || chapterClassLevel(subject,ch)!==11 || ch.skipped) return -1;
  const completion=chapterCompletion(ch), accuracy=Number(ch.accuracy)||0;
  const prereqBoost = Object.values(CLASS11_PREREQ_MAP||{}).some(map=>Object.values(map||{}).flat().includes(ch.name)) ? 12 : 0;
  const currentLinkBoost = allChapters().some(c=>chapterClassLevel(c.subject,c)!==11 && (CLASS11_PREREQ_MAP[c.subject]?.[c.name]||[]).includes(ch.name) && chapterCompletion(c)<60) ? 18 : 0;
  const missedBoost = (ch.mistakes||0)>0 ? Math.min(15,ch.mistakes*2) : 0;
  const staleBoost = ch.lastRevised ? Math.min(15,Math.max(0,daysBetween(ch.lastRevised,todayStr()))) : 12;
  const priorityBoost = ch.priority==='high' ? 12 : ch.priority==='low' ? 0 : 6;
  const highYield = highYieldBoost(subject, ch.name);
  return Math.round((100-completion)*0.55 + (accuracy?100-accuracy:25)*0.18 + prereqBoost + currentLinkBoost + missedBoost + staleBoost + priorityBoost + highYield);
}
function getBacklogChapters(){
  return allChapters().map(ch=>({...ch,score:backlogPriorityScore(ch.subject,ch),stage:backlogStage(ch)})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score);
}
function backlogWeekRatio(start){
  const dates=backlogWeekDates(start||backlogWeekStart());
  const tests=(DATA.upcomingTests||[]).filter(t=>daysBetween(todayStr(),t.date)>=0 && daysBetween(todayStr(),t.date)<=7);
  const nearTest=tests.some(t=>daysBetween(todayStr(),t.date)<=3);
  const holidayCount=dates.filter(d=>(DATA.scheduleOverrides||{})[d]?.holiday).length;
  if(holidayCount>=3) return 0.50; if(nearTest) return 0.15; return 0.30;
}
function dailyBacklogCapacityMinutes(date){ if(date<todayStr()) return 0; return getFreeSlots(date).reduce((sum,x)=>sum+Math.max(0,x.end-x.start),0); }
function backlogWeekBudget(start){
  const week=start||backlogWeekStart(), ratio=backlogWeekRatio(week);
  const capacity=backlogWeekDates(week).reduce((sum,d)=>sum+dailyBacklogCapacityMinutes(d),0);
  return {ratio,capacityMinutes:capacity,targetMinutes:Math.round(capacity*ratio),targetHours:Math.round(capacity*ratio/60*10)/10};
}
function ensureBacklogWeek(){
  const start=backlogWeekStart(); DATA.backlog=DATA.backlog||{history:[]};
  if(DATA.backlog.weekStart!==start){
    if(DATA.backlog.weekStart && (DATA.backlog.workflowGenerated || DATA.backlog.targetHours)){

    }

function roadmapPhaseData(exam){
  const r=examReadiness(exam);
  if(exam==='NEET') return [['Coverage','Finish syllabus + NCERT','📚',r.coverage>=90],['Practice','NEET PYQs + chapter questions','🧩',r.pyqs>=100],['Error Loop','Reattempt mistakes + weak chapters','🧯',r.accuracy>=75],['Testing','Part tests → full mocks','📊',r.mocks>=5]];
  if(exam==='JEE') return [['Coverage','Finish current + backlog prerequisites','📚',r.coverage>=90],['Practice','Basic → Main → Advanced','⚡',r.pyqs>=100],['Weakness','Calculation + concept error correction','🧠',r.accuracy>=75],['Testing','Mixed timed papers','⏱️',r.mocks>=5]];
  return [['NCERT','Complete prescribed NCERT chapters','📖',r.coverage>=90],['Questions','Important questions + PYQs','📝',r.pyqs>=50],['Revision','Formula / reactions / diagrams / key points','🔁',r.accuracy>=75],['Testing','Chapter tests → sample papers','📊',r.mocks>=3]];
}
function viewRoadmaps(){
  return `<div class="section-desc">Three roadmaps, one calendar. Pragati keeps the exam workflows separate while sharing the same chapter progress and available study time.</div><div class="grid grid-3 mb-16">${['NEET','JEE','CBSE'].map(exam=>{const r=examReadiness(exam),ph=roadmapPhaseData(exam);return `<div class="card"><div class="card-head"><h3>${exam==='NEET'?'🧬':exam==='JEE'?'⚡':'📝'} ${exam}</h3><span class="tag ${r.score>=70?'tag-low':r.score>=45?'tag-med':'tag-high'}">${r.score}%</span></div><div class="bar-track mb-12"><div class="bar-fill" style="width:${r.score}%"></div></div>${ph.map(p=>`<div class="list-item"><span class="txt"><b>${p[2]} ${p[0]}</b><br><span class="faint">${p[1]}</span></span><span>${p[3]?'✅':'⬜'}</span></div>`).join('')}<a class="btn btn-outline btn-sm w-full mt-10" href="#readiness">Open readiness details</a></div>`}).join('')}</div><div class="card"><div class="card-head"><h3>⚖️ Current vs Backlog Allocation</h3></div><div class="grid grid-3"><div><div class="eyebrow">Normal week</div><b>70% current · 30% backlog</b></div><div><div class="eyebrow">Test-heavy week</div><b>85% current · 15% backlog</b></div><div><div class="eyebrow">Holiday / recovery</div><b>50% current · 50% backlog</b></div></div><div class="text-xs faint mt-12">These are allocation targets, not mandatory hours. Fixed school/coaching blocks and actual free time always win.</div></div>`;

/* ============================================================
   VIEW: CALENDAR
   ============================================================ */
let calendarViewMode = 'month'; // 'month' | 'week'
let calendarAnchorDate = null; // yyyy-mm-dd anchor for navigation, defaults to today
const CALENDAR_TYPE_COLORS = {
  Exam:'--coral', 'School Test':'--sky', 'Coaching Test':'--lavender', Mock:'--amber',
  Revision:'--sage', Holiday:'--sage', Homework:'--sky', Assignment:'--sky', Practical:'--sky', Other:'--ink-faint',
  School:'--sky', Aakash:'--lavender', Vedantu:'--lavender'
};
const CALENDAR_TYPE_ICONS = {
  Exam:'🏫', 'School Test':'🏫', 'Coaching Test':'🧪', Mock:'📝', Revision:'🔁',
  Holiday:'🎉', Homework:'📔', Assignment:'📔', Practical:'🧫', Other:'🔹',
  School:'🏫', Aakash:'⚛️', Vedantu:'🟣'
};
function calendarAllEvents(){
  return [
    ...DATA.calendarEvents.map(e=>({...e, editable:true})),
    ...DATA.dueItems.map(d=>({date:d.dueDate,title:d.text,type:d.type,editable:false})),
    ...DATA.mocks.map(mo=>({date:mo.date,title:mo.name,type:'Mock',editable:false})),
    ...(DATA.upcomingTests||[]).map(t=>({date:t.date,title:`${t.name} (${t.source})`,type:t.source,editable:false})),
  ].filter(e=>e.date);
}
function groupEventsByDate(events){
  const map = {};
  events.forEach(e => { map[e.date] = map[e.date]||[]; map[e.date].push(e); });
  return map;
}
function eventChipHTML(e){
  const colorVar = CALENDAR_TYPE_COLORS[e.type] || '--ink-faint';
  const icon = CALENDAR_TYPE_ICONS[e.type] || '🔹';
  return `<div class="text-xs" style="background:var(${colorVar}-soft, var(--bg-soft)); color:var(${colorVar}); font-weight:600; border-radius:6px; padding:2px 6px; margin-top:3px; display:flex; align-items:center; gap:4px;">
    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">${icon} ${esc(e.title)}</span>
    ${e.editable ? `<span onclick="event.stopPropagation(); deleteCalendarEvent('${e.id}')" style="cursor:pointer; flex-shrink:0;">✕</span>` : ''}
  </div>`;
}
function calendarLegendHTML(){
  const types = ['Exam','School Test','Coaching Test','Mock','Revision','Holiday','Homework'];
  return `<div class="flex gap-10 flex-wrap mb-12">
    ${types.map(t=>{
      const colorVar = CALENDAR_TYPE_COLORS[t]||'--ink-faint';
      return `<div class="flex gap-4 text-xs faint" style="align-items:center;"><span style="width:9px; height:9px; border-radius:3px; background:var(${colorVar}); display:inline-block;"></span>${t}</div>`;
    }).join('')}
  </div>`;
}
function shiftCalendar(delta){
  const d = new Date(calendarAnchorDate || todayStr());
  if(calendarViewMode==='month') d.setMonth(d.getMonth()+delta);
  else d.setDate(d.getDate()+delta*7);
  calendarAnchorDate = d.toISOString().slice(0,10);
  render();
}
function viewCalendar(){
  if(!calendarAnchorDate) calendarAnchorDate = todayStr();
  const events = groupEventsByDate(calendarAllEvents());
  const anchor = new Date(calendarAnchorDate+'T00:00:00');

  let body = '';
  let headerLabel = '';
  if(calendarViewMode==='month'){
    const y = anchor.getFullYear(), m = anchor.getMonth();
    const first = new Date(y,m,1);
    const startDow = first.getDay();
    const daysInMonth = new Date(y,m+1,0).getDate();
    headerLabel = first.toLocaleDateString('en-IN',{month:'long', year:'numeric'});
    let cells = '';
    for(let i=0;i<startDow;i++) cells += `<div></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const evs = events[dateStr]||[];
      const isToday = dateStr===todayStr();
      cells += `<div class="card" style="padding:8px; min-height:78px; cursor:pointer; ${isToday?'border-color:var(--sage); border-width:2px;':''}" onclick="openEventForm('${dateStr}')">
        <div class="text-xs" style="font-weight:${isToday?'700':'500'};">${d}</div>
        ${evs.slice(0,2).map(e=>eventChipHTML(e)).join('')}
        ${evs.length>2?`<div class="text-xs faint mt-8">+${evs.length-2} more</div>`:''}
      </div>`;
    }
    body = `
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-bottom:6px;">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="text-xs faint center" style="font-weight:700;">${d}</div>`).join('')}
    </div>
    <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:8px;">${cells}</div>`;
  } else {
    // week view
    const dow = anchor.getDay();
    const weekStart = new Date(anchor); weekStart.setDate(anchor.getDate()-dow);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
    headerLabel = `${weekStart.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} – ${weekEnd.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`;
    let cols = '';
    for(let i=0;i<7;i++){
      const d = new Date(weekStart); d.setDate(weekStart.getDate()+i);
      const dateStr = d.toISOString().slice(0,10);
      const evs = (events[dateStr]||[]).sort((a,b)=>(a.type||'').localeCompare(b.type||''));
      const isToday = dateStr===todayStr();
      cols += `<div class="card" style="padding:10px; min-height:150px; cursor:pointer; ${isToday?'border-color:var(--sage); border-width:2px;':''}" onclick="openEventForm('${dateStr}')">
        <div class="text-xs" style="font-weight:${isToday?'700':'500'};">${DAY_ABBR[i]} <span class="faint">${d.getDate()}</span></div>
        ${evs.length ? evs.map(e=>eventChipHTML(e)).join('') : `<div class="text-xs faint mt-8">—</div>`}
      </div>`;
    }
    body = `<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:8px;">${cols}</div>`;
  }

  return `
  <div class="flex-between mb-12 flex-wrap gap-10">
    <div class="flex gap-8 flex-wrap" style="align-items:center;">
      <button class="btn btn-outline btn-sm ${calendarViewMode==='month'?'btn-primary':''}" onclick="calendarViewMode='month'; render();">Month</button>
      <button class="btn btn-outline btn-sm ${calendarViewMode==='week'?'btn-primary':''}" onclick="calendarViewMode='week'; render();">Week</button>
      <button class="icon-btn" style="border:1px solid var(--card-border);" onclick="shiftCalendar(-1)">←</button>
      <div class="text-sm" style="font-weight:700; min-width:150px;">${headerLabel}</div>
      <button class="icon-btn" style="border:1px solid var(--card-border);" onclick="shiftCalendar(1)">→</button>
      <button class="btn btn-outline btn-sm" onclick="calendarAnchorDate=todayStr(); render();">Today</button>
    </div>
    <div class="flex gap-8 flex-wrap">
      <button class="btn btn-outline" onclick="openEventForm(todayStr(),null,'Holiday')">🎉 Add Holiday</button>
      <button class="btn btn-primary" onclick="openEventForm(todayStr())">+ Add Event</button>
    </div>
  </div>
  <div class="section-desc" style="margin-top:0;">Exams, tests, assignments, revisions & holidays — click any day to add an event, or ✕ on a chip to remove it.</div>
  ${calendarLegendHTML()}
  ${body}`;
}
function openEventForm(date, editId, presetType){
  const existing = editId ? DATA.calendarEvents.find(e=>e.id===editId) : null;
  const types = ['Exam','School Test','Coaching Test','Mock','Revision','Holiday','Homework','Other'];
  openModal(`
    <div class="modal-head"><h3>${existing?'Edit':'Add'} Calendar Event</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="field"><label>Title</label><input id="f_title" placeholder="e.g. AIATS Mock 5 / Diwali Holiday" value="${existing?esc(existing.title):''}"></div>
    <div class="field-row">
      <div class="field"><label>Date</label><input type="date" id="f_date" value="${existing?existing.date:(date||todayStr())}"></div>
      <div class="field"><label>Type</label><select id="f_type">${types.map(t=>`<option ${(existing?existing.type:presetType)===t?'selected':''}>${t}</option>`).join('')}</select></div>
    </div>
    <div class="flex gap-10">
      <button class="btn btn-primary w-full" onclick="saveEvent(${existing?`'${existing.id}'`:'null'})">Save</button>
      ${existing ? `<button class="btn btn-danger" onclick="deleteCalendarEvent('${existing.id}'); closeModal();">Delete</button>` : ''}
    </div>
  `);
}
function saveEvent(editId){
  const title = document.getElementById('f_title').value.trim();
  if(!title) return toast('Please enter a title.');
  const date = document.getElementById('f_date').value;
  const type = document.getElementById('f_type').value;
  if(editId){
    const e = DATA.calendarEvents.find(x=>x.id===editId);
    Object.assign(e, {title, date, type});
  } else {
    DATA.calendarEvents.push({id:uid(), title, date, type});
  }
  calendarAnchorDate = date;
  save(); closeModal(); render(); toast('Event saved.');
}
function deleteCalendarEvent(id){
  DATA.calendarEvents = DATA.calendarEvents.filter(x=>x.id!==id);
  save(); render(); toast('Event removed.');
}

/* ============================================================
   VIEW: SUBJECT PAGE (Chapter Command Center)
   ============================================================ */
function renderSubjectPage(subj){
  const chapters = DATA.subjects[subj].chapters;
  const completion = subjectCompletion(subj);
  const accuracy = subjectAccuracy(subj);
  const bankAttempted = chapters.reduce((a,c)=>a+moduleAttempted(c),0);
  const bankTarget = chapters.reduce((a,c)=>a+moduleGrandTarget(c),0);
  const bankCorrect = chapters.reduce((a,c)=>a+moduleCorrect(c),0);
  const bankWrong = chapters.reduce((a,c)=>a+moduleWrong(c),0);
  const bankMissed = chapters.reduce((a,c)=>a+moduleMissed(c),0);
  return `
  <div class="grid grid-4 mb-16">
    <div class="card center"><div class="eyebrow">Completion</div><div style="font-family:var(--font-mono); font-size:24px; font-weight:600;">${completion}%</div><div class="bar-track mt-8"><div class="bar-fill" style="width:${completion}%"></div></div></div>
    <div class="card center"><div class="eyebrow">Avg Accuracy</div><div style="font-family:var(--font-mono); font-size:24px; font-weight:600;">${accuracy}%</div></div>
    <div class="card center"><div class="eyebrow">Hours (7d)</div><div style="font-family:var(--font-mono); font-size:24px; font-weight:600;">${subjectHoursTotal(subj,7).toFixed(1)}h</div></div>
    <div class="card center"><div class="eyebrow">Question Bank</div><div style="font-family:var(--font-mono); font-size:24px; font-weight:600;">${bankAttempted}${bankTarget?`/${bankTarget}`:''}</div><div class="text-xs faint mt-8">✅${bankCorrect} · ❌${bankWrong} · ➖${bankMissed}</div></div>
  </div>

function computeExamReadiness(examKey){

  Object.values(DATA.subjects).forEach(subjData => {

/* ---------- Auto Chapter Level Engine ---------- */
// Combines manual chapter accuracy, question-bank accuracy, forgetting-curve
// retention, and logged mistakes into one auto-updating mastery level —
// no manual "priority" picking required unless the student wants to pin one.
function chapterLevel(ch){
  if(ch.priorityMode === 'manual' && ch.priority){
    return { level: ch.priority, auto:false, reason:'Manually pinned' };
  }
  const bankAcc = moduleAccuracyPct(ch);
  const hasAccuracy = ch.accuracy>0 || bankAcc!=null;
  const effAccuracy = ch.accuracy>0 && bankAcc!=null ? Math.round((ch.accuracy+bankAcc)/2) : (ch.accuracy>0 ? ch.accuracy : bankAcc);
  const retention = forgettingCurve(ch);
  const completion = chapterCompletion(ch);
  if(!hasAccuracy && completion===0){
    return { level:'medium', auto:true, reason:'Not started yet' };
  }
  const accuracyForScore = hasAccuracy ? effAccuracy : (30 + completion*0.4); // partial credit for progress with no test data
  let score = accuracyForScore*0.55 + retention*0.25 + completion*0.20 - clamp((ch.mistakes||0)*3, 0, 25);
  score = clamp(Math.round(score), 0, 100);
  let level = score < 55 ? 'high' : score < 75 ? 'medium' : 'low';
  const reasonParts = [];
  if(hasAccuracy) reasonParts.push(`${effAccuracy}% accuracy`);
  reasonParts.push(`${retention}% retention`);
  if(ch.mistakes) reasonParts.push(`${ch.mistakes} mistakes logged`);
  return { level, auto:true, score, reason: reasonParts.join(' · ') };
}

let formulaQuiz = { queue: [], idx: 0, revealed: false, correctCount: 0 };
function openFormulaQuiz(){
  if(!DATA.formulas.length) return toast('Add a few formulas first.');
  const due = DATA.formulas.filter(f=>!f.srDue || f.srDue<=todayStr());
  const pool = due.length ? due : DATA.formulas.slice(); // nothing due — offer a general review instead
  const queue = [...pool].sort(()=>Math.random()-0.5).slice(0,20);
  formulaQuiz = { queue, idx:0, revealed:false, correctCount:0 };
  renderFormulaQuiz();
}
function formulaQuizRateLabels(){ return [
  {key:'again', label:'😵 Again', days:0},
  {key:'hard', label:'😬 Hard', days:1},
  {key:'good', label:'🙂 Good', days:3},
  {key:'easy', label:'😎 Easy', days:7},
]; }
function renderFormulaQuiz(){
  const {queue, idx, revealed} = formulaQuiz;
  if(idx >= queue.length){
    openModal(`
      <div class="modal-head"><h3>🧠 Quiz Complete</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
      <div class="text-sm">You reviewed ${queue.length} formula${queue.length===1?'':'s'} this round.</div>
      <button class="btn btn-primary w-full mt-16" onclick="closeModal()">Done</button>
    `);
    return;
  }
  const f = queue[idx];
  openModal(`
    <div class="modal-head"><h3>🧠 Quiz Mode</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="text-xs faint mb-8">${idx+1} of ${queue.length} · ${esc(f.subject)}${f.chapter?' · '+esc(f.chapter):''}</div>
    <div class="card center mb-16" style="min-height:120px; display:flex; flex-direction:column; justify-content:center; background:var(--bg-soft); border:none;">

      ${revealed ? `
        <div class="mono mt-8" style="background:var(--card); padding:10px 12px; border-radius:8px; font-size:14px; display:inline-block;">${esc(f.formula)}</div>
        ${f.notes ? `<div class="text-xs faint mt-8">${esc(f.notes)}</div>` : ''}
      ` : `<div class="text-xs faint">Tap Reveal when you've recalled it</div>`}
    </div>
    ${revealed ? `
      <div class="text-xs faint mb-8" style="text-align:center;">How well did you recall it?</div>
      <div class="flex gap-8 flex-wrap" style="justify-content:center;">
        ${formulaQuizRateLabels().map(r=>`<button class="btn btn-outline btn-sm" onclick="rateFormulaQuiz('${r.key}')">${r.label}</button>`).join('')}
      </div>
    ` : `<button class="btn btn-primary w-full" onclick="revealFormulaQuiz()">Reveal</button>`}
  `);
}
function revealFormulaQuiz(){ formulaQuiz.revealed = true; renderFormulaQuiz(); }
function rateFormulaQuiz(rateKey){
  const f = formulaQuiz.queue[formulaQuiz.idx];
  const rating = formulaQuizRateLabels().find(r=>r.key===rateKey);
  const real = DATA.formulas.find(x=>x.id===f.id);
  if(real){
    real.srReps = (real.srReps||0) + 1;
    const days = rating.days;
    real.srInterval = days;
    const due = new Date(); due.setDate(due.getDate()+days);
    real.srDue = due.toISOString().slice(0,10);
    if(rateKey!=='again') formulaQuiz.correctCount++;
  }
  save();
  formulaQuiz.idx++;
  formulaQuiz.revealed = false;
  renderFormulaQuiz();
}

async function toggleDoubtVoiceRecording(){
  const btn = document.getElementById('doubtRecBtn');
  const status = document.getElementById('doubtRecStatus');
  if(doubtRecorder && doubtRecorder.state==='recording'){
    doubtRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('🎙️ Voice recording isn\'t available in this browser/context — type the doubt instead.');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    doubtRecorderChunks = [];
    doubtRecorder = new MediaRecorder(stream);
    doubtRecorder.ondataavailable = e => { if(e.data.size>0) doubtRecorderChunks.push(e.data); };
    doubtRecorder.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(doubtRecorderChunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onload = () => {
        doubtDraftAudio = reader.result;
        const preview = document.getElementById('doubtRecPreview');
        if(preview) preview.innerHTML = `<audio controls src="${doubtDraftAudio}" style="width:100%; height:32px;"></audio> <button type="button" class="icon-btn" onclick="doubtDraftAudio=null; document.getElementById('doubtRecPreview').innerHTML='';">✕</button>`;
      };
      reader.readAsDataURL(blob);
      if(btn) btn.textContent = '🎙️ Re-record';
      if(status) status.textContent = 'Recorded — saved with the doubt below.';
    };
    doubtRecorder.start();
    if(btn) btn.textContent = '⏹ Stop Recording';
    if(status) status.textContent = 'Recording... tap Stop when done.';
  }catch(e){
    toast('🎙️ Microphone access was blocked or unavailable — type the doubt instead.');
  }
}

  const question = document.getElementById('f_question').value.trim();
  if(!question && !doubtDraftAudio) return toast('Please describe the doubt, or record a voice note.');
  DATA.doubts.push({id:uid(), subject:document.getElementById('f_subject').value, topic:document.getElementById('f_topic').value, question: question || '(voice note only)', status:'Pending', date:todayStr(), audioNote: doubtDraftAudio});

/* ============================================================
   EXAM-SPECIFIC PRACTICE + ADAPTIVE WEAKNESS ENGINE
   ============================================================ */
const EXAM_SUBJECTS = { NEET:['Physics','Chemistry','Biology'], JEE:['Physics','Chemistry','Maths'], CBSE:['Physics','Chemistry','Biology','Maths'] };
function examRelevantChapter(ch, exam){ return !!(ch && ch.examTags && ch.examTags[exam]); }
function chapterPyqStats(subject, chapter, exam){
  const qs = DATA.pyqs.filter(p=>p.subject===subject && p.chapter===chapter && (!exam || p.examType===exam));
  const attempted = qs.length, correct = qs.filter(q=>q.correct).length;
  return {attempted, correct, accuracy:attempted?Math.round(correct/attempted*100):null, wrong:attempted-correct};
}
function chapterWeaknessScore(subject, ch, exam){
  if(!examRelevantChapter(ch, exam)) return -1;
  const ps = chapterPyqStats(subject,ch.name,exam);
  const acc = ps.accuracy!=null ? ps.accuracy : (ch.accuracy||0);
  const mistake = Math.min(100, (ch.mistakes||0)*12);
  const lowUnderstanding = 100-(ch.understanding||0);
  const completionGap = 100-chapterCompletion(ch);
  const stale = ch.lastRevised ? clamp(daysBetween(ch.lastRevised,todayStr())*2,0,30) : 15;
  return Math.round((100-acc)*0.35 + mistake*0.2 + lowUnderstanding*0.2 + completionGap*0.15 + stale*0.1);
}
function computeWeaknesses(exam='NEET'){
  const rows=[];
  EXAM_SUBJECTS[exam].forEach(subject=>{
    (DATA.subjects[subject]?.chapters||[]).forEach(ch=>{
      if(!examRelevantChapter(ch,exam)) return;
      const ps=chapterPyqStats(subject,ch.name,exam);
      const score=chapterWeaknessScore(subject,ch,exam);
      if(score>=15) rows.push({subject,chapter:ch.name,score,accuracy:(ps.accuracy!=null?ps.accuracy:(ch.accuracy||0)),pyqs:ps.attempted,mistakes:ch.mistakes||0,understanding:ch.understanding||0});
    });
  });
  return rows.sort((a,b)=>b.score-a.score);
}
function examReadiness(exam){
  const subjects=EXAM_SUBJECTS[exam];
  const chapters=[];
  subjects.forEach(s=>(DATA.subjects[s]?.chapters||[]).forEach(c=>{if(examRelevantChapter(c,exam)) chapters.push(c)}));
  const coverage=chapters.length?Math.round(chapters.reduce((a,c)=>a+chapterCompletion(c),0)/chapters.length):0;
  const tested=chapters.filter(c=>c.accuracy>0);
  const accuracy=tested.length?Math.round(tested.reduce((a,c)=>a+c.accuracy,0)/tested.length):0;
  const pyqs=DATA.pyqs.filter(p=>p.examType===exam && subjects.includes(p.subject)).length;
  const pyqScore=Math.min(100,Math.round(pyqs/300*100));
  const mocks=DATA.mocks.filter(m=>m.examType===exam || (exam==='NEET' && !m.examType)).length;
  const mockScore=Math.min(100,Math.round(mocks/5*100));
  const score=Math.round(coverage*0.35 + accuracy*0.3 + pyqScore*0.2 + mockScore*0.15);
  return {score,coverage,accuracy,pyqs,mocks};
}
function adaptivePyqQueue(exam){
  const seen=DATA.pyqs.filter(p=>p.examType===exam);
  const byKey={};
  seen.forEach(p=>{const k=p.subject+'::'+p.chapter; (byKey[k]||(byKey[k]=[])).push(p)});
  const out=[];
  EXAM_SUBJECTS[exam].forEach(subject=>(DATA.subjects[subject]?.chapters||[]).forEach(ch=>{
    if(!examRelevantChapter(ch,exam)) return;
    const qs=byKey[subject+'::'+ch.name]||[];
    const wrong=qs.filter(q=>!q.correct).length;
    const last=qs.length?qs.map(q=>q.date).sort().at(-1):null;
    const days=last?daysBetween(last,todayStr()):30;
    const weakness=chapterWeaknessScore(subject,ch,exam);
    const repeat=wrong*8 + (qs.length?Math.min(30,days):35) + weakness;
    out.push({subject,chapter:ch.name,score:repeat,reason:!qs.length?'Never practiced':wrong?`${wrong} previous wrong${wrong>1?'s':''}`:`Due again after ${days}d`});
  }));
  return out.sort((a,b)=>b.score-a.score).slice(0,12);
}

function generateTestPrepPlan(testId){
  const test=DATA.upcomingTests.find(t=>t.id===testId); if(!test) return;
  const daysLeft=daysBetween(todayStr(),test.date); if(daysLeft<1) return toast('This test is today or already passed.');
  const horizon=Math.min(7,daysLeft), created=[];
  const relevant=test.chapters.slice().sort((a,b)=>{
    const ca=DATA.subjects[a.subject]?.chapters.find(c=>c.name===a.chapter), cb=DATA.subjects[b.subject]?.chapters.find(c=>c.name===b.chapter);
    return (chapterWeaknessScore(a.subject,ca,test.examType||'NEET')||0)-(chapterWeaknessScore(b.subject,cb,'CBSE')||0);
  }).reverse();
  for(let d=0;d<horizon;d++){
    const dt=new Date(todayStr()); dt.setDate(dt.getDate()+d); const date=dt.toISOString().slice(0,10);
    const existing=(DATA.plannerEvents||[]).filter(b=>b.date===date && b.startTime&&b.endTime).map(b=>({start:b.startTime,end:b.endTime}));
    const free=getFreeSlots(date,existing);
    if(!free.length) continue;
    const picks=relevant.slice(0,Math.min(2,relevant.length));
    picks.forEach((c,i)=>{ if(!free.length) return; const slot=consumeFromSlots(free,45); if(!slot) return;
      const start=toTimeStr(slot.start),end=toTimeStr(slot.end);
      DATA.plannerEvents.push({id:uid(),date,startTime:start,endTime:end,subject:c.subject,chapter:c.chapter,activity:`Test Prep · ${test.name}`,goals:['Revise concepts','Solve exam questions'],subtasks:[makeSubtask('ncert'),makeSubtask('qns')],done:false,generated:true,testPrep:true,locked:true}); created.push(date);
    });
  }
  save(); render(); toast(created.length?`Generated ${created.length} test-prep block${created.length===1?'':'s'} for ${test.name}.`:'No free study slots were available.');
}

function mockWeakestSubjectInsight(){
  const withBreakdown = DATA.mocks.filter(m=>m.subjectBreakdown);
  if(!withBreakdown.length) return null;
  const totals = {};
  subjectNames().forEach(s=>{ totals[s] = {c:0,w:0,u:0}; });
  withBreakdown.forEach(m=>{
    Object.entries(m.subjectBreakdown).forEach(([s,b])=>{
      if(!totals[s]) totals[s] = {c:0,w:0,u:0};
      totals[s].c += b.c||0; totals[s].w += b.w||0; totals[s].u += b.u||0;
    });
  });
  const rows = Object.entries(totals).map(([s,b])=>{
    const attempted = b.c+b.w;
    const acc = attempted ? Math.round(b.c/attempted*100) : null;
    const avgScore = withBreakdown.length ? Math.round((b.c*MARK_CORRECT + b.w*MARK_WRONG)/withBreakdown.length) : 0;
    return {subject:s, acc, avgScore, attempted, unattempted:b.u};
  }).filter(r=>r.attempted>0 || r.unattempted>0);
  if(!rows.length) return null;
  rows.sort((a,b)=> (a.acc==null?-1:a.acc) - (b.acc==null?-1:b.acc));
  return rows;
}

// Standard +4/-1 marking scheme applied uniformly (matches NEET & most JEE mock series).
const MARK_CORRECT = 4, MARK_WRONG = -1;
function computeMockFromBreakdown(breakdown){
  let totalCorrect=0, totalWrong=0, totalUnattempted=0;
  Object.values(breakdown).forEach(b=>{ totalCorrect+=b.c||0; totalWrong+=b.w||0; totalUnattempted+=b.u||0; });
  const totalAttempted = totalCorrect+totalWrong;
  const totalQuestions = totalAttempted+totalUnattempted;
  const totalScore = totalCorrect*MARK_CORRECT + totalWrong*MARK_WRONG;
  const accuracy = totalAttempted ? Math.round(totalCorrect/totalAttempted*100) : 0;
  const negMarks = Math.abs(totalWrong*MARK_WRONG);
  return {totalScore, totalCorrect, totalWrong, totalUnattempted, totalAttempted, totalQuestions, accuracy, negMarks};
}
function subjectMockScore(b){ return (b.c||0)*MARK_CORRECT + (b.w||0)*MARK_WRONG; }

function addMockDraftWeakChapter(){
  const subject = document.getElementById('f_wc_subj').value;
  const chapter = document.getElementById('f_wc_chapter').value;
  if(!chapter) return;
  if(mockDraftWeakChapters.some(w=>w.subject===subject && w.chapter===chapter)) return;
  mockDraftWeakChapters.push({id:uid(), subject, chapter, fixed:false});
  renderMockWeakChapterChips();
}
function removeMockDraftWeakChapter(id){
  mockDraftWeakChapters = mockDraftWeakChapters.filter(w=>w.id!==id);
  renderMockWeakChapterChips();
}
function renderMockWeakChapterChips(){
  const el = document.getElementById('mockWeakChapterChips');
  if(!el) return;
  el.innerHTML = mockDraftWeakChapters.map(w=>`<span class="tag tag-high" style="cursor:pointer;" onclick="removeMockDraftWeakChapter('${w.id}')">${esc(w.chapter)} (${esc(w.subject)}) ✕</span>`).join('') || `<span class="text-xs faint">None added yet.</span>`;
}
function readMockBreakdown(){
  const breakdown = {};
  subjectNames().forEach(s=>{
    const c = parseInt(document.getElementById('f_c_'+s)?.value)||0;
    const w = parseInt(document.getElementById('f_w_'+s)?.value)||0;
    const u = parseInt(document.getElementById('f_u_'+s)?.value)||0;
    breakdown[s] = {c,w,u};
  });
  return breakdown;
}
function updateMockPreview(){
  const box = document.getElementById('mockPreview');
  if(!box) return;
  const r = computeMockFromBreakdown(readMockBreakdown());
  box.innerHTML = `<div class="text-sm" style="font-weight:700;">Score: ${r.totalScore} · Accuracy: ${r.accuracy}% · Negative: −${r.negMarks}</div><div class="text-xs faint mt-4">${r.totalAttempted} attempted of ${r.totalQuestions} · ${r.totalCorrect} correct · ${r.totalWrong} wrong</div>`;
}
function saveMock(){
  const name = document.getElementById('f_name').value.trim();
  if(!name) return toast('Please enter the exam name.');
  const breakdown = readMockBreakdown();
  const r = computeMockFromBreakdown(breakdown);
  if(r.totalQuestions===0) return toast('Enter correct/wrong/unattempted for at least one subject.');
  DATA.mocks.push({
    id:uid(), name, date:document.getElementById('f_date').value||todayStr(),
    subjectBreakdown: breakdown,
    totalScore:r.totalScore, accuracy:r.accuracy, negMarks:r.negMarks,
    totalCorrect:r.totalCorrect, totalWrong:r.totalWrong, totalUnattempted:r.totalUnattempted, totalQuestions:r.totalQuestions,
    rank:document.getElementById('f_rank').value, percentile:document.getElementById('f_percentile').value ? parseFloat(document.getElementById('f_percentile').value) : null, timeTaken:document.getElementById('f_time').value,
    notes:document.getElementById('f_notes').value,
    weakChapters: mockDraftWeakChapters.slice()
  });
  addXP('mock');
  mockDraftWeakChapters = [];
  save(); closeModal(); render(); checkAchievements();
  toast(`Mock saved — auto-scored ${r.totalScore}.`);
}
function deleteMock(id){ DATA.mocks = DATA.mocks.filter(m=>m.id!==id); save(); render(); }

// Aggregates every timed subtask (banked minutes from the ▶/⏸ subtask timers) by learning step
// — Lecture / NCERT / Questions — so the student can see where actual time really goes, not just
// where the plan said it should go.
function subtaskTimeStats(){
  const byKind = {lecture:{count:0,ms:0}, ncert:{count:0,ms:0}, qns:{count:0,ms:0}};
  let totalMs = 0, totalCount = 0;
  (DATA.plannerEvents||[]).forEach(b=>{
    (b.subtasks||[]).forEach(st=>{
      const ms = st.timerAccumMs||0;
      if(ms<=0) return;
      if(byKind[st.kind]){ byKind[st.kind].count++; byKind[st.kind].ms += ms; }
      totalMs += ms; totalCount++;
    });
  });
  const rows = Object.entries(byKind).map(([kind,v])=>{
    const meta = SUBTASK_KIND_META[kind]||{icon:'☑️',label:kind};
    return {kind, icon:meta.icon, label:meta.label, count:v.count, totalMin:Math.round(v.ms/60000), avgMin: v.count? Math.round(v.ms/v.count/60000):0};
  });
  return {rows, totalMin:Math.round(totalMs/60000), totalCount};
}
function subtaskTimeStatsCardHTML(){
  const stats = subtaskTimeStats();
  if(!stats.totalCount) return `<div class="card"><div class="card-head"><h3>⏱️ Time per Learning Step</h3></div><div class="empty text-sm">Use the ▶ timer on a subtask (Lecture/NCERT/Questions) to start building this picture.</div></div>`;
  const maxAvg = Math.max(1, ...stats.rows.map(r=>r.avgMin));
  return `
  <div class="card">
    <div class="card-head"><h3>⏱️ Time per Learning Step</h3><span class="text-xs faint">${stats.totalCount} timed · ${Math.floor(stats.totalMin/60)}h ${stats.totalMin%60}m total</span></div>

    `).join('')}
    <div class="text-xs faint mt-8">From subtask timers only — spot where actual time really goes vs. where you meant it to go.</div>
  </div>`;
}

    const h = hoursOnDate(dateStr);
