/* ============================================================
   AI DYNAMIC PLANNER
   — Time Availability Engine (locks fixed commitments, finds free slots)
   — Priority Engine (weighted score: exam 40% / weak 25% / revision 20% / homework 10% / missed 5%)
   — Generates a complete editable day from wake time to bedtime
   ============================================================ */
const DAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SUBJECT_ENERGY_RANK = { Physics:3, Chemistry:2, Maths:2, Biology:1 }; // 3=hardest(morning) 1=lightest(night)
const SLIP_SUBJECT_ALIASES = { Mathematics:'Maths' }; // map slip-test subject names onto tracker subject keys
function dayAbbr(d){ return DAY_ABBR[new Date(d+'T00:00:00').getDay()]; }
function dayType(d){ const a = dayAbbr(d); return a==='Sun' ? 'sunday' : a==='Sat' ? 'saturday' : 'weekday'; }
function toMin(t){ if(!t) return null; const p = t.split(':').map(Number); return p[0]*60+p[1]; }
function toTimeStr(mins){ mins = ((Math.round(mins)%1440)+1440)%1440; const h = Math.floor(mins/60), m = mins%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
// Today's/any date's daily slip test subject, as configured in the Master Schedule (Mon–Fri only)
function getSlipTestSubject(date){
  if(!DATA.slipTests || !DATA.slipTests.enabled) return null;
  if(dayType(date)!=='weekday') return null;
  const abbr = dayAbbr(date);
  return (DATA.slipTests.schedule||{})[abbr] || null;
}

// Fixed/locked commitments for a given date, from the editable Master Schedule
function getFixedBlocksForDate(date){
  const ov = (DATA.scheduleOverrides||{})[date] || {};
  if(ov.holiday) return []; // whole day free — no school/travel/tuition blocks
  const r = { ...DATA.routine, ...(ov.schoolStart?{schoolStart:ov.schoolStart}:{}), ...(ov.schoolEnd?{schoolEnd:ov.schoolEnd}:{}) };
  const abbr = dayAbbr(date), dt = dayType(date);
  const blocks = [];
  if(dt==='weekday'){
    blocks.push({start:r.morningStudyEnd, end:r.getReadyEnd, label:'Get Ready'});
    blocks.push({start:r.getReadyEnd, end:r.schoolStart, label:'🚌 Travel to School'});
    blocks.push({start:r.schoolStart, end:r.schoolEnd, label:'🏫 School'});
    blocks.push({start:r.schoolEnd, end:r.reachHomeTime, label:'🚌 Travel Home'});
    blocks.push({start:r.reachHomeTime, end:toTimeStr(toMin(r.reachHomeTime)+30), label:'🍽️ Dinner & Rest'});
    if(!ov.noTuition && (r.tuitionDays||[]).includes(abbr)) blocks.push({start:r.tuitionStart, end:r.tuitionEnd, label:'➗ Math Tuition'});
  } else if(dt==='saturday'){
    if(!ov.noAakash) blocks.push({start:r.satAakashStart, end:r.satAakashEnd, label:'🟣 Aakash'});
  } else {
    if(!ov.noAakash) blocks.push({start:r.sunAakashStart, end:r.sunAakashEnd, label:'🟣 Aakash (Full Day)'});
  }
  return blocks.filter(b=>b.start && b.end && toMin(b.end) > toMin(b.start));
}
function mergeBusyBlocks(blocks){
  const norm = blocks.map(b=>({start:toMin(b.start), end:toMin(b.end)})).filter(b=>b.end>b.start).sort((a,b)=>a.start-b.start);
  const merged = [];
  norm.forEach(b=>{
    if(merged.length && b.start <= merged[merged.length-1].end) merged[merged.length-1].end = Math.max(merged[merged.length-1].end, b.end);
    else merged.push({...b});
  });
  return merged;
}
// Everything left over once fixed commitments are locked in — this is what the planner has to work with
function getFreeSlots(date, extraBusy){
  const r = DATA.routine;
  let dayStart = toMin(r.wakeTime);
  const dayEnd = toMin(r.bedtime);
  // When generating/estimating a plan for TODAY, don't schedule blocks in the past — start
  // from right now (rounded up to the next 5-minute mark) instead of from wake time.
  if(date === todayStr()){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    const roundedNow = Math.ceil(nowMin/5)*5;
    dayStart = Math.max(dayStart, Math.min(roundedNow, dayEnd));
  }
  // Existing planner blocks are also busy time. This makes the planner genuinely time-aware:
  // manual blocks, locked blocks, and already-completed blocks are never overwritten or double-booked.
  // During generation, incomplete generated blocks are cleared first, so they don't constrain the new plan.
  const existingBusy = (DATA.plannerEvents||[])
    .filter(b=>{
      if(b.date!==date || b.subject==='Fixed' || !b.startTime || !b.endTime) return false;
      const label=String(b.activity||b.title||b.name||'');
      const ov=(DATA.scheduleOverrides||{})[date]||{};
      if(ov.noAakash && /aakash/i.test(label)) return false;
      if(ov.noTuition && /math tuition|tuition/i.test(label)) return false;
      if(ov.noVedantu && /vedantu/i.test(label)) return false;
      return true;
    })
    .map(b=>({start:b.startTime, end:b.endTime}));
  const merged = mergeBusyBlocks([...getFixedBlocksForDate(date), ...existingBusy, ...(extraBusy||[])]);
  const free = []; let cursor = dayStart;
  merged.forEach(b=>{
    if(b.start > cursor) free.push({start:cursor, end:Math.min(b.start,dayEnd)});
    cursor = Math.max(cursor, b.end);
  });
  if(cursor < dayEnd) free.push({start:cursor, end:dayEnd});
  return free.filter(s=>s.end-s.start >= 15);
}
// Smart lecture decision: how many Vedantu slots to attend today
function vedantuDecision(date){
  if(dayType(date)!=='weekday') return null;
  const tests = DATA.upcomingTests||[];
  const within3 = tests.filter(t=>{ const d = daysBetween(date,t.date); return d>=0 && d<=3; });
  const pendingHw = (DATA.dueItems||[]).filter(d=>!d.done && d.type==='Homework').length;
  let attend = 1, reason = 'No urgent exams — attend one Vedantu lecture to stay on pace.';
  if(within3.length >= 2){ attend = 2; reason = `${within3.length} tests within 3 days — attend both lectures to cover more ground.`; }
  else if(within3.length === 1){ reason = `"${within3[0].name}" is coming up — attend the lecture covering its chapters.`; }
  if(pendingHw >= 5){ attend = 2; reason = 'Large pending homework backlog — attend both lectures if your schedule allows.'; }
  if((DATA.routine.tuitionDays||[]).includes(dayAbbr(date)) && attend===2) attend = 1; // slot 2 usually clashes with tuition
  return {attend, reason};
}
// For the plan modal: today's Vedantu slot count plus a reasonable default subject guess per
// slot (today's top two distinct priority subjects), so the student only has to type the lesson
// name — not pick a subject from scratch — but can still change either.
function vedantuModalInfo(date){
  const noVed = ((DATA.scheduleOverrides||{})[date]||{}).noVedantu;
  const vd = noVed ? null : vedantuDecision(date);
  if(!vd) return null;
  const priorities = computeChapterPriorities(date);
  const subs = subjectNames();
  const guess1 = priorities[0]?.subject || subs[0];
  const guess2 = priorities.find(p=>p.subject!==guess1)?.subject || subs.find(s=>s!==guess1) || subs[0];
  const slots = [{n:1, start:DATA.routine.vedantuSlot1Start, end:DATA.routine.vedantuSlot1End, defaultSubject:guess1}];
  if(vd.attend===2) slots.push({n:2, start:DATA.routine.vedantuSlot2Start, end:DATA.routine.vedantuSlot2End, defaultSubject:guess2});
  return {attend:vd.attend, reason:vd.reason, slots};
}

// Finds the single nearest-due chapter tied to an upcoming test from a given source (School/Aakash),
// so the planner can guarantee at least one topic from each is studied every day.
function findChapterByName(subject, name){
  return (DATA.subjects[subject]?.chapters || []).find(c=>c.name===name);
}
// Picks the Class 11 chapter most worth a quick recap today. First choice: whichever Class 11
// chapter is the actual prerequisite/basic for the Class 12 chapter(s) the student is focused on
// today (via CLASS11_PREREQ_MAP) — so the recap feels connected to what's being studied right now.
// Falls back to due revisions first, then whatever hasn't been touched longest, when no link applies.
function nearestClass11RecapChapter(date, excludeKeys, focusChapters){
  excludeKeys = excludeKeys || new Set();
  focusChapters = focusChapters || [];
  const relevantSubs = subjectNames();
  const dueRevs = getDueRevisions();
  const byRecency = (a,b)=>{
    if(a.due !== b.due) return a.due ? -1 : 1;
    const al = a.lastRevised || '0000-00-00', bl = b.lastRevised || '0000-00-00';
    if(al !== bl) return al.localeCompare(bl); // never/longest-ago revised first
    return a.completion - b.completion;
  };
  const makeCandidate = (subj, chName, linkedTo)=>{
    const ch = findChapterByName(subj, chName);
    if(!ch || chapterClassLevel(subj, ch) !== 11) return null;
    if(chapterCompletion(ch) >= 100) return null;
    const key = subj+'::'+chName;
    if(excludeKeys.has(key)) return null;
    const dueRev = dueRevs.find(r=>r.subject===subj && r.chapter===chName);
    return {subject:subj, chapter:chName, due: !!dueRev, lastRevised: ch.lastRevised, completion: chapterCompletion(ch), linkedTo};
  };
  const linked = [];
  focusChapters.forEach(f=>{
    const links = (CLASS11_PREREQ_MAP[f.subject]||{})[f.chapter];
    if(!links) return;
    links.forEach(name=>{ const cand = makeCandidate(f.subject, name, f.chapter); if(cand) linked.push(cand); });
  });
  if(linked.length){ linked.sort(byRecency); return linked[0]; }
  const candidates = [];
  relevantSubs.forEach(subj=>{
    (DATA.subjects[subj]?.chapters||[]).forEach(ch=>{ const cand = makeCandidate(subj, ch.name, null); if(cand) candidates.push(cand); });
  });
  if(!candidates.length) return null;
  candidates.sort(byRecency);
  return candidates[0];
}
// Realistic default time for a chapter block, based on why it's being studied — used to
// pre-fill the per-chapter duration field in the plan modal (student can always override).
function suggestedChapterDuration(p, date){
  let base;
  if(p.revisionScore>0 && p.examScore===0) base = 25;      // pure revision — quick recall pass
  else if(p.examScore>=30) base = 60;                        // exam within 3 days — deep focused sitting
  else if(p.examScore>=15) base = 50;                        // exam within a week
  else if(p.slipScore>0) base = 30;
  else base = 40;                                              // general syllabus progress
  const mult = ENERGY_LEVELS[todaysEnergy(date)].mult;
  const calFactor = subjectTimeCalibrationFactor(p.subject);
  return Math.max(10, Math.round(base*mult*calFactor/5)*5);
}
// Splits a chapter's total study time into the three natural steps of learning something —
// watch the lecture, read the NCERT portion, then solve questions — so the plan schedules them
// as distinct blocks instead of one undifferentiated lump. Pure revision/slip-prep chapters skip
// the lecture step since they're a recall pass, not first-time learning; student can still zero
// out or resize any step in the modal (e.g. already watched the lecture elsewhere). Total is
// already energy-scaled via suggestedChapterDuration, so a tired day proposes shorter steps.
function suggestedChapterTaskSplit(p, date){
  const total = suggestedChapterDuration(p, date);
  if((p.revisionScore>0 && p.examScore===0) || p.slipScore>0){
    return {lecture:0, ncert: Math.round(total*0.3/5)*5, qns: total - Math.round(total*0.3/5)*5};
  }
  const lecture = Math.round(total*0.35/5)*5;
  const ncert = Math.round(total*0.30/5)*5;
  const qns = Math.max(10, total - lecture - ncert);
  return {lecture, ncert, qns};
}
function taskListTotal(tasks){ return (tasks||[]).reduce((a,t)=>a+(t.duration||0), 0); }
// Builds the Class 11 recap dropdown for the plan modal: the auto-suggested (prerequisite-linked)
// chapter first, then every other not-yet-complete Class 11 chapter, so the student can keep the
// smart suggestion or swap it for whatever they'd rather clear today — full control either way.
function class11RecapOptionsForModal(date){
  const priorities = computeChapterPriorities(date);
  const focusChapters = priorities
    .filter(p=>{ const cObj = findChapterByName(p.subject, p.chapter); return cObj && chapterClassLevel(p.subject, cObj)===12; })
    .slice(0,5)
    .map(p=>({subject:p.subject, chapter:p.chapter}));
  const suggestion = nearestClass11RecapChapter(date, new Set(), focusChapters);
  const linkedKeys = new Set();
  focusChapters.forEach(f=>{
    const links = (CLASS11_PREREQ_MAP[f.subject]||{})[f.chapter];
    if(links) links.forEach(name=> linkedKeys.add(f.subject+'::'+name));
  });
  const all = [];
  subjectNames().forEach(subj=>{
    (DATA.subjects[subj]?.chapters||[]).forEach(ch=>{
      if(chapterClassLevel(subj, ch)!==11) return;
      if(chapterCompletion(ch)>=100) return;
      const key = subj+'::'+ch.name;
      if(suggestion && key===suggestion.subject+'::'+suggestion.chapter) return; // shown separately as the suggestion
      all.push({subject:subj, chapter:ch.name, linked: linkedKeys.has(key)});
    });
  });
  all.sort((a,b)=> (b.linked-a.linked) || a.subject.localeCompare(b.subject));
  return {suggestion, options: all};
}
function nearestUpcomingChapterForSource(source, date, excludeKeys){
  excludeKeys = excludeKeys || new Set();
  const relevantSubs = subjectNames();
  const tests = (DATA.upcomingTests||[]).filter(t=>t.source===source && daysBetween(date,t.date)>=0 && daysBetween(date,t.date)<=60)
    .sort((a,b)=> daysBetween(date,a.date)-daysBetween(date,b.date));
  for(const t of tests){
    for(const c of (t.chapters||[])){
      if(!relevantSubs.includes(c.subject)) continue;
      const key = c.subject+'::'+c.chapter;
      if(excludeKeys.has(key)) continue;
      // Already well covered? Skip so the guaranteed slot goes to something that still needs work.
      const chObj = findChapterByName(c.subject, c.chapter);
      if(chObj && chapterCompletion(chObj) >= 70) continue;
      return {subject:c.subject, chapter:c.chapter, testName:t.name, testDate:t.date, source, daysAway:daysBetween(date,t.date)};
    }
  }
  return null;
}
// Today's guaranteed Aakash + School topics (for preview UI, before/without generating a plan)
function todaysMandatoryTopics(date){
  date = date || todayStr();
  const used = new Set();
  const out = [];
  ['Aakash','School'].forEach(src=>{
    const pick = nearestUpcomingChapterForSource(src, date, used);
    if(pick){ out.push(pick); used.add(pick.subject+'::'+pick.chapter); }
  });
  return out;
}
// Carves `minDur` minutes out of the earliest free slot big enough for it (falls back to the
// largest remaining slot, clamped) — used to guarantee mandatory topics get a real time block.
function consumeFromSlots(free, minDur){
  for(const slot of free){
    if(slot.end - slot.start >= minDur){
      const start = slot.start;
      slot.start += minDur;
      return {start, end:start+minDur};
    }
  }
  let best = null;
  free.forEach(slot=>{ if(slot.end-slot.start>=15 && (!best || (slot.end-slot.start)>(best.end-best.start))) best = slot; });
  if(best){ const start = best.start; const dur = Math.min(minDur, best.end-best.start); best.start += dur; return {start, end:start+dur}; }
  return null;
}

function chapterInUpcomingTest(subject, chapter, withinDays, date){

  });
}
function testsCoveringChapter(subject, chapter, withinDays, date){
  return (DATA.upcomingTests||[]).filter(t=>{
    const d = daysBetween(date, t.date);
    if(d < 0 || d > withinDays) return false;
    return t.chapters.some(c=>c.subject===subject && c.chapter===chapter);

function yesterdayGeneratedNotDone(date){
  const y = new Date(date); y.setDate(y.getDate()-1);
  const yStr = y.toISOString().slice(0,10);

// Weighted Priority Engine — Exam 40% / Weak Chapter 25% / Revision Due 20% / Homework 10% / Missed Yesterday 5%
// (+ a small extra boost when the covering test is a Periodic Test or Month-end Exam)
function computeChapterPriorities(date){
  date = date || todayStr();
  const missed = yesterdayGeneratedNotDone(date);
  const missedKeys = new Set(missed.map(b=>(b.subject||'')+'::'+(b.chapter||b.activity||'')));
  const slipSubjectRaw = getSlipTestSubject(date);
  const slipSubject = slipSubjectRaw ? (SLIP_SUBJECT_ALIASES[slipSubjectRaw] || slipSubjectRaw) : null;
  const rows = [];
  const relevantSubs = subjectNames();
  Object.keys(DATA.subjects).forEach(subj=>{
    if(!relevantSubs.includes(subj)) return;
    DATA.subjects[subj].chapters.forEach(ch=>{
      let examScore = 0, examWindow = 0;
      if(chapterInUpcomingTest(subj, ch.name, 1, date)){ examScore = 40; examWindow = 1; }
      else if(chapterInUpcomingTest(subj, ch.name, 3, date)){ examScore = 30; examWindow = 3; }
      else if(chapterInUpcomingTest(subj, ch.name, 7, date)){ examScore = 15; examWindow = 7; }
      let examTypeBoost = 0, priorityTestName = null;
      if(examWindow){
        const covering = testsCoveringChapter(subj, ch.name, examWindow, date);
        const priorityTest = covering.find(t=>isPriorityTestType(t.testType));
        if(priorityTest){ examTypeBoost = 6; priorityTestName = priorityTest.testType; }
      }
      const weakScore = ch.accuracy>0 ? Math.round(25*(1-ch.accuracy/100)) : (ch.ncert||ch.questions>0 ? 6 : 4);
      const dueRev = getDueRevisions().find(r=>r.subject===subj && r.chapter===ch.name);
      const revisionScore = dueRev ? 20 : 0;
      const homeworkScore = chapterHasPendingHomework(subj) ? 10 : 0;
      const missedScore = missedKeys.has(subj+'::'+ch.name) ? 5 : 0;
      const slipScore = (slipSubject && subj===slipSubject) ? 18 : 0;
      const mockFixScore = mockFixScoreFor(subj, ch.name) ? 22 : 0;
      // Chapters the student is deliberately compressing/skipping (Catch-Up Mode) don't compete
      // for study blocks — same treatment as an off-syllabus Class 11 chapter.
      if(ch.skipped) return;
      const total = examScore+examTypeBoost+weakScore+revisionScore+homeworkScore+missedScore+slipScore+mockFixScore;
      // Class 11 (last year's) chapters don't compete for full-size study blocks unless a real
      // upcoming exam actually covers them — otherwise they'd keep resurfacing and eating the day.
      // They still get a small guaranteed daily revision slot via the Class 11 recap block.
      if(chapterClassLevel(subj, ch)===11 && examScore===0) return;
      if(total>0) rows.push({subject:subj, chapter:ch.name, examScore, examTypeBoost, priorityTestName, weakScore, revisionScore, homeworkScore, missedScore, slipScore, mockFixScore, total, revisionStage: dueRev?(dueRev.stage||0)+1:null});
    });
  });
  return rows.sort((a,b)=>b.total-a.total);
}
function slotEnergyLevel(startMin){ return startMin < 11*60 ? 3 : startMin < 17*60 ? 2 : 1; } // morning=hardest, afternoon=medium, night=lightest
function pickChapterForEnergy(remaining, level){
  const match = remaining.find(r=>{
    const rank = SUBJECT_ENERGY_RANK[r.subject]||2;
    if(r.revisionScore>0 && level===1) return true; // revision naturally suits low-energy night slots
    return level===3 ? rank>=3 : level===2 ? rank===2 : rank<=2;
  });
  return match || remaining[0];
}
// Rough realistic-capacity estimate for the chapter-picker modal: how many free minutes today,
// after Vedantu + slip-test prep are accounted for, and how many chapters that translates to
// at a sane ~50 min/chapter (study chunk + its breather).
function estimateFreePlanningMinutes(date){
  const busyExtra = [];
  const vd = (((DATA.scheduleOverrides||{})[date]||{}).noVedantu) ? null : vedantuDecision(date);
  if(vd){

// ---- Realistic capacity, grounded in actual follow-through, not just today's stated energy ----
// Looks at how much of the last 2 weeks' *generated* plan the student actually completed
// (excluding Fixed/Break blocks, which aren't "chosen" study). A student who reliably finishes
// what they plan gets the full time-based estimate; one who's been leaving a lot unfinished gets
// a gently lower, more honest number today — the plan should match real life, not just the clock.
function recentPlanCompletionRate(days=14){
  const today = todayStr();
  let total = 0, done = 0;
  for(let i=1;i<=days;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    (DATA.plannerEvents||[]).forEach(b=>{
      if(b.date!==ds || !b.generated) return;
      if(b.subject==='Fixed' || b.subject==='Break') return;
      total++;
      if(b.done) done++;
    });
  }
  if(total < 6) return null; // not enough history yet to say anything meaningful
  return done/total;
}
function realisticChapterCapacity(freeMin, date){
  const base = Math.max(2, Math.min(8, Math.round(freeMin/50)));
  const rate = date ? recentPlanCompletionRate(14) : null;
  if(rate==null) return base;
  // A small grace margin means 80%+ actual completion still gets the full time-based estimate —
  // this only pulls capacity DOWN for a real, sustained gap between planned and done, never up.
  const factor = clamp(rate + 0.2, 0.55, 1);
  return Math.max(2, Math.round(base * factor));
}

/* ============================================================
   SMART TODAY ALLOCATION
   Goal: prevent last-minute stress by balancing:
   1) upcoming test pressure
   2) current/test-linked portion
   3) Class 11 backlog
   4) revision / recovery buffer
   The split is adaptive rather than a rigid percentage.
   ============================================================ */
function smartTodayPressure(date){
  date = date || todayStr();
  const tests = (DATA.upcomingTests||[])
    .map(t=>({t, d:daysBetween(date,t.date)}))
    .filter(x=>x.d>=0)
    .sort((a,b)=>a.d-b.d);
  const nearest = tests[0] || null;
  let testShare = 0.30;
  let label = 'Balanced';
  if(nearest){
    if(nearest.d<=1){ testShare=.70; label='Test emergency'; }
    else if(nearest.d<=3){ testShare=.58; label='Test-heavy'; }
    else if(nearest.d<=7){ testShare=.45; label='Test ramp'; }
    else if(nearest.d<=14){ testShare=.35; label='Early test prep'; }
  }
  return {nearest, testShare, label};
}
function smartTodayAllocation(date){
  date = date || todayStr();
  const free = Math.max(0, estimateFreePlanningMinutes(date));
  const pressure = smartTodayPressure(date);
  const mandatory = todaysMandatoryTopics(date);
  const testShare = pressure.testShare;
  const backlogShare = free >= 180 ? 0.18 : free >= 120 ? 0.12 : 0.08;
  const revisionShare = free >= 240 ? 0.10 : 0.07;
  const currentShare = Math.max(0.10, 1-testShare-backlogShare-revisionShare);
  const testMin = Math.round(free*testShare);
  const currentMin = Math.round(free*currentShare);
  const backlogMin = Math.round(free*backlogShare);
  const revisionMin = Math.max(0, free-testMin-currentMin-backlogMin);
  const backlogPick = nearestClass11RecapChapter(
    date, new Set(),
    mandatory.map(x=>({subject:x.subject,chapter:x.chapter}))
  );
  return {
    free, pressure, mandatory, backlogPick,
    testMin, currentMin, backlogMin, revisionMin,
    testPct:Math.round(testShare*100),
    currentPct:Math.round(currentShare*100),
    backlogPct:Math.round(backlogShare*100),
    revisionPct:Math.round((revisionMin/Math.max(1,free))*100)
  };
}
function smartBreakMinutes(duration, type, subject){
  // Breaks scale with cognitive load and continuous sitting time.
  const heavy = type==='Qns' || /Physics|Maths/.test(subject||'') || /numerical|problem|mock|test/i.test(type||'');
  if(duration >= 110) return 15;
  if(duration >= 80) return heavy ? 12 : 10;
  if(duration >= 60) return heavy ? 10 : 8;
  if(duration >= 45) return heavy ? 8 : 6;
  return 5;
}
function smartStudyMethod(subject, type, examUrgency){
  if(type==='Lecture') return 'Lecture → 3-line recall → mark doubts';
  if(type==='NCERT') return subject==='Biology' ? 'NCERT active recall → diagrams → 10 MCQs' : 'Read → close book → recall → examples';
  if(type==='Qns') return /Physics|Maths/.test(subject||'') ? 'Formula recall → timed problems → reattempt errors' : 'Concept recall → timed questions → error review';
  if(examUrgency<=3) return 'Rapid concept recall → PYQs → mistakes';
  if(/Biology/.test(subject||'')) return 'NCERT → active recall → MCQs';
  if(/Chemistry/.test(subject||'')) return 'Concept/formula recall → questions → errors';
  return 'Concept → examples → timed practice';
}

function examPlanTaskWeight(task){
  const key=String(task.subject)+'::'+String(task.chapter);
  let best=0;
  examPlanTests().forEach(t=>{
    if((t.chapters||[]).some(c=>String(c.subject)+'::'+String(c.chapter)===key)) best=Math.max(best,examPlanWeightFor(t));
  });
  return best;
}
function examPlanAllocationPick(remaining, level, state){
  if(!state || !state.enabled) return null;
  const buckets=[];
  examPlanTests().forEach(t=>{
    const w=examPlanWeightFor(t); if(w<=0) return;
    const covered=remaining.filter(x=>(t.chapters||[]).some(c=>String(c.subject)+'::'+String(c.chapter)===String(x.subject)+'::'+String(x.chapter)));
    if(!covered.length) return;
    const target=state.totalStudyMinutes*(w/state.totalWeight);
    const used=state.usedByExam[t.id]||0;
    buckets.push({t,covered,w,target,ratio:target?used/target:1});
  });
  if(!buckets.length) return null;
  buckets.sort((a,b)=>a.ratio-b.ratio || b.w-a.w);
  const pick=pickChapterForEnergy(buckets[0].covered,level);
  if(pick) pick.__examId=buckets[0].t.id;
  return pick;
}

function generateTodaysPlan(date, selectedChapters, class11Override, vedantuOverride, timeWindow){
  date = date || plannerViewDate || todayStr();

  // One-off schedule overrides are authoritative. If Aakash/tuition/Vedantu is
  // skipped today, remove EVERY old generated/locked copy of that commitment before
  // calculating free time. This fixes older plans where a commitment had been saved
  // with a different subject/locked flag and continued blocking the timeline.
  const dayOv = (DATA.scheduleOverrides||{})[date] || {};
  if(dayOv.holiday || dayOv.noAakash || dayOv.noTuition || dayOv.noVedantu){
    DATA.plannerEvents=(DATA.plannerEvents||[]).filter(b=>{
      if(b.date!==date) return true;
      const label=String(b.activity||b.title||b.name||'');
      if(dayOv.holiday && (b.generated || b.locked || b.subject==='Fixed')) return false;
      if(dayOv.noAakash && /aakash/i.test(label)) return false;
      if(dayOv.noTuition && /math tuition|tuition/i.test(label)) return false;
      if(dayOv.noVedantu && /vedantu/i.test(label)) return false;
      return true;
    });
  }

  let selectedSet = null;
  const durationMap = new Map(); // chapter key -> array of {type, duration} steps
  const selectedTopicMap = new Map(); // chapter key -> exact topics chosen in the plan generator
  if(Array.isArray(selectedChapters)){
    selectedSet = new Set();
    selectedChapters.forEach(item=>{
      if(typeof item === 'string'){ selectedSet.add(item); }
      else if(item && item.subject && item.chapter){
        const key = item.subject+'::'+item.chapter;
        selectedSet.add(key);
        if(Array.isArray(item.topics) && item.topics.length) selectedTopicMap.set(key, item.topics.slice());
        if(Array.isArray(item.tasks) && item.tasks.length){
          durationMap.set(key, item.tasks.map(t=>({type:t.type||null, duration:Math.max(5, t.duration)})));
        } else if(item.duration){ // backward-compat: a plain single duration, no step split
          durationMap.set(key, [{type:null, duration:Math.max(15, item.duration)}]);
        }
      }
    });
  } else if(selectedChapters instanceof Set){
    selectedSet = selectedChapters;
  }
  // Regeneration only replaces unfinished AI work. Completed work is history and must keep its
  // time slot so the next plan cannot accidentally schedule over it. Locked/manual blocks are untouched.
  DATA.plannerEvents = (DATA.plannerEvents||[]).filter(b => !(b.date===date && b.generated && !b.locked && !b.done));
  const events = [], busyExtra = [];
  // Master Schedule fixed commitments (school, travel, get ready, dinner, tuition/Aakash) —

  getFixedBlocksForDate(date).forEach(b=>{
    events.push({id:uid(), date, startTime:b.start, endTime:b.end, subject:'Fixed', activity:b.label, done:false, generated:true, locked:true});
  });
  const vd = (((DATA.scheduleOverrides||{})[date]||{}).noVedantu) ? null : vedantuDecision(date);
  if(vd){
    const r = DATA.routine;

    const ov1 = vedantuOverride && vedantuOverride.find(v=>v.slot===1);

    events.push({id:uid(), date, startTime:r.vedantuSlot1Start, endTime:r.vedantuSlot1End, subject:'Vedantu', activity:label1, done:false, generated:true, chapter: ov1?.lessonName || undefined, vedantuSubject: ov1?.subject || undefined});
    busyExtra.push({start:r.vedantuSlot1Start, end:r.vedantuSlot1End});
    if(vd.attend===2){
      const ov2 = vedantuOverride && vedantuOverride.find(v=>v.slot===2);
      const label2 = ov2 && ov2.lessonName ? `🟣 Vedantu — ${ov2.subject}: ${ov2.lessonName}` : 'Attend second lecture — clearing backlog';
      events.push({id:uid(), date, startTime:r.vedantuSlot2Start, endTime:r.vedantuSlot2End, subject:'Vedantu', activity:label2, done:false, generated:true, chapter: ov2?.lessonName || undefined, vedantuSubject: ov2?.subject || undefined});
      busyExtra.push({start:r.vedantuSlot2Start, end:r.vedantuSlot2End});

        .slice(0,5)
        .map(p=>({subject:p.subject, chapter:p.chapter}));

        events.push({id:uid(), date, startTime:toTimeStr(range.start), endTime:toTimeStr(range.end), subject:c11pick.subject, activity:label, done:false, generated:true, chapter:c11pick.chapter, subtasks:[makeSubtask('ncert'), makeSubtask('qns')]});

      if(chosenTopics.length) label += ` — ${chosenTopics.join(', ')}`;
      if(pick.type) label += ` — ${pick.type}`;

      const qt = smartQuestionTarget(pick.subject, pick.chapter, Math.max(25,chunk), urgency);
      if(pick.type==='Qns' || pick.type==='PYQ') label += ` · 🎯 ${qt.count} Q / ≥${qt.accuracy}%`;
      label += ` · ${smartStudyMethod(pick.subject, pick.type, urgency)}`;

      if(boundedEvent) events.push(boundedEvent);

        cursor += breakLen;
      }

  if(selectedSet && selectedSet.size && !finalGeneratedEvents.some(e=>selectedSet.has(e.subject+'::'+(e.chapter||'')))){

  }

  toast((selectedSet
    ? `🤖 Generated ${finalGeneratedEvents.length} blocks for ${fmtDate(date)} — ${selectedSet.size} chapter${selectedSet.size===1?'':'s'} you chose, at a realistic pace${timeWindow&&timeWindow.enabled?` inside ${fmtTime(timeWindow.start)}–${fmtTime(timeWindow.end)}`:''}.`
    : `🤖 Generated ${finalGeneratedEvents.length} blocks for ${fmtDate(date)}.`) + (lockedCount ? ` 🔒 ${lockedCount} locked block${lockedCount===1?'':'s'} left untouched.` : '') + (taper ? ` ⏳ Taper mode — consolidation only, ${taper.key} in ${taper.days}d.` : '') + (recap ? ` 📉 Recap ramp-down block added — ${recap.key} in ${recap.days}d.` : '') + (prereqWarnings.length ? ` ⚠️ Scheduled ahead of a prerequisite: ${prereqWarnings.slice(0,2).join(', ')}.` : ''));
}

// Compact "how are you today" strip at the top of the planner — same energy state that drives
// Generate Plan's realistic chapter count, editable right here so the whole page (priority list,
// MIT Top 3, generate plan) stays in sync without a trip to the Health tab. Also surfaces the
// sleep-based auto-suggestion and a nudge for doubts that have been sitting unresolved.
// ---- Shared "make the rest of today more realistic" compressor ----
// Used both when energy drops mid-day and when something eats into study time unexpectedly.
// Removes lowest-value not-yet-started blocks first (Breaks, then filler Revision, then regular
// chapters — Exam Prep and Slip Test survive longest) until enough minutes are freed, leaving a
// visible gap rather than pretending the lost time didn't happen.
function compressRemainingBlocks(date, minutesToFree){
  if(minutesToFree<=0) return {removed:0, freed:0};
  const nowMin = date===todayStr() ? (new Date().getHours()*60+new Date().getMinutes()) : 0;
  const blocks = (DATA.plannerEvents||[]).filter(b=>b.date===date && !b.done && !b.locked && b.subject!=='Fixed' && toMin(b.startTime)!=null && toMin(b.startTime)>=nowMin);
  if(!blocks.length) return {removed:0, freed:0};
  const rank = b => {
    if(b.subject==='Break') return 0;
    if(b.subject==='Revision') return 1;
    if(b.activity && /Exam Prep/.test(b.activity)) return 4;
    if(b.subject==='Slip Test') return 5;
    return 2; // regular chapter study blocks
  };
  const ordered = [...blocks].sort((a,b)=>rank(a)-rank(b));
  let freed = 0; const toRemove = [];
  for(const b of ordered){
    if(freed >= minutesToFree) break;
    toRemove.push(b.id);
    freed += (toMin(b.endTime)-toMin(b.startTime))||0;
  }
  if(!toRemove.length) return {removed:0, freed:0};
  const removeSet = new Set(toRemove);
  DATA.plannerEvents = DATA.plannerEvents.filter(b=>!(b.date===date && removeSet.has(b.id)));
  save();
  return {removed:toRemove.length, freed};
}
// Mid-day energy re-check: if energy is dialed DOWN after some of today's plan already exists,
// trim the not-yet-started portion of the day to match — instead of only affecting tomorrow's
// Generate Plan like before. Dialing energy UP never adds anything back automatically.
function setEnergyAndReflow(date, level){
  const before = ENERGY_LEVELS[todaysEnergy(date)].mult;
  setEnergy(date, level, true);
  if(date===todayStr()){
    const after = ENERGY_LEVELS[level].mult;
    if(after < before){
      const nowMin = new Date().getHours()*60 + new Date().getMinutes();
      const remaining = (DATA.plannerEvents||[]).filter(b=>b.date===date && !b.done && !b.locked && b.subject!=='Fixed' && toMin(b.startTime)!=null && toMin(b.startTime)>=nowMin);
      const totalMin = remaining.reduce((a,b)=>a+((toMin(b.endTime)-toMin(b.startTime))||0),0);
      const target = Math.round(totalMin * (1 - after/before));
      if(target > 15){
        const r = compressRemainingBlocks(date, target);
        if(r.removed) toast(`${ENERGY_LEVELS[level].icon} Energy dropped — trimmed ${r.removed} block${r.removed===1?'':'s'} (~${r.freed}m) from the rest of today so the plan stays realistic.`);
      }
    }
  }
  render();
}
// Interruption button: "something came up, I lost time" — shrinks the rest of today instead of
// leaving a now-unrealistic plan sitting there, unfinished and overwhelming, for the rest of the day.
function openInterruptionPrompt(date){
  const answer = window.prompt("About how many minutes did you lose? The rest of today's plan will be trimmed to fit.", '30');
  if(!answer) return;
  const mins = parseInt(answer);
  if(!mins || mins<=0) return toast('Enter a valid number of minutes.');
  const r = compressRemainingBlocks(date, mins);
  if(r.removed){ render(); toast(`⏱ Got it — trimmed ${r.removed} block${r.removed===1?'':'s'} (~${r.freed}m) from the rest of today.`); }
  else toast('No remaining unlocked blocks to trim — the rest of today is already light.');
}
// ---- Weekly Retrospective ----
// Two views: this week's actual day-by-day planned-vs-done, and a longer-run weekday pattern
// (e.g. "Wednesdays average 52% completion") so recurring problem days become visible instead of
// getting lost in a single rolling percentage.
function last7DaysRetrospective(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    let planned=0, done=0;
    (DATA.plannerEvents||[]).forEach(b=>{
      if(b.date!==ds || !b.generated || b.subject==='Fixed' || b.subject==='Break') return;
      planned++; if(b.done) done++;
    });
    days.push({ds, planned, done, rate: planned ? done/planned : null, abbr:DAY_ABBR[d.getDay()], hours: hoursOnDate(ds), isToday: ds===todayStr()});
  }
  return days;
}
function weeklyRetrospectiveByWeekday(weeks=6){
  const stats = {}; for(let i=0;i<7;i++) stats[i] = {planned:0, done:0};
  for(let i=1;i<=weeks*7;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    const wd = d.getDay();
    (DATA.plannerEvents||[]).forEach(b=>{
      if(b.date!==ds || !b.generated || b.subject==='Fixed' || b.subject==='Break') return;
      stats[wd].planned++; if(b.done) stats[wd].done++;
    });
  }
  return DAY_ABBR.map((abbr,i)=>({abbr, day:i, ...stats[i], rate: stats[i].planned ? stats[i].done/stats[i].planned : null}));
}
function shouldShowWeeklyRetroBanner(){
  return new Date().getDay()===0 && DATA.meta.retroBannerDismissedDate !== todayStr();
}

// ---- Subject Rotation Fatigue Check ----
// A subject can go quiet without ever being "weak" on paper — this just tracks the last day any
// hours were logged against it and flags a gap, so silent neglect surfaces before it becomes a
// real accuracy problem.
function daysSinceSubjectStudied(subject){
  const dates = DATA.studyLog.filter(l=>l.subject===subject).map(l=>l.date);
  if(!dates.length) return null;
  const latest = dates.sort().pop();
  return daysBetween(latest, todayStr());
}
function neglectedSubjects(thresholdDays=5){
  return subjectNames().map(s=>({subject:s, days:daysSinceSubjectStudied(s)}))
    .filter(x=>x.days===null || x.days>=thresholdDays)
    .sort((a,b)=>(b.days??999)-(a.days??999));
}
function subjectFatigueBannerHTML(){
  const neglected = neglectedSubjects(5);

  return `

}

  for(let i=1;i<=3;i++){

function todayTimeSnapshot(date){
  date = date || todayStr();
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isToday = date===todayStr();
  const blocks = (DATA.plannerEvents||[]).filter(b=>b.date===date && !['Fixed','Sleep'].includes(b.subject));
  const taskBlocks = blocks.filter(b=>!['Break'].includes(b.subject));
  const studyBlocks = blocks.filter(b=>!['Break','Fixed','Sleep'].includes(b.subject));
  const plannedStudyMin = studyBlocks.reduce((a,b)=>a+Math.max(0,(toMin(b.endTime)||0)-(toMin(b.startTime)||0)),0);
  const completedStudyMin = studyBlocks.filter(b=>b.done).reduce((a,b)=>a+Math.max(0,(toMin(b.endTime)||0)-(toMin(b.startTime)||0)),0);
  const upcoming = blocks.filter(b=>!b.done && toMin(b.startTime)!=null && (!isToday || toMin(b.endTime)>nowMin))
    .sort((a,b)=>toMin(a.startTime)-toMin(b.startTime));
  const active = isToday ? currentActiveBlock() : null;
  const next = upcoming.find(b=>!active || b.id!==active.id) || null;
  const free = estimateFreePlanningMinutes(date);
  const remainingPlanned = studyBlocks.filter(b=>!b.done && (!isToday || (toMin(b.endTime)||0)>nowMin))
    .reduce((a,b)=>a+Math.max(0,(toMin(b.endTime)||0)-Math.max(nowMin,toMin(b.startTime)||0)),0);
  const remainingFree = isToday ? Math.max(0, free) : free;
  const buffer = remainingFree - remainingPlanned;
  const overdue = isToday ? studyBlocks.filter(b=>!b.done && (toMin(b.endTime)||0)<nowMin) : [];
  const availableUntilBed = isToday ? Math.max(0,toMin(DATA.routine.bedtime)-nowMin) : free;
  return {nowMin,isToday,active,next,plannedStudyMin,completedStudyMin,remainingPlanned,remainingFree,buffer,overdue,availableUntilBed,studyBlocks,taskBlocks};
}

}

function todayFocusProfile(date){
  date = date || todayStr();
  const mandatory = todaysMandatoryTopics(date).map(m=>({subject:m.subject, chapter:m.chapter, mandatory:true, score:1000-(m.daysAway||0)*10}));
  let priorities = computeChapterPriorities(date).map(p=>({subject:p.subject, chapter:p.chapter, mandatory:false, score:Number(p.total)||0, raw:p}));
  const merged = [];
  const seen = new Set();
  [...mandatory,...priorities].forEach(x=>{ const k=x.subject+'::'+x.chapter; if(!seen.has(k)){seen.add(k); merged.push(x);} });
  merged.sort((a,b)=>(b.mandatory-a.mandatory)||(b.score-a.score));
  const subjectScore = {};
  merged.forEach(x=>{ subjectScore[x.subject]=(subjectScore[x.subject]||0)+(x.score||0)+(x.mandatory?350:0); });
  const subjects = Object.entries(subjectScore).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,2);
  if(!subjects.length) subjects.push('Physics');
  const major = subjects[0];
  const light = subjects[1] || null;
  const focusChapters = subjects.map(s=>{
    const x=merged.find(m=>m.subject===s);
    return x ? x.chapter : null;
  }).filter(Boolean);
  return {subjects,major,light,focusChapters,items:merged};
}

/* ===== EXAM-WEIGHTED DAY PLANNER ===== */
function examWeightedSettings(){
  if(!DATA.examPlanWeights) DATA.examPlanWeights={};
  if(!DATA.examPreferredWindow) DATA.examPreferredWindow={start:'',end:''};
  return DATA.examPlanWeights;
}
function examPlanTests(){
  const today=todayStr();
  return (DATA.upcomingTests||[]).filter(t=>t && t.date>=today)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
}
function examPlanWeightFor(t){
  examWeightedSettings();
  return Math.max(0,Math.min(100,Number(DATA.examPlanWeights[t.id] ?? t.planWeight ?? 0)));
}
function examPlanPreferredWindow(){
  examWeightedSettings();
  return DATA.examPreferredWindow;
}
function examPlanMinutesForWindow(start,end){
  if(!start||!end)return 0;
  const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number);
  let a=sh*60+sm,b=eh*60+em;
  if(b<=a)b+=1440;
  return Math.max(0,b-a);
}
function examPlanWeightedTasks(baseTasks, totalMinutes){
  const tests=examPlanTests();
  if(!tests.length)return baseTasks;
  const weighted=tests.map(t=>({test:t,weight:examPlanWeightFor(t)})).filter(x=>x.weight>0);
  if(!weighted.length)return baseTasks;
  const total=weighted.reduce((s,x)=>s+x.weight,0);
  // Prioritize exam-linked chapters in proportion to user-selected percentages.
  const result=[];
  weighted.forEach(x=>{
    const share=x.weight/total;
    const target=Math.max(0,Math.round(totalMinutes*share));
    const covered=new Set((x.test.chapters||[]).map(c=>String(c.subject)+'::'+String(c.chapter)));
    baseTasks.filter(task=>covered.has(String(task.subject)+'::'+String(task.chapter)))
      .forEach(task=>result.push({...task,_examWeight:x.weight,_examTarget:target}));
  });
  // Keep tasks not linked to an exam after exam-priority tasks.
  const coveredAll=new Set(weighted.flatMap(x=>(x.test.chapters||[]).map(c=>String(c.subject)+'::'+String(c.chapter))));
  baseTasks.filter(task=>!coveredAll.has(String(task.subject)+'::'+String(task.chapter)))
    .forEach(task=>result.push({...task,_examWeight:0}));
  return result;
}
function examPlanApplyPreferredWindow(events){
  const w=examPlanPreferredWindow();
  if(!w.start||!w.end)return events;
  const ws=toMin(w.start), we=toMin(w.end);
  if(!Number.isFinite(ws)||!Number.isFinite(we)||we<=ws)return events;
  // The main generator already clips its free slots to this window. Do not re-time
  // the generated blocks here; doing so used the wrong event shape (start/end instead
  // of startTime/endTime) and could discard/duplicate blocks. Just enforce the boundary.
  return events.filter(e=>{
    if(e.subject==='Fixed'||e.locked)return true;
    if(!e.startTime||!e.endTime)return true;
    const s=toMin(e.startTime), en=toMin(e.endTime);
    return s>=ws && en<=we;
  });
}

/* ===== SMART EXAM MODE: urgency + weak-chapter weighting + recovery ===== */
function smartExamEnsure(){
  if(!DATA.smartExam) DATA.smartExam={enabled:true,adaptive:true,lastGeneratedDate:'',weights:{}};
  if(!DATA.smartExam.weights) DATA.smartExam.weights={};
  return DATA.smartExam;
}
function smartExamUrgency(date){
  let d=999;
  try{
    if(typeof daysBetween==='function') d=daysBetween(todayStr(),date);
    else{
      const a=new Date(todayStr()+'T00:00:00'), b=new Date(String(date)+'T00:00:00');
      d=Math.round((b-a)/86400000);
    }
  }catch(e){ d=999; }
  if(d<=0)return {label:'TODAY',score:100};
  if(d===1)return {label:'TOMORROW',score:95};
  if(d<=3)return {label:'2–3 DAYS',score:80};
  if(d<=7)return {label:'4–7 DAYS',score:60};
  return {label:'LATER',score:30};
}
function smartExamUpcoming(){
  const target=typeof pragatiTomorrowExams==='function'
    ? new Set(pragatiTomorrowExams().map(t=>String(t.id)))
    : new Set();
  return examPlanTests()
    .map(t=>({...t,urgency:smartExamUrgency(t.date),isTomorrow:target.has(String(t.id))}))
    .sort((a,b)=>(b.isTomorrow-a.isTomorrow)||((b.urgency?.score||0)-(a.urgency?.score||0)))
    .slice(0,8);
}
function smartExamChapterStrength(subject,chapter){
  const rows=prChapterMasterySafe(subject,chapter);
  if(!rows) return 50;
  return rows.mastery;
}
function prChapterMasterySafe(subject,chapter){
  try{
    if(typeof chapterMastery==='function'){
      const r=chapterMastery(subject,chapter);
      if(r) return r;
    }
  }catch(e){}
  const attempts=(DATA.attemptLog||[]).filter(a=>a.subject===subject&&a.chapter===chapter);
  if(!attempts.length)return null;
  const correct=attempts.filter(a=>a.correct===true || a.isCorrect===true || a.result==='correct').length;
  const acc=Math.round(correct/attempts.length*100);
  return {mastery:acc};
}
function smartExamChapterPriority(test,chapter){
  const urgency=test.urgency?.score||smartExamUrgency(test.date).score;
  const strength=smartExamChapterStrength(chapter.subject,chapter.chapter);
  // Weakness gets more attention, urgency multiplies it.
  return Math.round(urgency*(0.65 + (100-strength)/100*0.35));
}
function smartExamBuildPriorityList(){
  const tests=smartExamUpcoming();
  const rows=[];
  tests.forEach(t=>{
    (t.chapters||[]).forEach(c=>{
      rows.push({
        testId:t.id,testName:t.name,date:t.date,urgency:t.urgency,
        subject:c.subject,chapter:c.chapter,
        strength:smartExamChapterStrength(c.subject,c.chapter),
        priority:smartExamChapterPriority(t,c)
      });
    });
  });
  return rows.sort((a,b)=>b.priority-a.priority);
}
function smartExamRecoverUnfinished(){
  const today=todayStr();
  const unfinished=(DATA.plannerEvents||[]).filter(e=>{
    if(e.date!==today)return false;
    if(e.done)return false;
    if(e.generated===false)return false;
    return e.chapter && (e.type==='study'||e.kind==='study'||e.subject);
  });
  if(!unfinished.length)return {count:0,minutes:0};
  const windows=[];
  const w=examPlanPreferredWindow();
  if(w.start&&w.end)windows.push(w);
  let minutes=0;
  unfinished.forEach(e=>minutes+=Number(e.duration||e.minutes||timeDiff(e.startTime||e.start,e.endTime||e.end)||0));
  return {count:unfinished.length,minutes};
}
function smartExamGenerateRecovery(){
  const rec=smartExamRecoverUnfinished();
  if(!rec.count)return toast('No unfinished generated blocks to redistribute.');
  const w=examPlanPreferredWindow();
  if(!w.start||!w.end)return toast('Set your preferred study window first.');
  const today=todayStr();
  const unfinished=(DATA.plannerEvents||[]).filter(e=>e.date===today&&!e.done&&e.chapter);
  // Remove only unfinished generated study blocks; fixed commitments remain untouched.
  DATA.plannerEvents=DATA.plannerEvents.filter(e=>!unfinished.includes(e));
  const start=toMin(w.start),end=toMin(w.end);
  let cursor=start;
  unfinished.forEach(e=>{
    const dur=Math.max(10,Number(e.duration||e.minutes||30));
    if(cursor+dur>end)return;
    e.startTime=minToTime(cursor);e.endTime=minToTime(cursor+dur);
    e.date=today;e.generated=true;e.rebalanced=true;
    DATA.plannerEvents.push(e);cursor+=dur;
  });
  save();render();
  toast(`🔄 Redistributed ${Math.min(rec.minutes,(end-start))} minutes into your preferred window.`);
}
function toMin(t){
  if(!t)return 0;
  const [h,m]=String(t).split(':').map(Number);return h*60+m;
}
function minToTime(n){
  n=((n%1440)+1440)%1440;
  return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
}

let plannerSwapSelection = null;
function studyTechniqueForBlock(b){
  const subject=(b.subject||'').toLowerCase(), act=(b.activity||'').toLowerCase();
  const chapter=(b.chapter||b.activity||'').toLowerCase();
  if(subject==='biology' || /ncert/.test(act)) return {title:'NCERT Active Recall', steps:['Read the exact NCERT section','Close the book and recall key points','Re-open and mark missed NCERT terms','Do 5–10 exam questions/PYQs','Write 3 facts you still forget']};
  if(subject==='physics' || subject==='maths') return {title:subject==='physics'?'Concept → Formula → Problems':'Recall → Example → Timed Problems', steps:subject==='physics'?['Recall the concept + diagram','Write formulas without looking','Solve 2 basic questions','Solve 3 exam-level/PYQs','Record every calculation/concept error']:['Recall formulas/results','Study one worked example','Solve 3 untimed questions','Solve 3 timed questions','Log the exact mistake pattern']};
  if(subject==='chemistry') return {title:/organic|goc|hydrocarbon/.test(chapter)?'Reaction Map + Practice':'Concept → Formula/Rule → Questions', steps:/organic|goc|hydrocarbon/.test(chapter)?['Recall reagent/reaction rules','Build the reaction pathway','Do 3 mechanism/application questions','Solve 3 PYQs','Review exceptions and mistakes']:['Understand the core concept','Write formulas/rules from memory','Solve 2 guided examples','Solve 5 exam questions','Review errors and weak points']};
  if(/pyq|question|practice|qns/.test(act)) return {title:'Active Question Practice',steps:['Attempt without notes','Mark unsure questions','Check solution only after attempting','Log mistakes by reason','Re-attempt the wrong ones']};
  if(/revision|revise/.test(act)) return {title:'Active Recall Revision',steps:['Brain-dump what you remember','Check notes/NCERT','Fill only the gaps','Do 5 retrieval questions','Schedule the next revision']};
  if(/backlog/.test(act)) return {title:'Backlog Recovery',steps:['Learn the minimum foundation','Make a one-page recall sheet','Solve basic questions','Do selected PYQs','Mark what needs a second pass']};
  return {title:'Learn → Recall → Practice',steps:['Set one concrete outcome','Study actively, not passively','Close notes and recall','Solve questions','Record what remains weak']};
}
function openBlockTechnique(id){
  const b=(DATA.plannerEvents||[]).find(x=>x.id===id); if(!b) return;

function shiftTimeString(t,delta){ const m=toMin(t); return m==null?null:toTimeStr(m+delta); }
function plannerExtendBlock(id,delta){
  // Work on the currently viewed planner date, not only today's date.
  const date = plannerViewDate || todayStr();
  const blocks=(DATA.plannerEvents||[]).filter(x=>x.date===date).sort((a,b)=>toMin(a.startTime)-toMin(b.startTime));
  const b=(DATA.plannerEvents||[]).find(x=>x.id===id && x.date===date);
  if(!b || b.subject==='Fixed' || b.subject==='Break' || b.done) return toast('Only an unfinished study block can be resized.');
  const oldStart=toMin(b.startTime), oldEnd=toMin(b.endTime); if(oldStart==null||oldEnd==null) return;
  const newEnd=oldEnd+delta;
  if(newEnd<=oldStart+5) return toast('Keep at least 5 minutes in a study block.');
  if(newEnd>24*60) return toast('That extension would go past midnight.');

  const later=blocks.filter(x=>x.id!==b.id && toMin(x.startTime)>=oldEnd);
  const movable=later.filter(x=>x.subject!=='Fixed' && x.subject!=='Break');
  const fixedLater=later.filter(x=>x.subject==='Fixed');

  // Simulate the complete shift before changing anything. This prevents a later
  // movable block from being pushed into a fixed commitment.
  const proposed=movable.map(x=>({
    x,
    start:toMin(x.startTime)+delta,
    end:toMin(x.endTime)+delta
  }));
  for(const q of proposed){
    if(q.start<0 || q.end>24*60) return toast('Not enough room to shift the following study blocks.');
  }
  const proposedFixed = fixedLater.map(x=>({x,start:toMin(x.startTime),end:toMin(x.endTime)}));
  const allAfter = [...proposed.map(q=>({start:q.start,end:q.end,subject:q.x.subject})), ...proposedFixed]
    .sort((a,b)=>a.start-b.start);
  for(let i=1;i<allAfter.length;i++){
    if(allAfter[i-1].end > allAfter[i].start){
      const conflict = allAfter[i].subject==='Fixed' ? 'a fixed commitment' : 'another study block';
      return toast(`Cannot change this block — it would overlap ${conflict}.`);
    }
  }

  for(const q of proposed){ q.x.startTime=toTimeStr(q.start); q.x.endTime=toTimeStr(q.end); }
  b.endTime=toTimeStr(newEnd);
  b.manualDuration=true;
  b.generated=false;
  save(); render();
  toast(`${delta>0?'Extended':'Reduced'} ${Math.abs(delta)} min — no time conflicts created.`);
}
function plannerAddReset(id,minutes=2){
  const b=(DATA.plannerEvents||[]).find(x=>x.id===id);
  if(!b || b.subject==='Fixed' || b.subject==='Break') return;
  const end=toMin(b.endTime);
  if(end==null) return;
  if(minutes<1) return toast('Reset must be at least 1 minute.');
  if(end+minutes>24*60) return toast('There is not enough time for a reset before midnight.');

  const all=(DATA.plannerEvents||[]).filter(x=>x.date===b.date && x.id!==b.id);
  const later=all.filter(x=>{ const st=toMin(x.startTime); return st!=null && st>=end; })
    .sort((a,c)=>toMin(a.startTime)-toMin(c.startTime));

  // Simulate every shifted block before mutating anything. This catches:
  // 1) a shifted study block running past midnight, and
  // 2) a shifted study block colliding with any later fixed or unshifted block.
  const shifted=later.filter(x=>x.subject!=='Fixed').map(x=>({
    x, start:toMin(x.startTime)+minutes, end:toMin(x.endTime)+minutes
  }));
  for(const q of shifted){
    if(q.start<0 || q.end>24*60) return toast('Not enough room to insert this reset without going past midnight.');
  }

  const fixed=later.filter(x=>x.subject==='Fixed').map(x=>({
    x, start:toMin(x.startTime), end:toMin(x.endTime)
  }));
  const shiftedAndFixed=[...shifted.map(q=>({start:q.start,end:q.end,subject:q.x.subject})),
                         ...fixed.map(q=>({start:q.start,end:q.end,subject:'Fixed'}))]
    .sort((a,c)=>a.start-c.start);
  for(let i=1;i<shiftedAndFixed.length;i++){
    if(shiftedAndFixed[i-1].end>shiftedAndFixed[i].start){
      const conflict=shiftedAndFixed[i].subject==='Fixed'?'a fixed commitment':'another study block';
      return toast(`Cannot insert the reset — it would overlap ${conflict}.`);
    }
  }

  for(const q of shifted){
    q.x.startTime=toTimeStr(q.start);
    q.x.endTime=toTimeStr(q.end);
  }
  DATA.plannerEvents.push({
    id:uid(), date:b.date, startTime:b.endTime, endTime:toTimeStr(end+minutes),
    subject:'Break', activity:`${minutes}-min reset · water + eye rest + stretch`,
    goals:['Reset briefly — no scrolling'], subtasks:[], done:false, generated:false, locked:true
  });
  save(); render(); toast(`☕ ${minutes}-minute reset inserted safely.`);
}
function plannerSwapBlock(id){
  const b=(DATA.plannerEvents||[]).find(x=>x.id===id);
  if(!b || b.subject==='Fixed' || b.subject==='Break') return toast('Only study topics can be swapped.');
  if(!plannerSwapSelection){ plannerSwapSelection=id; render(); return toast('Swap selected — tap another study block to exchange their topics.'); }
  if(plannerSwapSelection===id){ plannerSwapSelection=null; render(); return; }
  const a=(DATA.plannerEvents||[]).find(x=>x.id===plannerSwapSelection);
  plannerSwapSelection=null;
  if(!a || a.subject==='Fixed' || a.subject==='Break') return render();
  if(a.date!==b.date) return toast('Topics can only be swapped within the same day.');

  // Swap CONTENT only. Time, completion state, lock state, generation state,
  // manual duration and other slot metadata remain attached to their original slots.
  ['subject','activity','chapter','goals','subtasks','examType','priority'].forEach(k=>{
    const tmp=a[k]; a[k]=b[k]; b[k]=tmp;
  });
  a.swapped=true; b.swapped=true;
  save(); render(); toast('🔄 Topics swapped — time slots and slot status stayed exactly the same.');
}

  if(!inserted) parts.push(nowMarker);
  return parts.join('');
}

function fmtTime(t){
  if(!t) return '—';
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12?'PM':'AM';
  const h12 = h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function shiftPlannerDate(delta){
  const d = new Date(plannerViewDate || todayStr());
  d.setDate(d.getDate()+delta);
  plannerViewDate = d.toISOString().slice(0,10);
  render();
}

function savePlannerBlock(editId){
  const date = document.getElementById('f_date').value;
  const startTime = document.getElementById('f_start').value;
  const endTime = document.getElementById('f_end').value;
  if(!date || !startTime || !endTime) return toast('Please fill date, start and end time.');
  if(endTime <= startTime) return toast('End time must be after start time.');

  const subject = document.getElementById('f_subject').value;
  const chapter = subjectNames().includes(subject) ? (document.getElementById('f_chapter')?.value || '') : '';
  const topic = chapter ? (document.getElementById('f_topic')?.value || '') : '';
  const activity = document.getElementById('f_activity').value.trim();
  const goals = document.getElementById('f_goals').value.split('\n').map(s=>s.trim()).filter(Boolean);

  if(subjectNames().includes(subject) && !chapter){
    return toast('Please choose the chapter for this study block.');
  }

  if(!DATA.plannerEvents) DATA.plannerEvents = [];
  const priorSubtasks = editId ? ((DATA.plannerEvents.find(x=>x.id===editId)||{}).subtasks||[]) : [];
  const subtasks = [];
  ['lecture','ncert','qns'].forEach(kind=>{
    const el=document.getElementById('f_sub_'+kind);
    if(el && el.checked){
      const prior=priorSubtasks.find(s=>s.kind===kind);
      subtasks.push(prior ? prior : makeSubtask(kind));
    }
  });

  if(editId){
    const b=DATA.plannerEvents.find(x=>x.id===editId);
    Object.assign(b,{date,startTime,endTime,subject,chapter,topic,activity,goals,subtasks});
    if(b.generated && b.subject!=='Fixed') b.generated=false;
  }else{
    DATA.plannerEvents.push({id:uid(),date,startTime,endTime,subject,chapter,topic,activity,goals,subtasks,done:false});
  }
  plannerViewDate=date;
  save(); closeModal(); render(); toast('Time block saved.');
}

// ---- Actual-time calibration: learn each subject's real pace vs. the estimate ----
// When a study block is marked done, we ask how long it actually took (optional — cancel/blank
// just skips it) and fold the ratio into a per-subject running average, so future plan durations
// for that subject drift toward what's actually true instead of a flat guess.
function subjectTimeCalibrationFactor(subject){
  const c = (DATA.timeCalibration||{})[subject];
  if(!c || c.count < 3) return 1;
  return clamp(c.sumRatio / c.count, 0.7, 1.6);
}
function recordActualTime(subject, estimatedMin, actualMin){
  if(!estimatedMin || !actualMin || actualMin<=0) return;
  const ratio = clamp(actualMin/estimatedMin, 0.3, 3);
  if(!DATA.timeCalibration) DATA.timeCalibration = {};
  const c = DATA.timeCalibration[subject] || {sumRatio:0, count:0};
  c.sumRatio += ratio; c.count += 1;
  DATA.timeCalibration[subject] = c;
}
function togglePlannerBlockDone(id){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===id);
  if(!b) return;
  const turningOn = !b.done;
  b.done = !b.done;
  // Ask for real elapsed time only when finishing (not un-checking) a real study block for a
  // tracked subject — skip Fixed/Break/Revision-filler blocks where "estimate vs actual" isn't meaningful.
  if(turningOn && subjectNames().includes(b.subject) && toMin(b.startTime)!=null && toMin(b.endTime)!=null){
    const estimated = toMin(b.endTime) - toMin(b.startTime);
    const answer = window.prompt(`How many minutes did "${b.activity||b.chapter||b.subject}" actually take? (Planned: ${estimated}m — leave blank to skip)`, '');
    if(answer && answer.trim() !== ''){
      const actual = parseInt(answer);
      if(actual > 0) recordActualTime(b.subject, estimated, actual);
    }
  }
  save(); render();
}
/* ---------------- Study-block subtasks: NCERT reading / Lecture / Question solving ----------------
   Each academic study block can carry its own little checklist so the three natural steps of
   learning a chapter — watch the lecture, read the NCERT portion, solve questions — are tracked
   as ticks inside that one block instead of needing separate blocks for each. */
const SUBTASK_KIND_META = {
  lecture: {icon:'🎥', label:'Watch lecture'},
  ncert:   {icon:'📖', label:'Read NCERT'},
  qns:     {icon:'✍️', label:'Solve questions'},
};
function makeSubtask(kind, label){
  const meta = SUBTASK_KIND_META[kind] || {icon:'☑️', label:label||'Task'};
  return {id:uid(), kind, label: label || meta.label, done:false, timerRunning:false, timerStartedAt:null, timerAccumMs:0, breakPrompted:false};
}
// Default checklist for a plain study session covering a chapter end-to-end.
function defaultStudySubtasks(){
  return [makeSubtask('lecture'), makeSubtask('ncert'), makeSubtask('qns')];
}
function subtaskElapsedMs(st){
  return (st.timerAccumMs||0) + (st.timerRunning && st.timerStartedAt ? (Date.now()-st.timerStartedAt) : 0);
}
function findSubtask(blockId, subtaskId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  const st = b && Array.isArray(b.subtasks) ? b.subtasks.find(s=>s.id===subtaskId) : null;
  return {b, st};
}
// Small inline ▶/⏸ timer per subtask — lets the student time each step (lecture / NCERT /
// questions) individually without opening full Focus Mode. Persisted on the subtask itself so
// it survives a reload, same way Focus Sessions do. Pomodoro-style: after subtaskPomodoroMin
// minutes of continuous running on one subtask, it auto-pauses and nudges a short break.
function toggleSubtaskTimer(blockId, subtaskId){
  const {st} = findSubtask(blockId, subtaskId);
  if(!st || st.done) return;
  if(st.timerRunning){
    st.timerAccumMs = subtaskElapsedMs(st); st.timerRunning = false; st.timerStartedAt = null;
    save(); render();
  } else {
    st.timerRunning = true; st.timerStartedAt = Date.now(); st.breakPrompted = false;
    save(); render(); tickSubtaskTimers();
  }
}
let subtaskTimerInterval = null;
function tickSubtaskTimers(){
  clearInterval(subtaskTimerInterval);
  subtaskTimerInterval = setInterval(()=>{
    let anyRunning = false;
    const pomodoroMs = (DATA.routine.subtaskPomodoroMin||25)*60000;
    let breakFired = null;
    (DATA.plannerEvents||[]).forEach(b=>{
      (b.subtasks||[]).forEach(st=>{
        if(!st.timerRunning) return;
        anyRunning = true;
        const continuousMs = st.timerStartedAt ? (Date.now()-st.timerStartedAt) : 0;
        if(!st.breakPrompted && continuousMs >= pomodoroMs){
          // Auto-pause and bank the time — same effect as tapping ⏸ — then flag so it doesn't
          // keep re-firing every second while paused.
          st.timerAccumMs = subtaskElapsedMs(st); st.timerRunning = false; st.timerStartedAt = null;
          st.breakPrompted = true;
          breakFired = st;
          return;
        }
        const el = document.querySelector(`.js-subtask-timer[data-id="${st.id}"]`);
        if(el) el.textContent = formatTimerMs(subtaskElapsedMs(st));
      });
    });
    if(breakFired){
      save(); render();
      toast(`🍅 ${DATA.routine.subtaskPomodoroMin||25} min on "${breakFired.label}" — take a short break, then tap ▶ to resume.`);
      if(notificationPermissionStatus()==='granted'){
        try{ new Notification('🍅 Pomodoro break time', { body:`${DATA.routine.subtaskPomodoroMin||25} min on "${breakFired.label}" — stretch, hydrate, look away.`, tag:'pragati-pomodoro' }); }catch(e){}
      }
    }
    if(!anyRunning) clearInterval(subtaskTimerInterval);
  }, 1000);
}
function toggleSubtask(blockId, subtaskId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  if(!b || !Array.isArray(b.subtasks)) return;
  const st = b.subtasks.find(s=>s.id===subtaskId);
  if(!st) return;
  st.done = !st.done;
  if(st.done){
    // Marking done banks whatever time was on the clock (if the timer was used) and logs it
    // as study hours, same as finishing a Focus Session on this step.
    const ms = subtaskElapsedMs(st);
    st.timerAccumMs = ms; st.timerRunning = false; st.timerStartedAt = null;
    if(ms > 0){
      const minutes = Math.max(1, Math.round(ms/60000));
      const hours = Math.round((minutes/60)*100)/100;
      DATA.studyLog.push({id:uid(), date:todayStr(), subject:b.subject, hours, type:(st.kind==='qns'?'practice':'concept')});
      addXP('study');
      toast(`✅ ${st.label} done — ${minutes} min logged.`);
      updateStreak(); checkAchievements();
    }
  }
  // Completing every subtask marks the whole block done (and un-ticking one reopens it) —
  // keeps the block's own checkbox honest without the student having to double-tick things.
  b.done = b.subtasks.every(s=>s.done);
  save(); render();
}
// Locking a block is the "totally under my control" switch: Generate Plan will build the
// rest of the day around it but will never move, resize, or delete it.
function togglePlannerBlockLock(id){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===id);
  if(!b) return;
  b.locked = !b.locked;
  save(); render();
  toast(b.locked ? '🔒 Locked — Generate Plan will build around this and leave it alone.' : '🔓 Unlocked — this can be replaced next time you generate a plan.');
}
// Free time on a given date excluding a specific block (so it can be re-placed) and excluding
// every OTHER already-scheduled block that day, not just Master Schedule fixed commitments —
// used when moving a missed block, not when generating from scratch.
function getFreeSlotsExcludingBlock(date, excludeBlockId){
  const r = DATA.routine;
  const dayEnd = toMin(r.bedtime);
  let dayStart = toMin(r.wakeTime);
  if(date === todayStr()){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    dayStart = Math.max(dayStart, Math.min(Math.ceil(nowMin/5)*5, dayEnd));
  }
  const busy = (DATA.plannerEvents||[])
    .filter(b=>b.date===date && b.id!==excludeBlockId && b.startTime && b.endTime)
    .map(b=>({start:b.startTime, end:b.endTime}));
  const merged = mergeBusyBlocks(busy);
  const free = []; let cursor = dayStart;
  merged.forEach(b=>{
    if(b.start > cursor) free.push({start:cursor, end:Math.min(b.start,dayEnd)});
    cursor = Math.max(cursor, b.end);
  });
  if(cursor < dayEnd) free.push({start:cursor, end:dayEnd});
  return free.filter(s=>s.end-s.start >= 10);
}
// "Realistic planner" adaptation #1: didn't finish something in time today — move it into the
// next open gap today instead of leaving it stranded as a red missed block.
function rescheduleBlockToNextSlot(blockId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  if(!b) return;
  const duration = Math.max(10, (toMin(b.endTime)||0) - (toMin(b.startTime)||0));
  const free = getFreeSlotsExcludingBlock(b.date, b.id);
  const slot = free.find(s => (s.end-s.start) >= duration);
  if(!slot){ toast("No free slot big enough left today — try pushing it to tomorrow instead."); return; }
  b.startTime = toTimeStr(slot.start);
  b.endTime = toTimeStr(slot.start+duration);
  b.rescheduled = (b.rescheduled||0) + 1;
  save(); render();
  toast(`↻ Moved to ${fmtTime(b.startTime)}–${fmtTime(b.endTime)} today.`);
}
// "Realistic planner" adaptation #2: couldn't get to it today at all — carry it into tomorrow's
// timeline (locked, so a fresh Generate Plan won't wipe it out) instead of just losing it.
function rescheduleBlockToTomorrow(blockId){
  const b = (DATA.plannerEvents||[]).find(x=>x.id===blockId);
  if(!b) return;
  const tmr = new Date(b.date); tmr.setDate(tmr.getDate()+1);
  const tmrDate = tmr.toISOString().slice(0,10);
  const duration = Math.max(10, (toMin(b.endTime)||0) - (toMin(b.startTime)||0));
  const free = getFreeSlotsExcludingBlock(tmrDate, null);
  const slot = free.find(s => (s.end-s.start) >= duration) || free[0];
  const startMin = slot ? slot.start : toMin(DATA.routine.wakeTime);
  const endMin = slot ? Math.min(slot.start+duration, slot.end) : startMin+duration;
  b.date = tmrDate;
  b.startTime = toTimeStr(startMin);
  b.endTime = toTimeStr(endMin);
  b.carriedOver = true;
  b.locked = true;
  save(); render();

function backlogWeekStart(date){
  // Backlog week starts on SUNDAY so the longest/freest session can launch the chapter.
  const d = new Date((date||todayStr())+'T00:00:00');
  const day = d.getDay(); const diff = -day;
  d.setDate(d.getDate()+diff); return d.toISOString().slice(0,10);
}
function backlogWeekDates(start){
  const out=[]; const d=new Date((start||backlogWeekStart())+'T00:00:00');
  for(let i=0;i<7;i++){ const x=new Date(d); x.setDate(d.getDate()+i); out.push(x.toISOString().slice(0,10)); }
  return out;
}
function backlogStage(ch){
  if(!ch) return {key:'foundation',label:'Foundation',icon:'🧱'};
  if(!ch.lecture && !ch.ncert && chapterCompletion(ch)<15) return {key:'foundation',label:'Foundation',icon:'🧱'};
  if((ch.questions||0)<30) return {key:'questions',label:'Question Bank',icon:'✏️'};
  if((ch.pyqCount||0)<10) return {key:'pyq',label:'PYQ Revision',icon:'📄'};
  if((ch.accuracy||0)>0 && ch.accuracy<70) return {key:'errors',label:'Error Review',icon:'🧯'};
  return {key:'revision',label:'Revision',icon:'🔁'};
}
function backlogPriorityScore(subject,ch){
  if(!ch || chapterClassLevel(subject,ch)!==11 || ch.skipped) return -1;
  const completion=chapterCompletion(ch), accuracy=Number(ch.accuracy)||0;
  const prereqBoost = Object.values(CLASS11_PREREQ_MAP||{}).some(map=>Object.values(map||{}).flat().includes(ch.name)) ? 12 : 0;
  const currentLinkBoost = allChapters().some(c=>chapterClassLevel(c.subject,c)!==11 && (CLASS11_PREREQ_MAP[c.subject]?.[c.name]||[]).includes(ch.name) && chapterCompletion(c)<60) ? 18 : 0;
  const missedBoost = (ch.mistakes||0)>0 ? Math.min(15,ch.mistakes*2) : 0;
  const staleBoost = ch.lastRevised ? Math.min(15,Math.max(0,daysBetween(ch.lastRevised,todayStr()))) : 12;
  const priorityBoost = ch.priority==='high' ? 12 : ch.priority==='low' ? 0 : 6;
  const highYield = highYieldBoost(subject, ch.name);
  return Math.round((100-completion)*0.55 + (accuracy?100-accuracy:25)*0.18 + prereqBoost + currentLinkBoost + missedBoost + staleBoost + priorityBoost + highYield);
}
function getBacklogChapters(){
  return allChapters().map(ch=>({...ch,score:backlogPriorityScore(ch.subject,ch),stage:backlogStage(ch)})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score);
}
function backlogWeekRatio(start){
  const dates=backlogWeekDates(start||backlogWeekStart());
  const tests=(DATA.upcomingTests||[]).filter(t=>daysBetween(todayStr(),t.date)>=0 && daysBetween(todayStr(),t.date)<=7);
  const nearTest=tests.some(t=>daysBetween(todayStr(),t.date)<=3);
  const nearSchoolWeekly=tests.some(t=>isSchoolWeeklyTest(t) && daysBetween(todayStr(),t.date)<=7);
  const schoolExam=upcomingSchoolExamWindow();
  const holidayCount=dates.filter(d=>(DATA.scheduleOverrides||{})[d]?.holiday).length;
  // During the final 7 days before a school exam, protect the school portion.
  if(schoolExam && schoolExam.d<=7) return 0.05;
  if(holidayCount>=3) return 0.50; if(nearTest) return 0.15; if(nearSchoolWeekly) return 0.20; return 0.30;
}
function dailyBacklogCapacityMinutes(date){ if(date<todayStr()) return 0; return getFreeSlots(date).reduce((sum,x)=>sum+Math.max(0,x.end-x.start),0); }
function backlogWeekBudget(start){
  const week=start||backlogWeekStart(), ratio=backlogWeekRatio(week);
  const capacity=backlogWeekDates(week).reduce((sum,d)=>sum+dailyBacklogCapacityMinutes(d),0);
  return {ratio,capacityMinutes:capacity,targetMinutes:Math.round(capacity*ratio),targetHours:Math.round(capacity*ratio/60*10)/10};
}
function ensureBacklogWeek(){
  const start=backlogWeekStart(); DATA.backlog=DATA.backlog||{history:[]};
  if(DATA.backlog.weekStart!==start){
    if(DATA.backlog.weekStart && (DATA.backlog.workflowGenerated || DATA.backlog.targetHours)){
      DATA.backlog.history=Array.isArray(DATA.backlog.history)?DATA.backlog.history:[];
      DATA.backlog.history.unshift({weekStart:DATA.backlog.weekStart,targetHours:DATA.backlog.targetHours||0,ratio:DATA.backlog.ratio||0.3,rolloverCount:DATA.backlog.rolloverCount||0,closedAt:todayStr()});
      DATA.backlog.history=DATA.backlog.history.slice(0,12);
    }
    DATA.backlog.weekStart=start; DATA.backlog.workflowGenerated=false; DATA.backlog.rolloverCount=0;
    if(DATA.backlog.manualChapterId && !getBacklogChapters().some(c=>c.id===DATA.backlog.manualChapterId)){
      DATA.backlog.manualChapterId=null; DATA.backlog.selectionMode='auto';
    }
    const b=backlogWeekBudget(start); DATA.backlog.ratio=b.ratio; DATA.backlog.targetHours=b.targetHours; save();
  }
  return DATA.backlog;
}

function chapterDataByName(subject, name){
  const s=DATA.subjects?.[subject];
  if(!s?.chapters) return null;
  return s.chapters.find(c=>c.name===name)||null;
}
function chapterReadiness(subject, name){
  const c=chapterDataByName(subject,name);
  if(!c) return {score:0,stage:'Not started',parts:{}};
  const coverage=Number(c.coverage ?? c.completion ?? c.progress ?? 0);
  const understanding=Number(c.understanding ?? c.confidence ?? 0);
  const accuracy=Number(c.accuracy ?? 0);
  const q=Number(c.questions ?? c.qns ?? 0);
  const pyq=Number(c.pyqs ?? c.PYQs ?? 0);
  const revision=c.lastRevised ? Math.max(0,100-Math.min(100,daysBetween(c.lastRevised,todayStr())*7)) : 0;
  const parts={coverage,understanding,accuracy,questions:Math.min(100,q/Math.max(1,Number(c.questionTarget||50))*100),pyqs:Math.min(100,pyq/Math.max(1,Number(c.pyqTarget||20))*100),revision};
  const score=Math.round(
    parts.coverage*.20+parts.understanding*.15+parts.accuracy*.20+
    parts.questions*.15+parts.pyqs*.15+parts.revision*.15
  );
  const stage=score>=85?'Exam-ready':score>=70?'Practice-ready':score>=45?'Building':'Foundation';
  return {score,stage,parts};
}
function testPreparationMeter(test){
  const chapters=test?.chapters||[];
  if(!chapters.length) return {score:0,items:[]};
  const items=chapters.map(x=>{
    const r=chapterReadiness(x.subject,x.chapter);
    return {...x,score:r.score,stage:r.stage};
  });
  return {score:Math.round(items.reduce((a,x)=>a+x.score,0)/items.length),items};
}
function upcomingTestSmart(){
  const tests=(DATA.upcomingTests||[]).map(t=>({...t,d:daysBetween(todayStr(),t.date)}))
    .filter(t=>t.d>=0).sort((a,b)=>a.d-b.d);
  return tests[0]||null;
}
function smartQuestionTarget(subject, chapter, minutes, urgency){
  const base=/Biology/.test(subject)?0.55:/Maths|Physics/.test(subject)?0.35:0.45;
  const urgencyBoost=urgency<=3?1.25:urgency<=7?1.1:1;
  const n=Math.max(5,Math.round(minutes*base/urgencyBoost));
  const accuracy=urgency<=3?75:70;
  return {count:n,accuracy};
}
function prerequisiteHint(subject, chapter){
  const c=chapterDataByName(subject,chapter);
  if(!c) return null;
  const prereq=c.prerequisites||c.prerequisite||[];
  if(!Array.isArray(prereq) || !prereq.length) return null;
  const weak=prereq.map(p=>{
    const name=typeof p==='string'?p:p.chapter;
    const r=chapterReadiness(subject,name);
    return {name,score:r.score};
  }).filter(x=>x.score<60);
  return weak.length?weak[0]:null;
}
function backlogZeroStats(){
  const all=[];
  Object.entries(DATA.subjects||{}).forEach(([subject,s])=>{
    (s.chapters||[]).forEach(c=>{
      if(chapterClassLevel(subject,c)===11) all.push({subject,name:c.name,c});
    });
  });
  const remaining=all.filter(x=>Number(x.c.coverage??x.c.completion??x.c.progress??0)<90).length;
  const total=all.length;
  const done=Math.max(0,total-remaining);
  const weeklyTarget=Math.max(1,Math.round((DATA.backlog?.targetHours||2)/2));
  const pace=Number(DATA.backlog?.chaptersPerMonth||0);
  return {total,remaining,done,weeklyTarget,pace,percent:total?Math.round(done/total*100):0};
}
function smartCatchUpOptions(block){

function applySmartCatchUp(key,blockId){

}

function weekDateRange(){
  const now=new Date();
  const day=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return {start:mon,end:sun,startStr:mon.toISOString().slice(0,10),endStr:sun.toISOString().slice(0,10)};
}
function weeklyPlannerEvents(){
  const r=weekDateRange();
  return (DATA.plannerEvents||[]).filter(e=>e.date>=r.startStr&&e.date<=r.endStr);
}
function eventMinutes(e){
  return Math.max(0,(toMin(e.endTime)||0)-(toMin(e.startTime)||0));
}
function weeklyReviewStats(){
  const ev=weeklyPlannerEvents();
  const study=ev.filter(e=>e.subject!=='Break');
  const planned=study.reduce((a,e)=>a+eventMinutes(e),0);
  const done=study.filter(e=>e.done).reduce((a,e)=>a+eventMinutes(e),0);
  const breaks=ev.filter(e=>e.subject==='Break').reduce((a,e)=>a+eventMinutes(e),0);
  const core=DATA.dailyCore||{};
  let coreDays=0;
  for(let i=0;i<7;i++){
    const d=new Date(weekDateRange().start);d.setDate(d.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const tasks=(core.tasks||[]).filter(t=>t.enabled!==false);
    if(tasks.length && tasks.every(t=>core.completed?.[`${ds}::${t.id}`])) coreDays++;
  }
  const z=backlogZeroStats();
  const test=upcomingTestSmart();
  return {
    planned,done,breaks,
    completion:planned?Math.round(done/planned*100):0,

  };
}
