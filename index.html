function ensureGenerationWindow(){
  // Internal default framework only — no user-facing generation-window settings.
  if(!DATA.generationWindow) DATA.generationWindow={enabled:true,byDay:{},defaultStart:'05:30',defaultEnd:'22:00'};
  DATA.generationWindow.enabled=true;
  DATA.generationWindow.defaultStart='05:30';
  DATA.generationWindow.defaultEnd='22:00';
  DATA.generationWindow.byDay={};
}
function generationDayKey(date){ const d=new Date(date+'T00:00:00'); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }
function getGenerationWindow(date=todayStr()){
  ensureGenerationWindow();
  return {date,day:generationDayKey(date),start:'05:30',end:'22:00',startMin:330,endMin:1320,enabled:true};
}
function setGenerationWindowDay(){ toast('Pragati uses one fixed daily planning framework.'); }
function setGenerationWindowDefault(){ toast('Pragati uses one fixed daily planning framework.'); }
function toggleGenerationWindow(){ toast('Pragati uses one fixed daily planning framework.'); }
function generationWindowHTML(){ return ''; }
function generationWindowFreeSlots(date, extraBusy=[]){
  const w=getGenerationWindow(date);
  if(!w.enabled) return null;
  if(w.endMin<=w.startMin) return [];
  const busy=(DATA.plannerEvents||[])
    .filter(b=>b.date===date && b.startTime && b.endTime)
    .map(b=>({start:Math.max(w.startMin,toMin(b.startTime)),end:Math.min(w.endMin,toMin(b.endTime))}))
    .filter(b=>b.end>b.start);
  extraBusy.forEach(b=>{
    const s=Math.max(w.startMin,Number(b.start)),e=Math.min(w.endMin,Number(b.end));
    if(e>s) busy.push({start:s,end:e});
  });
  const merged=mergeBusyBlocks(busy);
  const free=[]; let cursor=w.startMin;
  merged.forEach(b=>{
    if(b.start>cursor) free.push({start:cursor,end:b.start});
    cursor=Math.max(cursor,b.end);
  });
  if(cursor<w.endMin) free.push({start:cursor,end:w.endMin});
  return free.filter(s=>s.end-s.start>=10);
}
function clampGeneratedEventToWindow(event){
  const w=getGenerationWindow(event.date);
  if(!w.enabled) return event;
  let s=Math.max(w.startMin,toMin(event.startTime));
  let e=Math.min(w.endMin,toMin(event.endTime));
  if(e<=s) return null;
  event.startTime=toTimeStr(s);
  event.endTime=toTimeStr(e);
  return event;
}
function generationWindowViolation(event){
  const w=getGenerationWindow(event.date);
  if(!w.enabled || !event.startTime || !event.endTime) return false;
  return toMin(event.startTime)<w.startMin || toMin(event.endTime)>w.endMin;
}

function enforceGenerationWindowOnEvents(date=todayStr()){
  const w=getGenerationWindow(date);
  if(!w.enabled) return;
  const before=(DATA.plannerEvents||[]).length;
  DATA.plannerEvents=(DATA.plannerEvents||[]).filter(e=>{
    if(e.date!==date || e.generated!==true) return true;
    const bounded=clampGeneratedEventToWindow(e);
    return !!bounded;
  });
  if((DATA.plannerEvents||[]).length!==before) save();
}

function validateTodayPlannerWindow(date=todayStr()){
  const w=getGenerationWindow(date);
  if(!w.enabled) return {ok:true,violations:[]};
  const violations=(DATA.plannerEvents||[]).filter(e=>e.date===date && !['Break'].includes(e.subject) && generationWindowViolation(e));
  return {ok:violations.length===0,violations};
}

function ensureDailyCore(){
  if(!DATA.dailyCore) DATA.dailyCore={};
  const d=DATA.dailyCore;
  if(!Array.isArray(d.tasks)) d.tasks=[];
  if(!d.completed || typeof d.completed!=='object') d.completed={};
  if(!Number.isFinite(Number(d.points))) d.points=0;
  if(!Number.isFinite(Number(d.streak))) d.streak=0;
  if(!Number.isFinite(Number(d.bestStreak))) d.bestStreak=0;
  if(!d.badges) d.badges=[];
}
function coreKey(day,id){ return `${day}::${id}`; }
function dailyCoreDone(id,day=todayStr()){
  ensureDailyCore(); return !!DATA.dailyCore.completed[coreKey(day,id)];
}
function dailyCoreToggle(id){
  ensureDailyCore();
  const day=todayStr(), key=coreKey(day,id);
  const task=DATA.dailyCore.tasks.find(t=>t.id===id);
  if(!task) return;
  if(DATA.dailyCore.completed[key]){
    delete DATA.dailyCore.completed[key];
    DATA.dailyCore.points=Math.max(0,Number(DATA.dailyCore.points||0)-Number(task.points||1));
    toast('↩️ Daily Core unchecked.');
  }else{
    DATA.dailyCore.completed[key]=Date.now();
    DATA.dailyCore.points=Number(DATA.dailyCore.points||0)+Number(task.points||1);
    toast(`✨ +${task.points||1} point · ${task.title}`);
  }
  updateDailyCoreStreak();
  save(); render();
}
function updateDailyCoreStreak(){
  ensureDailyCore();
  const d=DATA.dailyCore;
  const enabled=d.tasks.filter(t=>t.enabled!==false);
  if(!enabled.length) return;
  const today=todayStr();
  const completeToday=enabled.every(t=>dailyCoreDone(t.id,today));
  if(completeToday && d.lastDay!==today){
    const prev=new Date(today+'T00:00:00'); prev.setDate(prev.getDate()-1);
    const prevDay=prev.toISOString().slice(0,10);
    d.streak = d.lastDay===prevDay ? Number(d.streak||0)+1 : 1;
    d.bestStreak=Math.max(Number(d.bestStreak||0),d.streak);
    d.lastDay=today;
    const s=d.streak;
    if(s===3 && !d.badges.includes('3-day')) d.badges.push('3-day');
    if(s===7 && !d.badges.includes('7-day')) d.badges.push('7-day');
    if(s===14 && !d.badges.includes('14-day')) d.badges.push('14-day');
    if(s===30 && !d.badges.includes('30-day')) d.badges.push('30-day');
  }
}

  ensureDailyCore();

function flashEsc(s){ return esc(String(s??'')); }
function flashNextDue(interval, quality){
  // Simple learner-friendly spaced repetition:
  // quality 0-2 => tomorrow; 3 => 2d; 4 => 4d; 5 => 7d, growing from prior interval.
  const q=Number(quality)||0;
  const base=Math.max(1,Number(interval)||1);
  let next=q<=2 ? 1 : q===3 ? Math.max(2,Math.round(base*1.5)) : q===4 ? Math.max(4,Math.round(base*2)) : Math.max(7,Math.round(base*2.7));
  const d=new Date(); d.setDate(d.getDate()+next);
  return {date:d.toISOString().slice(0,10),interval:next};
}

function backlogWeeklyMission(c){
  if(!c) return {goal:'Choose a Class 11 backlog chapter',detail:'Generate the workflow after a backlog chapter is available.'};
  const stage=backlogStage(c);
  if(stage.key==='foundation') return {
    goal:'Reach Question Bank stage',
    detail:'Finish the core lecture/NCERT foundation, make concise notes, then start basic questions.'
  };
  if(stage.key==='questions') return {
    goal:'Reach PYQ stage',
    detail:'Build to at least 30 chapter questions with proper error marking before moving on.'
  };
  if(stage.key==='pyq') return {
    goal:'Reach Error Review stage',
    detail:'Complete at least 10 PYQs, record mistakes, and reattempt the wrong ones.'
  };
  if(stage.key==='errors') return {
    goal:'Push accuracy to 70%+',
    detail:'Redo every recorded mistake and retest the weak concepts before counting the chapter as stable.'
  };
  return {
    goal:'Stabilise with revision + testing',
    detail:'Complete active recall, timed questions and a final revision checkpoint before leaving the chapter.'
  };
}

function generateWeeklyBacklogWorkflow(){
  const week=ensureBacklogWeek(), dates=backlogWeekDates(week.weekStart), actions=backlogWorkflowRows();
  DATA.plannerEvents=(DATA.plannerEvents||[]).filter(b=>!(b.backlogWorkflow && b.weekStart===week.weekStart && !b.done));
  let created=0,usedMinutes=0;
  actions.forEach((a,i)=>{ const date=dates[i]; if(date<todayStr()) return; const budgetLeft=week.targetHours*60-usedMinutes; if(budgetLeft<Math.min(15,a.minMinutes||15)) return; const duration=Math.min(a.minutes,Math.max(a.minMinutes||15,budgetLeft)); const slot=getFreeSlots(date).find(x=>x.end-x.start>=duration); if(!slot) return; const ch=findChapterByName(a.subject,a.chapter); DATA.plannerEvents.push({id:uid(),date,startTime:toTimeStr(slot.start),endTime:toTimeStr(slot.start+duration),subject:a.subject,chapter:a.chapter,activity:`Backlog · ${a.label}`,goals:[a.label,'Reduce Class 11 backlog'],subtasks:[makeSubtask('ncert'),makeSubtask('qns')],done:false,generated:true,locked:false,backlogWorkflow:true,weekStart:week.weekStart,backlogStage:backlogStage(ch).key}); created++; usedMinutes+=duration; });
  week.workflowGenerated=true; week.generatedAt=todayStr(); save(); render(); toast(created?`🔥 ${created}-day backlog workflow added (${Math.round(usedMinutes/60*10)/10}h).`:'No free slots were available for the backlog workflow.');
}
function rolloverIncompleteBacklog(){
  const week=ensureBacklogWeek(), pending=(DATA.plannerEvents||[]).filter(b=>b.backlogWorkflow&&b.weekStart===week.weekStart&&!b.done&&b.date<=todayStr());
  if(!pending.length) return toast('No incomplete backlog blocks to roll over.');
  const next=new Date(week.weekStart+'T00:00:00'); next.setDate(next.getDate()+7); const nextStart=next.toISOString().slice(0,10); pending.forEach(b=>{
    const oldDate=new Date(b.date+'T00:00:00'), oldStart=new Date(week.weekStart+'T00:00:00');
    const dayOffset=Math.max(0,Math.min(6,Math.round((oldDate-oldStart)/86400000)));
    const d=new Date(nextStart+'T00:00:00'); d.setDate(d.getDate()+dayOffset);
    b.date=d.toISOString().slice(0,10); b.weekStart=nextStart; b.generated=true; b.rescheduled=(b.rescheduled||0)+1;
  }); week.rolloverCount=(week.rolloverCount||0)+pending.length; save(); render(); toast(`↪ Rolled ${pending.length} unfinished backlog block${pending.length===1?'':'s'} into next week.`);
}

/* ---------- Auto Chapter Level Engine ---------- */
// Combines manual chapter accuracy, question-bank accuracy, forgetting-curve
// retention, and logged mistakes into one auto-updating mastery level —
// no manual "priority" picking required unless the student wants to pin one.
function chapterLevel(ch){
  if(ch.priorityMode === 'manual' && ch.priority){
    return { level: ch.priority, auto:false, reason:'Manually pinned' };
  }
  const bankAcc = moduleAccuracyPct(ch);
  const hasAccuracy = ch.accuracy>0 || bankAcc!=null;
  const effAccuracy = ch.accuracy>0 && bankAcc!=null ? Math.round((ch.accuracy+bankAcc)/2) : (ch.accuracy>0 ? ch.accuracy : bankAcc);
  const retention = forgettingCurve(ch);
  const completion = chapterCompletion(ch);
  if(!hasAccuracy && completion===0){
    return { level:'medium', auto:true, reason:'Not started yet' };
  }
  const accuracyForScore = hasAccuracy ? effAccuracy : (30 + completion*0.4); // partial credit for progress with no test data
  let score = accuracyForScore*0.55 + retention*0.25 + completion*0.20 - clamp((ch.mistakes||0)*3, 0, 25);
  score = clamp(Math.round(score), 0, 100);
  let level = score < 55 ? 'high' : score < 75 ? 'medium' : 'low';
  const reasonParts = [];
  if(hasAccuracy) reasonParts.push(`${effAccuracy}% accuracy`);
  reasonParts.push(`${retention}% retention`);
  if(ch.mistakes) reasonParts.push(`${ch.mistakes} mistakes logged`);
  return { level, auto:true, score, reason: reasonParts.join(' · ') };
}

function toggleTopicDone(subj, chId, topicId){
  const ch = DATA.subjects[subj].chapters.find(c=>c.id===chId);

  const t = (ch.topics||[]).find(x=>x.id===topicId);
  if(!t) return;
  t.done = !t.done;

  checkAchievements();

function addCustomTopic(subj, chId){
  const ch = DATA.subjects[subj].chapters.find(c=>c.id===chId);
  if(!ch) return;
  const input = document.getElementById('newTopic_'+chId);
  const name = (input?.value||'').trim();
  if(!name) return toast('Type a topic name first.');
  if(!Array.isArray(ch.topics)) ch.topics = [];
  // Custom topics default to whichever exam(s) this subject actually applies to.
  const jee = examAppliesToSubject('JEE',subj) ? 2 : 0;
  const neet = examAppliesToSubject('NEET',subj) ? 2 : 0;

}
function deleteTopic(subj, chId, topicId){
  const ch = DATA.subjects[subj].chapters.find(c=>c.id===chId);
  if(!ch) return;
  ch.topics = (ch.topics||[]).filter(t=>t.id!==topicId);
  save(); render();
}

function setPriorityMode(subj, chId, val){
  const ch = DATA.subjects[subj].chapters.find(c=>c.id===chId);
  if(!ch) return;
  if(val==='auto'){ ch.priorityMode='auto'; }
  else { ch.priorityMode='manual'; ch.priority = val.replace('manual-',''); }
  save(); render();
}
function setModuleField(subj, chId, moduleKey, field, value){
  const ch = DATA.subjects[subj].chapters.find(c=>c.id===chId);
  if(!ch) return;
  if(!ch.modules) ch.modules = makeModules();
  if(!ch.modules[moduleKey]) ch.modules[moduleKey] = {total:0,correct:0,wrong:0};
  ch.modules[moduleKey][field] = clamp(parseInt(value)||0, 0, 99999);
  ch.questions = moduleAttempted(ch);

  save(); render(); checkAchievements();
}

/* ===== EXAM EVE + EXAM MORNING MISTAKE REVISION ===== */
function examRevisionContext(){
  const today = todayStr();
  const tests = (DATA.upcomingTests||[])
    .filter(t => t && t.date >= today)
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const exam = tests[0];
  if(!exam) return null;
  const days = daysBetween(today, exam.date);
  if(days!==0 && days!==1) return null;
  return {exam, days, mode:days===1?'eve':'morning'};
}
function examRevisionMistakes(){
  const ctx = examRevisionContext();
  if(!ctx) return [];
  const wanted = new Set((ctx.exam.chapters||[]).map(c=>String(c.subject)+'::'+String(c.chapter)));
  return (DATA.mistakes||[])
    .filter(m => wanted.has(String(m.subject)+'::'+String(m.chapter)))
    .sort((a,b)=>{
      const ac = a.chapter===ctx.exam.chapters?.[0]?.chapter ? 0 : 1;
      const bc = b.chapter===ctx.exam.chapters?.[0]?.chapter ? 0 : 1;
      return ac-bc || String(b.date||'').localeCompare(String(a.date||''));
    });
}
function examRevisionPanelHTML(){
  const ctx = examRevisionContext();
  if(!ctx) return '';
  const mistakes = examRevisionMistakes();
  const isEve = ctx.mode==='eve';
  const title = isEve ? '🌙 Exam Eve — Mistake Questions' : '🌅 Exam Morning — Final Mistake Questions';
  const sub = isEve
    ? `Tomorrow: <b>${esc(ctx.exam.name)}</b> · ${esc(ctx.exam.source||'Test')} · ${esc(ctx.exam.examType||'Exam')}. Review your mistakes from the chapters in this exam. Do not start new topics.`
    : `Today: <b>${esc(ctx.exam.name)}</b> · ${esc(ctx.exam.source||'Test')} · ${esc(ctx.exam.examType||'Exam')}. Quick recall only — review these mistakes and then stop.`;
  const limit = isEve ? mistakes.length : Math.min(mistakes.length, 12);
  const shown = mistakes.slice(0, limit);
  return `
    <div class="exam-revision-panel">
      <div class="exam-revision-head">
        <div>
          <div class="exam-revision-title">${title}</div>
          <div class="exam-revision-sub">${sub}</div>
        </div>
        <span class="exam-revision-chip">${mistakes.length} relevant mistake${mistakes.length===1?'':'s'}</span>
      </div>
      <div class="exam-revision-actions">
        <span class="exam-revision-chip">${isEve?'📚 Full mistake review':'⚡ Quick final recall'}</span>
        <span class="exam-revision-chip">Chapters: ${(ctx.exam.chapters||[]).length}</span>
      </div>
      ${shown.length ? shown.map((m,i)=>`
        <div class="exam-revision-q">
          <div class="qmeta">Mistake ${i+1} · ${esc(m.subject)} · ${esc(m.chapter)}${m.reason?' · '+esc(m.reason):''}</div>
          <div class="qtext">Q: ${esc(m.question||'')}</div>
          ${m.correctConcept?`<div class="qconcept"><b>Correct concept:</b> ${esc(m.correctConcept)}</div>`:''}
        </div>
      `).join('') : `
        <div class="exam-revision-q">
          <div class="qtext">🎉 No mistakes are logged for the chapters covered by this exam.</div>
          <div class="qconcept">Use this time for formulas, NCERT/high-yield facts and a calm final recall.</div>
        </div>
      `}
      ${!isEve && mistakes.length>12 ? `<div class="exam-revision-sub" style="margin-top:9px;">Showing the first 12 for exam-morning speed. The complete Mistake Notebook still contains all ${mistakes.length}.</div>` : ''}
    </div>`;
}

let formulaQuiz = { queue: [], idx: 0, revealed: false, correctCount: 0 };
function openFormulaQuiz(){
  if(!DATA.formulas.length) return toast('Add a few formulas first.');
  const due = DATA.formulas.filter(f=>!f.srDue || f.srDue<=todayStr());
  const pool = due.length ? due : DATA.formulas.slice(); // nothing due — offer a general review instead
  const queue = [...pool].sort(()=>Math.random()-0.5).slice(0,20);
  formulaQuiz = { queue, idx:0, revealed:false, correctCount:0 };
  renderFormulaQuiz();
}
function formulaQuizRateLabels(){ return [
  {key:'again', label:'😵 Again', days:0},
  {key:'hard', label:'😬 Hard', days:1},
  {key:'good', label:'🙂 Good', days:3},
  {key:'easy', label:'😎 Easy', days:7},
]; }
function renderFormulaQuiz(){
  const {queue, idx, revealed} = formulaQuiz;
  if(idx >= queue.length){
    openModal(`
      <div class="modal-head"><h3>🧠 Quiz Complete</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
      <div class="text-sm">You reviewed ${queue.length} formula${queue.length===1?'':'s'} this round.</div>
      <button class="btn btn-primary w-full mt-16" onclick="closeModal()">Done</button>
    `);
    return;
  }
  const f = queue[idx];
  openModal(`
    <div class="modal-head"><h3>🧠 Quiz Mode</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="text-xs faint mb-8">${idx+1} of ${queue.length} · ${esc(f.subject)}${f.chapter?' · '+esc(f.chapter):''}</div>
    <div class="card center mb-16" style="min-height:120px; display:flex; flex-direction:column; justify-content:center; background:var(--bg-soft); border:none;">
      <div style="font-size:16px; font-weight:700; margin-bottom:8px;">${esc(f.title)}</div>
      ${revealed ? `
        <div class="mono mt-8" style="background:var(--card); padding:10px 12px; border-radius:8px; font-size:14px; display:inline-block;">${esc(f.formula)}</div>
        ${f.notes ? `<div class="text-xs faint mt-8">${esc(f.notes)}</div>` : ''}
      ` : `<div class="text-xs faint">Tap Reveal when you've recalled it</div>`}
    </div>
    ${revealed ? `
      <div class="text-xs faint mb-8" style="text-align:center;">How well did you recall it?</div>
      <div class="flex gap-8 flex-wrap" style="justify-content:center;">
        ${formulaQuizRateLabels().map(r=>`<button class="btn btn-outline btn-sm" onclick="rateFormulaQuiz('${r.key}')">${r.label}</button>`).join('')}
      </div>
    ` : `<button class="btn btn-primary w-full" onclick="revealFormulaQuiz()">Reveal</button>`}
  `);
}
function revealFormulaQuiz(){ formulaQuiz.revealed = true; renderFormulaQuiz(); }
function rateFormulaQuiz(rateKey){
  const f = formulaQuiz.queue[formulaQuiz.idx];
  const rating = formulaQuizRateLabels().find(r=>r.key===rateKey);
  const real = DATA.formulas.find(x=>x.id===f.id);
  if(real){
    real.srReps = (real.srReps||0) + 1;
    const days = rating.days;
    real.srInterval = days;
    const due = new Date(); due.setDate(due.getDate()+days);
    real.srDue = due.toISOString().slice(0,10);
    if(rateKey!=='again') formulaQuiz.correctCount++;
  }
  save();
  formulaQuiz.idx++;
  formulaQuiz.revealed = false;
  renderFormulaQuiz();
}

function doubtAgeDays(d){ return daysBetween(d.date, todayStr()); }

function viewDoubts(){

    </select>
  </div>
  <div class="grid grid-2">
    ${sorted.length ? sorted.map(d=>{
      const age = doubtAgeDays(d);
      const isOverdue = d.status==='Pending' && age>=threshold;
      return `
      <div class="card" style="${isOverdue?'border-color:var(--coral);':''}">
        <div class="flex-between mb-8">
          <span class="tag tag-info">${esc(d.subject)}</span>

            ${isOverdue ? `<span class="tag tag-high">⏰ ${age}d old</span>` : ''}

    }).join('') : `<div class="empty"><div class="big">💡</div><p>No doubts logged. Nice and clear!</p></div>`}
  </div>`;
}
let doubtDraftAudio = null; // base64 data URL of the recorded voice note, if any, cleared after save
let doubtRecorder = null, doubtRecorderChunks = [];
function openDoubtForm(){
  doubtDraftAudio = null;
  openModal(`

        <span id="doubtRecStatus" class="text-xs faint">Captures a quick memo for later — often faster than typing mid-lecture.</span>
      </div>
      <div id="doubtRecPreview" class="mt-8"></div>
    </div>

  `);

async function toggleDoubtVoiceRecording(){
  const btn = document.getElementById('doubtRecBtn');
  const status = document.getElementById('doubtRecStatus');
  if(doubtRecorder && doubtRecorder.state==='recording'){
    doubtRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('🎙️ Voice recording isn\'t available in this browser/context — type the doubt instead.');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    doubtRecorderChunks = [];
    doubtRecorder = new MediaRecorder(stream);
    doubtRecorder.ondataavailable = e => { if(e.data.size>0) doubtRecorderChunks.push(e.data); };
    doubtRecorder.onstop = () => {
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(doubtRecorderChunks, {type:'audio/webm'});
      const reader = new FileReader();
      reader.onload = () => {
        doubtDraftAudio = reader.result;
        const preview = document.getElementById('doubtRecPreview');
        if(preview) preview.innerHTML = `<audio controls src="${doubtDraftAudio}" style="width:100%; height:32px;"></audio> <button type="button" class="icon-btn" onclick="doubtDraftAudio=null; document.getElementById('doubtRecPreview').innerHTML='';">✕</button>`;
      };
      reader.readAsDataURL(blob);
      if(btn) btn.textContent = '🎙️ Re-record';
      if(status) status.textContent = 'Recorded — saved with the doubt below.';
    };
    doubtRecorder.start();
    if(btn) btn.textContent = '⏹ Stop Recording';
    if(status) status.textContent = 'Recording... tap Stop when done.';
  }catch(e){
    toast('🎙️ Microphone access was blocked or unavailable — type the doubt instead.');
  }
}
function saveDoubt(){
  const question = document.getElementById('f_question').value.trim();
  if(!question && !doubtDraftAudio) return toast('Please describe the doubt, or record a voice note.');
  DATA.doubts.push({id:uid(), subject:document.getElementById('f_subject').value, topic:document.getElementById('f_topic').value, question: question || '(voice note only)', status:'Pending', date:todayStr(), audioNote: doubtDraftAudio});
  doubtDraftAudio = null;
  save(); closeModal(); render(); toast('Doubt logged.');
}

function examRelevantChapter(ch, exam){ return !!(ch && ch.examTags && ch.examTags[exam]); }
function chapterPyqStats(subject, chapter, exam){
  const qs = DATA.pyqs.filter(p=>p.subject===subject && p.chapter===chapter && (!exam || p.examType===exam));
  const attempted = qs.length, correct = qs.filter(q=>q.correct).length;
  return {attempted, correct, accuracy:attempted?Math.round(correct/attempted*100):null, wrong:attempted-correct};
}
function chapterWeaknessScore(subject, ch, exam){
  if(!examRelevantChapter(ch, exam)) return -1;
  const ps = chapterPyqStats(subject,ch.name,exam);
  const acc = ps.accuracy!=null ? ps.accuracy : (ch.accuracy||0);
  const mistake = Math.min(100, (ch.mistakes||0)*12);
  const lowUnderstanding = 100-(ch.understanding||0);
  const completionGap = 100-chapterCompletion(ch);
  const stale = ch.lastRevised ? clamp(daysBetween(ch.lastRevised,todayStr())*2,0,30) : 15;
  return Math.round((100-acc)*0.35 + mistake*0.2 + lowUnderstanding*0.2 + completionGap*0.15 + stale*0.1);
}
function computeWeaknesses(exam='NEET'){
  const rows=[];
  EXAM_SUBJECTS[exam].forEach(subject=>{
    (DATA.subjects[subject]?.chapters||[]).forEach(ch=>{
      if(!examRelevantChapter(ch,exam)) return;
      const ps=chapterPyqStats(subject,ch.name,exam);
      const score=chapterWeaknessScore(subject,ch,exam);
      if(score>=15) rows.push({subject,chapter:ch.name,score,accuracy:(ps.accuracy!=null?ps.accuracy:(ch.accuracy||0)),pyqs:ps.attempted,mistakes:ch.mistakes||0,understanding:ch.understanding||0});
    });
  });
  return rows.sort((a,b)=>b.score-a.score);
}
function examReadiness(exam){
  const subjects=EXAM_SUBJECTS[exam];
  const chapters=[];
  subjects.forEach(s=>(DATA.subjects[s]?.chapters||[]).forEach(c=>{if(examRelevantChapter(c,exam)) chapters.push(c)}));
  const coverage=chapters.length?Math.round(chapters.reduce((a,c)=>a+chapterCompletion(c),0)/chapters.length):0;
  const tested=chapters.filter(c=>c.accuracy>0);
  const accuracy=tested.length?Math.round(tested.reduce((a,c)=>a+c.accuracy,0)/tested.length):0;
  const pyqs=DATA.pyqs.filter(p=>p.examType===exam && subjects.includes(p.subject)).length;
  const pyqScore=Math.min(100,Math.round(pyqs/300*100));
  const mocks=DATA.mocks.filter(m=>m.examType===exam || (exam==='NEET' && !m.examType)).length;
  const mockScore=Math.min(100,Math.round(mocks/5*100));
  const score=Math.round(coverage*0.35 + accuracy*0.3 + pyqScore*0.2 + mockScore*0.15);
  return {score,coverage,accuracy,pyqs,mocks};
}
function adaptivePyqQueue(exam){
  const seen=DATA.pyqs.filter(p=>p.examType===exam);
  const byKey={};
  seen.forEach(p=>{const k=p.subject+'::'+p.chapter; (byKey[k]||(byKey[k]=[])).push(p)});
  const out=[];
  EXAM_SUBJECTS[exam].forEach(subject=>(DATA.subjects[subject]?.chapters||[]).forEach(ch=>{
    if(!examRelevantChapter(ch,exam)) return;
    const qs=byKey[subject+'::'+ch.name]||[];
    const wrong=qs.filter(q=>!q.correct).length;
    const last=qs.length?qs.map(q=>q.date).sort().at(-1):null;
    const days=last?daysBetween(last,todayStr()):30;
    const weakness=chapterWeaknessScore(subject,ch,exam);
    const repeat=wrong*8 + (qs.length?Math.min(30,days):35) + weakness;
    out.push({subject,chapter:ch.name,score:repeat,reason:!qs.length?'Never practiced':wrong?`${wrong} previous wrong${wrong>1?'s':''}`:`Due again after ${days}d`});
  }));
  return out.sort((a,b)=>b.score-a.score).slice(0,12);
}

function generateTestPrepPlan(testId){
  const test=DATA.upcomingTests.find(t=>t.id===testId); if(!test) return;
  const daysLeft=daysBetween(todayStr(),test.date); if(daysLeft<1) return toast('This test is today or already passed.');
  const horizon=Math.min(7,daysLeft), created=[];
  const relevant=test.chapters.slice().sort((a,b)=>{
    const ca=DATA.subjects[a.subject]?.chapters.find(c=>c.name===a.chapter), cb=DATA.subjects[b.subject]?.chapters.find(c=>c.name===b.chapter);
    return (chapterWeaknessScore(a.subject,ca,test.examType||'NEET')||0)-(chapterWeaknessScore(b.subject,cb,'CBSE')||0);
  }).reverse();
  for(let d=0;d<horizon;d++){
    const dt=new Date(todayStr()); dt.setDate(dt.getDate()+d); const date=dt.toISOString().slice(0,10);
    const existing=(DATA.plannerEvents||[]).filter(b=>b.date===date && b.startTime&&b.endTime).map(b=>({start:b.startTime,end:b.endTime}));
    const free=getFreeSlots(date,existing);
    if(!free.length) continue;
    const picks=relevant.slice(0,Math.min(2,relevant.length));
    picks.forEach((c,i)=>{ if(!free.length) return; const slot=consumeFromSlots(free,45); if(!slot) return;
      const start=toTimeStr(slot.start),end=toTimeStr(slot.end);
      DATA.plannerEvents.push({id:uid(),date,startTime:start,endTime:end,subject:c.subject,chapter:c.chapter,activity:`Test Prep · ${test.name}`,goals:['Revise concepts','Solve exam questions'],subtasks:[makeSubtask('ncert'),makeSubtask('qns')],done:false,generated:true,testPrep:true,locked:true}); created.push(date);
    });
  }
  save(); render(); toast(created.length?`Generated ${created.length} test-prep block${created.length===1?'':'s'} for ${test.name}.`:'No free study slots were available.');
}

function mockWeakestSubjectInsight(){
  const withBreakdown = DATA.mocks.filter(m=>m.subjectBreakdown);

  const totals = {};
  subjectNames().forEach(s=>{ totals[s] = {c:0,w:0,u:0}; });
  withBreakdown.forEach(m=>{
    Object.entries(m.subjectBreakdown).forEach(([s,b])=>{
      if(!totals[s]) totals[s] = {c:0,w:0,u:0};
      totals[s].c += b.c||0; totals[s].w += b.w||0; totals[s].u += b.u||0;
    });
  });
  const rows = Object.entries(totals).map(([s,b])=>{
    const attempted = b.c+b.w;
    const acc = attempted ? Math.round(b.c/attempted*100) : null;
    const avgScore = withBreakdown.length ? Math.round((b.c*MARK_CORRECT + b.w*MARK_WRONG)/withBreakdown.length) : 0;
    return {subject:s, acc, avgScore, attempted, unattempted:b.u};
  }).filter(r=>r.attempted>0 || r.unattempted>0);
  if(!rows.length) return null;
  rows.sort((a,b)=> (a.acc==null?-1:a.acc) - (b.acc==null?-1:b.acc));
  return rows;
}

    { label:'Accuracy %', data: mocks.map(m=>m.accuracy??null), borderColor:'#6FA0C4', backgroundColor:'rgba(111,160,196,0.1)', fill:false, tension:.35, pointRadius:4, yAxisID:'yPct' },
  ];

// Standard +4/-1 marking scheme applied uniformly (matches NEET & most JEE mock series).
const MARK_CORRECT = 4, MARK_WRONG = -1;
function computeMockFromBreakdown(breakdown){
  let totalCorrect=0, totalWrong=0, totalUnattempted=0;
  Object.values(breakdown).forEach(b=>{ totalCorrect+=b.c||0; totalWrong+=b.w||0; totalUnattempted+=b.u||0; });
  const totalAttempted = totalCorrect+totalWrong;
  const totalQuestions = totalAttempted+totalUnattempted;
  const totalScore = totalCorrect*MARK_CORRECT + totalWrong*MARK_WRONG;
  const accuracy = totalAttempted ? Math.round(totalCorrect/totalAttempted*100) : 0;
  const negMarks = Math.abs(totalWrong*MARK_WRONG);
  return {totalScore, totalCorrect, totalWrong, totalUnattempted, totalAttempted, totalQuestions, accuracy, negMarks};
}
function subjectMockScore(b){ return (b.c||0)*MARK_CORRECT + (b.w||0)*MARK_WRONG; }

// Aggregates every timed subtask (banked minutes from the ▶/⏸ subtask timers) by learning step
// — Lecture / NCERT / Questions — so the student can see where actual time really goes, not just
// where the plan said it should go.
function subtaskTimeStats(){
  const byKind = {lecture:{count:0,ms:0}, ncert:{count:0,ms:0}, qns:{count:0,ms:0}};
  let totalMs = 0, totalCount = 0;
  (DATA.plannerEvents||[]).forEach(b=>{
    (b.subtasks||[]).forEach(st=>{
      const ms = st.timerAccumMs||0;
      if(ms<=0) return;
      if(byKind[st.kind]){ byKind[st.kind].count++; byKind[st.kind].ms += ms; }
      totalMs += ms; totalCount++;
    });
  });
  const rows = Object.entries(byKind).map(([kind,v])=>{
    const meta = SUBTASK_KIND_META[kind]||{icon:'☑️',label:kind};
    return {kind, icon:meta.icon, label:meta.label, count:v.count, totalMin:Math.round(v.ms/60000), avgMin: v.count? Math.round(v.ms/v.count/60000):0};
  });
  return {rows, totalMin:Math.round(totalMs/60000), totalCount};
}

// GitHub-style contribution calendar — one column per week, Mon-Sun rows, scrolls back ~6 months.
// Green shades = hours studied that day; red = a day that had passed since tracking began with zero hours logged.
function githubHeatmapHTML(weeksBack){
  weeksBack = weeksBack || 26;
  const today = new Date(); today.setHours(0,0,0,0);
  const createdAt = DATA.meta.createdAt ? new Date(DATA.meta.createdAt) : null;
  // Find the Monday on/before (today - weeksBack weeks), then walk forward to build columns.
  const dayIdx = (today.getDay()+6)%7; // 0=Mon
  const endOfWeek = new Date(today); endOfWeek.setDate(today.getDate() + (6-dayIdx)); // this week's Sunday
  const start = new Date(endOfWeek); start.setDate(endOfWeek.getDate() - (weeksBack*7-1));
  const totalDays = weeksBack*7;
  const cellsByWeek = [];
  const monthLabels = [];
  let lastMonth = null;
  for(let w=0; w<weeksBack; w++){
    const week = [];
    for(let d=0; d<7; d++){
      const dt = new Date(start); dt.setDate(start.getDate() + w*7 + d);
      const dateStr = dt.toISOString().slice(0,10);
      week.push(dateStr);
      if(d===0){
        const mn = dt.toLocaleDateString('en-IN',{month:'short'});
        if(mn !== lastMonth){ monthLabels.push({w, label:mn}); lastMonth = mn; }
      }
    }
    cellsByWeek.push(week);
  }
  const goalHours = DATA.goals?.daily?.hours || 8;
  function cellColor(dateStr){
    const dt = new Date(dateStr);
    if(dt > today) return 'transparent'; // future — render invisible placeholder
    if(createdAt && dt < createdAt) return 'var(--bg-soft)'; // before tracking started
    const h = hoursOnDate(dateStr);
    if(h<=0) return 'var(--coral)'; // missed day — red
    const ratio = h/goalHours;
    if(ratio>=0.9) return 'var(--sage)';
    if(ratio>=0.5) return '#B9D2B4';
    return '#DCE9DA';
  }
  const weeksHTML = cellsByWeek.map(week => `
    <div style="display:grid; grid-template-rows:repeat(7,12px); gap:3px;">
      ${week.map(dateStr => {
        const dt = new Date(dateStr);
        const future = dt > today;
        const h = hoursOnDate(dateStr);
        const title = future ? '' : `${fmtDate(dateStr)}: ${h}h studied`;
        return `<div title="${title}" style="width:12px; height:12px; border-radius:3px; background:${cellColor(dateStr)}; ${future?'visibility:hidden;':''}"></div>`;
      }).join('')}
    </div>`).join('');
  const monthsHTML = monthLabels.map(ml => `<span style="position:absolute; left:${ml.w*15}px; font-size:10px; color:var(--ink-faint);">${ml.label}</span>`).join('');
  return `
  <div style="overflow-x:auto; padding-bottom:6px;">
    <div style="position:relative; height:14px; margin-bottom:4px; min-width:${weeksBack*15}px;">${monthsHTML}</div>
    <div style="display:flex; gap:3px; min-width:${weeksBack*15}px;">${weeksHTML}</div>
  </div>
  <div class="text-xs faint mt-8">🟩 productive day (green shades = hours vs your ${goalHours}h daily goal) · 🟥 missed day · ⬜ before tracking started</div>`;
}

let periodMode = 'week'; // 'week' | 'month'
let periodOffset = 0;    // 0 = current, -1 = previous, etc.
function periodRange(mode, offset){
  const now = new Date();
  if(mode==='week'){
    const day = now.getDay();
    const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7) + offset*7);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const start = monday.toISOString().slice(0,10), end = sunday.toISOString().slice(0,10);
    return { start, end, label: `${fmtDate(start)} – ${fmtDate(end)}` };
  }
  const base = new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const start = new Date(base.getFullYear(), base.getMonth(), 1).toISOString().slice(0,10);
  const end = new Date(base.getFullYear(), base.getMonth()+1, 0).toISOString().slice(0,10);
  return { start, end, label: base.toLocaleDateString('en-IN',{month:'long', year:'numeric'}) };
}
function computePeriodStats(range){
  const {start,end} = range;
  const inRange = d => !!d && d>=start && d<=end;
  const totalDays = daysBetween(start,end)+1;

  const hoursEntries = DATA.studyLog.filter(l=>inRange(l.date));
  const totalHours = Math.round(hoursEntries.reduce((a,l)=>a+(parseFloat(l.hours)||0),0)*10)/10;
  const bySubject = {};
  hoursEntries.forEach(l=>{ bySubject[l.subject] = Math.round(((bySubject[l.subject]||0)+(parseFloat(l.hours)||0))*10)/10; });
  const daysStudied = new Set(hoursEntries.map(l=>l.date)).size;

  const mocks = DATA.mocks.filter(m=>inRange(m.date)).map(m=>({date:m.date, name:m.name, kind:'Mock', score:m.totalScore, max:null, pct:m.accuracy!=null?m.accuracy:null}));
  const exams = DATA.examRecords.filter(r=>inRange(r.date)).map(r=>({date:r.date, name:r.name, kind:r.source, score:r.totalObtained, max:r.totalMax, pct:examPercentage(r)}));
  const allTests = [...mocks, ...exams].sort((a,b)=>a.date.localeCompare(b.date));
  const testPcts = allTests.filter(t=>t.pct!=null).map(t=>t.pct);
  const avgTestPct = testPcts.length ? Math.round(testPcts.reduce((a,b)=>a+b,0)/testPcts.length) : null;

  const pyqs = DATA.pyqs.filter(p=>inRange(p.date));
  const pyqAcc = pyqs.length ? Math.round(pyqs.filter(p=>p.correct).length/pyqs.length*100) : null;

  const revisionsCompleted = DATA.revisions.filter(r=>inRange(r.lastDone)).length;

  const vedantuBlocks = (DATA.plannerEvents||[]).filter(b=>b.subject==='Vedantu' && inRange(b.date));
  const vedantuAttended = vedantuBlocks.filter(b=>b.done).length;

  const slipBlocks = (DATA.plannerEvents||[]).filter(b=>b.subject==='Slip Test' && inRange(b.date));
  const slipDone = slipBlocks.filter(b=>b.done).length;

  const generatedBlocks = (DATA.plannerEvents||[]).filter(b=>b.generated && inRange(b.date));
  const planAdherence = generatedBlocks.length ? Math.round(generatedBlocks.filter(b=>b.done).length/generatedBlocks.length*100) : null;

  let effSum=0, effCount=0;
  for(let d=new Date(start); d<=new Date(end) && d<=new Date(); d.setDate(d.getDate()+1)){
    const ds = d.toISOString().slice(0,10);
    if(ds>todayStr()) break;
    effSum += computeEfficiencyScore(ds).total; effCount++;
  }
  const avgEfficiency = effCount ? Math.round(effSum/effCount) : null;

  const mistakesLogged = DATA.mistakes.filter(m=>inRange(m.date)).length;

  return { start, end, totalDays, totalHours, bySubject, daysStudied, allTests, avgTestPct, testCount:allTests.length,
    pyqCount:pyqs.length, pyqAcc, revisionsCompleted, vedantuScheduled:vedantuBlocks.length, vedantuAttended,
    slipScheduled:slipBlocks.length, slipDone, planAdherence, avgEfficiency, mistakesLogged };
}
// Planned-vs-actual, block by block. "Planned" = the block's scheduled duration. "Actual" = banked
// subtask-timer minutes when available (real, precise); falls back to the block's own duration if
// it was ticked done with no timer used (best guess), or 0 if untouched.
function computePlannedVsActual(range){
  const {start,end} = range;
  const inRange = d => !!d && d>=start && d<=end;
  const skip = new Set(['Fixed','Break','Sleep']);
  const taskBlocks = (DATA.plannerEvents||[]).filter(b=>inRange(b.date) && !skip.has(b.subject));
  const bySubject = {};
  const rows = [];
  let plannedMin = 0, actualMin = 0;
  taskBlocks.forEach(b=>{
    const planned = Math.max(0, (toMin(b.endTime)||0) - (toMin(b.startTime)||0));
    let actual = 0, hasTimerData = false;
    if(Array.isArray(b.subtasks) && b.subtasks.length){
      const timedMs = b.subtasks.reduce((a,st)=>a+(st.timerAccumMs||0),0);
      if(timedMs>0){ actual = Math.round(timedMs/60000); hasTimerData = true; }
      else actual = b.done ? planned : 0;
    } else {
      actual = b.done ? planned : 0;
    }
    plannedMin += planned; actualMin += actual;
    if(!bySubject[b.subject]) bySubject[b.subject] = {planned:0, actual:0};
    bySubject[b.subject].planned += planned;
    bySubject[b.subject].actual += actual;
    rows.push({id:b.id, date:b.date, subject:b.subject, activity:b.activity||b.chapter||'', startTime:b.startTime, endTime:b.endTime, planned, actual, hasTimerData, done:!!b.done, variance: actual-planned});
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date) || (a.startTime||'').localeCompare(b.startTime||''));
  return { plannedMin, actualMin, bySubject, rows, adherencePct: plannedMin ? Math.round(actualMin/plannedMin*100) : null };
}
function plannedVsActualGapRows(pva, limit){
  return pva.rows.filter(r=>r.planned>0).slice().sort((a,b)=>Math.abs(b.variance)-Math.abs(a.variance)).slice(0, limit||15);
}

function periodDelta(cur, prev, key){
  if(prev==null || cur==null) return null;
  if(typeof cur!=='number' || typeof prev!=='number') return null;
  return Math.round((cur-prev)*10)/10;
}
function deltaTagHTML(delta, suffix=''){
  if(delta==null) return '';
  if(delta===0) return `<span class="text-xs faint">±0${suffix}</span>`;
  const up = delta>0;
  return `<span class="text-xs" style="color:${up?'#3E5A3B':'#93332A'}; font-weight:600;">${up?'▲':'▼'} ${Math.abs(delta)}${suffix}</span>`;
}
function periodSummaryText(s, prev){
  const bits = [];
  bits.push(`You studied <strong>${s.totalHours}h</strong> across <strong>${s.daysStudied}/${s.totalDays}</strong> days`);

  if(s.pyqCount) bits.push(`solved <strong>${s.pyqCount}</strong> PYQs${s.pyqAcc!=null?` at <strong>${s.pyqAcc}%</strong> accuracy`:''}`);
  if(s.revisionsCompleted) bits.push(`completed <strong>${s.revisionsCompleted}</strong> revision${s.revisionsCompleted===1?'':'s'}`);
  let text = bits.join(', ') + '.';
  if(prev && prev.totalHours!=null){

    if(hd!=null && Math.abs(hd)>=0.5) text += ` That's ${hd>0?'up':'down'} ${Math.abs(hd)}h from the previous ${periodMode}.`;
  }
  return text;
}

/* ============================================================

   ============================================================ */
function viewHealth(){
  const date = todayStr();
  const h = DATA.health[date] || {};
  const w = DATA.meta.wellness || {};
  const waterTarget = w.waterTarget || 8;
  const exerciseTarget = w.exerciseTarget || 30;
  const meditationTarget = w.meditationTarget || 10;
  const waterPct = Math.min(100, Math.round(((h.water||0)/waterTarget)*100));
  const exercisePct = Math.min(100, Math.round(((h.exercise||0)/exerciseTarget)*100));
  const meditationPct = Math.min(100, Math.round(((h.meditation||0)/meditationTarget)*100));
  const stressToday = Array.isArray(h.stressActivities) ? h.stressActivities : [];
  return `
  <div class="grid grid-2">
    <div class="card">
      <div class="card-head"><h3>Today's Check-in</h3></div>
      <div class="field"><label>Sleep (hours)</label><input type="number" step="0.5" value="${h.sleep||''}" onchange="setHealth('sleep', this.value)"></div>
      <div class="field"><label>Screen time (hours)</label><input type="number" step="0.5" value="${h.screenTime||''}" onchange="setHealth('screenTime', this.value)"></div>
      <div class="field"><label>Mood</label><select onchange="setHealth('mood', this.value)">
        <option value="">—</option>
        ${['😀 Great','🙂 Good','😐 Okay','😔 Low','😩 Stressed'].map(m=>`<option ${h.mood===m?'selected':''}>${m}</option>`).join('')}
      </select></div>
      <div class="field"><label>Energy (drives how much the planner asks of you today)</label><select onchange="setEnergy('${date}', this.value, true); render();">
        ${Object.entries(ENERGY_LEVELS).map(([key,e])=>`<option value="${key}" ${todaysEnergy(date)===key?'selected':''}>${e.icon} ${e.label}</option>`).join('')}
      </select>
      ${(!h.energyManual && suggestedEnergyFromSleep(h.sleep)) ? `<div class="text-xs faint mt-4">😴 Auto-suggested from your logged sleep (${h.sleep}h) — pick one above to lock in your own choice for today.</div>` : ''}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>🧩 Habit Tracker</h3></div>
      ${DATA.habitList.map(habit => {
        const checked = !!(DATA.habitsLog[date]||{})[habit];
        return `<div class="list-item"><input type="checkbox" ${checked?'checked':''} onchange="toggleHabit('${habit}')"><span class="txt ${checked?'done':''}">${esc(habit)}</span></div>`;
      }).join('')}
      <div class="text-xs faint mt-12">Habit-tracking days logged: ${habitStreak()}</div>
    </div>
  </div>

  <div class="grid grid-3 mt-16">
    <div class="card">
      <div class="card-head"><h3>💧 Water</h3><span class="text-xs faint mono">${h.water||0} / ${waterTarget} glasses</span></div>
      <div class="bar-track mb-12"><div class="bar-fill blue" style="width:${waterPct}%"></div></div>
      <div class="wellness-quick-btns mb-12">
        <button class="btn btn-outline btn-sm" onclick="addWater(-1)">−1</button>
        <button class="btn btn-primary btn-sm" onclick="addWater(1)">+1 glass</button>
      </div>
      <div class="checkbox-row mb-8"><input type="checkbox" id="wr_enabled" ${w.waterReminderEnabled?'checked':''} onchange="toggleWaterReminder(this.checked)"><label for="wr_enabled">🔔 Remind me to drink water</label></div>
      <div class="mb-8">${notificationStatusBadgeHTML()}</div>
      ${w.waterReminderEnabled ? `
      <div class="field-row">
        <div class="field"><label>Every</label><select onchange="setWaterInterval(this.value)">
          ${[30,45,60,90,120].map(m=>`<option value="${m}" ${((w.waterIntervalMin||60)==m)?'selected':''}>${m} min</option>`).join('')}
        </select></div>
        <div class="field"><label>Target</label><input type="number" value="${waterTarget}" onchange="setWaterTarget(this.value)"></div>
      </div>` : notificationPermissionStatus()==='denied' ? `<div class="text-xs faint">🚫 Notifications are blocked for this site — allow them from your browser's site settings to turn reminders on.</div>` : `<div class="text-xs faint">Reminders use browser notifications, so keep this tab open.</div>`}
    </div>

    <div class="card">
      <div class="card-head"><h3>🏃 Exercise</h3><span class="text-xs faint mono">${h.exercise||0} / ${exerciseTarget} min</span></div>
      <div class="bar-track mb-12"><div class="bar-fill amber" style="width:${exercisePct}%"></div></div>
      <div class="wellness-quick-btns">
        <button class="btn btn-outline btn-sm" onclick="addExerciseMinutes(10)">+10 min</button>
        <button class="btn btn-outline btn-sm" onclick="addExerciseMinutes(20)">+20 min</button>
        <button class="btn btn-outline btn-sm" onclick="addExerciseMinutes(30)">+30 min</button>
      </div>
      <div class="text-xs faint mt-12">A short walk or stretch between study blocks counts.</div>
    </div>

    <div class="card">
      <div class="card-head"><h3>🧘 Meditation</h3><span class="text-xs faint mono">${h.meditation||0} / ${meditationTarget} min</span></div>
      <div class="bar-track mb-12"><div class="bar-fill lav" style="width:${meditationPct}%"></div></div>
      <div id="meditationWidget">${meditationWidgetHTML()}</div>
    </div>
  </div>

  <div class="card mt-16">
    <div class="card-head"><h3>🌿 Stress Relief Toolkit</h3><span class="text-xs faint">${stressToday.length}/${STRESS_ACTIVITIES.length} today</span></div>
    ${STRESS_ACTIVITIES.map(a=>{
      const done = stressToday.includes(a.key);
      return `<div class="list-item"><input type="checkbox" ${done?'checked':''} onchange="toggleStressActivity('${a.key}')"><span class="txt ${done?'done':''}">${a.label}</span><span class="meta">${esc(a.desc)}</span></div>`;
    }).join('')}
  </div>

  <div class="card mt-16">
    <div class="card-head"><h3>📉 Time Waste Tracker</h3></div>
    <div class="grid grid-3">
      <div class="center"><div class="eyebrow">Studied</div><div style="font-family:var(--font-mono); font-size:20px;">${todayHours().toFixed(1)}h</div></div>
      <div class="center"><div class="eyebrow">Screen Time</div><div style="font-family:var(--font-mono); font-size:20px;">${h.screenTime||0}h</div></div>
      <div class="center"><div class="eyebrow">Productivity</div><div style="font-family:var(--font-mono); font-size:20px;">${todayHours()+  (h.screenTime||0) > 0 ? Math.round(todayHours()/(todayHours()+Number(h.screenTime||0))*100) : 0}%</div></div>
    </div>
  </div>`;
}
function setHealth(key, val){
  const date = todayStr();
  DATA.health[date] = DATA.health[date]||{};
  DATA.health[date][key] = key==='mood'?val:parseFloat(val)||0;
  if(key==='sleep') maybeAutoSuggestEnergyFromSleep(date);
  save(); render();
}
function toggleHabit(habit){
  const date = todayStr();
  DATA.habitsLog[date] = DATA.habitsLog[date]||{};
  DATA.habitsLog[date][habit] = !DATA.habitsLog[date][habit];
  if(DATA.habitsLog[date][habit]) addXP('habit');
  save(); render();
}

function buildProgressSummaryText(scope){
  scope = scope || 'daily';
  const lines = [];
  const name = DATA.meta.name || 'Student';
  lines.push(`📊 ${name}'s Study Progress — ${scope==='weekly'?'This Week':fmtDate(todayStr())}`);
  lines.push('');
  lines.push(`Overall syllabus: ${overallSyllabusPct()}% complete`);
  subjectNames().forEach(s => lines.push(`  · ${s}: ${subjectCompletion(s)}%`));
  lines.push('');
  if(scope==='weekly'){
    let total = 0;
    for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); total += hoursOnDate(d.toISOString().slice(0,10)); }
    lines.push(`Hours studied this week: ${total.toFixed(1)}h (avg ${(total/7).toFixed(1)}h/day)`);
  } else {
    lines.push(`Hours studied today: ${todayHours().toFixed(1)}h`);
  }
  lines.push(`Current streak: 🔥 ${DATA.streak.current} day${DATA.streak.current===1?'':'s'}`);
  lines.push(`Revisions due: ${getDueRevisions().length}`);
  lines.push(`Pending doubts: ${DATA.doubts.filter(d=>d.status==='Pending').length}`);
  const weak = weakChapters(55).slice(0,3);
  if(weak.length){
    lines.push('');
    lines.push('Chapters needing attention:');
    weak.forEach(w => lines.push(`  · ${w.name} (${w.subject}) — ${w.accuracy}% accuracy`));
  }
  const upcoming = (DATA.upcomingTests||[]).filter(t=>daysBetween(todayStr(),t.date)>=0 && daysBetween(todayStr(),t.date)<=7).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(upcoming.length){
    lines.push('');
    lines.push('Tests in the next 7 days:');
    upcoming.forEach(t => lines.push(`  · ${fmtDate(t.date)} — ${t.name} (${t.source})`));
  }
  const lastMock = [...DATA.mocks].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  if(lastMock){
    lines.push('');
    lines.push(`Most recent mock: ${lastMock.name} — ${lastMock.totalScore} marks, ${lastMock.accuracy}% accuracy`);
  }
  lines.push('');
  lines.push(`Days to ${Object.entries(DATA.meta.exams||{}).sort((a,b)=>new Date(a[1])-new Date(b[1]))[0]?.[0]||'exam'}: ${daysBetween(todayStr(), DATA.meta.examDate)}`);
  return lines.join('\n');
}

// ---- Backup Reminder Nudge ----
// Data lives only in this browser's storage — no account, no cloud sync — so a silent gap since
// the last export is a real risk (cleared browser data, switched device, etc.). Nudge, don't nag:
// once a week at most, and only after there's actually meaningful data worth losing.
function daysSinceLastBackup(){
  if(!DATA.meta.lastBackupAt) return null;
  return Math.floor((Date.now()-DATA.meta.lastBackupAt)/86400000);
}
function shouldShowBackupNudge(){
  const hasData = DATA.studyLog.length + DATA.mocks.length + DATA.doubts.length >= 5;
  if(!hasData) return false;
  const days = daysSinceLastBackup();
  if(days===null) return DATA.studyLog.length >= 10; // never backed up, but clearly has real data now
  return days >= 7 && DATA.meta.backupNudgeDismissedDate !== todayStr();
}
function dismissBackupNudge(){ DATA.meta.backupNudgeDismissedDate = todayStr(); save(); render(); }
function backupNudgeBannerHTML(){
  if(!shouldShowBackupNudge()) return '';
  const days = daysSinceLastBackup();
  return `
  <div class="card mb-16" style="background:var(--amber-soft); border:none;">
    <div class="flex-between flex-wrap gap-12" style="align-items:center;">

        <div class="text-xs muted mt-4">Your data lives only in this browser — export a backup so a cleared cache or new device doesn't lose it.</div>
      </div>
      <div class="flex gap-8">

        <button class="icon-btn" onclick="dismissBackupNudge()">✕</button>

}
function importData(evt){
  const file = evt.target.files[0];

  };

}

function examPercentage(rec){ return rec.totalMax ? Math.round((rec.totalObtained/rec.totalMax)*1000)/10 : 0; }
function gradeFor(pct){
  if(pct>=91) return 'A1'; if(pct>=81) return 'A2'; if(pct>=71) return 'B1'; if(pct>=61) return 'B2';
  if(pct>=51) return 'C1'; if(pct>=41) return 'C2'; if(pct>=33) return 'D'; return 'E';
}
function examStrongestWeakest(rec){
  let best=null, worst=null;
  Object.entries(rec.subjectMarks||{}).forEach(([s,m])=>{
    const pct = m.total ? (m.obtained/m.total)*100 : 0;
    if(!best || pct>best.pct) best = {subject:s, pct:Math.round(pct)};
    if(!worst || pct<worst.pct) worst = {subject:s, pct:Math.round(pct)};
  });
  return {best, worst};
}

function saveExamRecord(source){
  const subs = subjectNames();

  const date = document.getElementById('ex_date').value || todayStr();
  const type = document.getElementById('ex_type').value;
  const mode = document.getElementById('ex_scoreMode').value;
  const subjectMarks = {}; let totalObtained=0, totalMax=0;
  if(mode==='mcq'){
    subs.forEach(s=>{
      const c = parseInt(document.getElementById(`ex_${s}_c`)?.value)||0;
      const w = parseInt(document.getElementById(`ex_${s}_w`)?.value)||0;
      const u = parseInt(document.getElementById(`ex_${s}_u`)?.value)||0;
      if(c+w+u>0){
        const obt = c*MARK_CORRECT + w*MARK_WRONG;
        const tot = (c+w+u)*MARK_CORRECT;
        subjectMarks[s] = {obtained:obt, total:tot, correct:c, wrong:w, unattempted:u};
        totalObtained += obt; totalMax += tot;
      }
    });
  } else {
    subs.forEach(s=>{
      const obtEl = document.getElementById(`ex_${s}_obt`), totEl = document.getElementById(`ex_${s}_total`);
      const obt = parseFloat(obtEl && obtEl.value), tot = parseFloat(totEl && totEl.value);
      if(!isNaN(obt) && !isNaN(tot) && tot>0){ subjectMarks[s] = {obtained:obt, total:tot}; totalObtained += obt; totalMax += tot; }
    });
  }
  if(totalMax===0) return toast('Enter marks for at least one subject.');
  const chapterEntries = [];
  subs.forEach(s=>{
    (DATA.subjects[s]?.chapters||[]).forEach(ch=>{
      const cb = document.getElementById('cb_'+ch.id);
      if(cb && cb.checked){
        const score = clamp(parseFloat(document.getElementById('mk_'+ch.id).value)||0, 0, 100);
        chapterEntries.push({ subject:s, chapter:ch.name, score, difficulty:document.getElementById('df_'+ch.id).value, confidence:document.getElementById('cf_'+ch.id).value });
      }
    });
  });
  const record = {id:uid(), source, name, date, type, scoreMode:mode, subjectMarks, chapterEntries, totalObtained, totalMax};
  DATA.examRecords.push(record);
  lastExamRecordId = record.id;
  addXP('mock'); save(); closeModal(); render();
  toast(`${source} exam saved — auto-scored ${examPercentage(record)}%.`);
}

function chapterPerfStats(){
  const map = {};
  DATA.examRecords.forEach(rec=>{
    (rec.chapterEntries||[]).forEach(ce=>{
      const key = ce.subject+'::'+ce.chapter;
      if(!map[key]) map[key] = {subject:ce.subject, chapter:ce.chapter, scores:[], sources:new Set(), exams:[]};
      map[key].scores.push(ce.score);
      map[key].sources.add(rec.source);
      map[key].exams.push({name:rec.name, source:rec.source, date:rec.date, score:ce.score});
    });
  });
  return Object.values(map).map(v=>{
    const chObj = allChapters().find(c=>c.subject===v.subject && c.name===v.chapter);
    return {
      subject:v.subject, chapter:v.chapter,
      exams:v.scores.length,
      avg: Math.round(v.scores.reduce((a,b)=>a+b,0)/v.scores.length),
      low: Math.min(...v.scores), high: Math.max(...v.scores),
      sources:[...v.sources],
      mistakeCount: chObj ? (chObj.mistakes||0) : 0,
      timeline: v.exams.sort((a,b)=> new Date(a.date)-new Date(b.date))
    };
  }).sort((a,b)=> a.avg-b.avg);
}

function improvementTrackerHTML(stats){
  const withHistory = stats.filter(s=>s.timeline.length>=2).slice(0,3);
  if(!withHistory.length) return `<div class="empty"><p>Log the same chapter across multiple exams to see improvement trends.</p></div>`;
  return withHistory.map(s=>{
    const first = s.timeline[0].score, last = s.timeline[s.timeline.length-1].score;
    const delta = last-first;
    return `
    <div class="mb-16">
      <div style="font-weight:600; font-size:13.5px; margin-bottom:8px;">${esc(s.chapter)} <span class="faint text-xs">(${s.subject})</span></div>
      <div class="flex flex-wrap gap-8" style="align-items:center;">
        ${s.timeline.map((t,i)=>`
          <span class="tag ${t.score<50?'tag-high':t.score<75?'tag-med':'tag-low'}">${esc(t.name)}: ${t.score}%</span>
          ${i<s.timeline.length-1?'<span class="faint">→</span>':''}
        `).join('')}
        <span class="tag ${delta>=0?'tag-low':'tag-high'}" style="margin-left:6px;">Improvement ${delta>=0?'+':''}${delta}%</span>
      </div>
    </div>`;
  }).join('');
}

const SYNC_CYCLE = ['none','progress','done'];
const SYNC_ICON = {none:'⬜', progress:'🟡', done:'✅'};
function cycleSync(chId, field){
  const ch = allChapters().find(c=>c.id===chId);
  const real = DATA.subjects[ch.subject].chapters.find(c=>c.id===chId);
  const cur = real.sync[field] || 'none';
  const idx = SYNC_CYCLE.indexOf(cur);
  real.sync[field] = SYNC_CYCLE[(idx+1)%SYNC_CYCLE.length];
  save(); render();
}
function setUnderstanding(chId, val){
  const ch = allChapters().find(c=>c.id===chId);
  const real = DATA.subjects[ch.subject].chapters.find(c=>c.id===chId);
  real.understanding = val;
  save(); render();
}
function chapterMastery(ch){
  const fields = ['school','aakash','vedantu','selfStudy','revisionSync'];
  const vals = fields.map(f=> ch.sync[f]==='done'?100 : ch.sync[f]==='progress'?50 : 0);
  const syncAvg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const understandingPct = (ch.understanding||0)/5*100;
  const perf = chapterPerfStats().find(s=>s.chapter===ch.name && s.subject===ch.subject);
  const parts = [syncAvg, understandingPct]; if(perf) parts.push(perf.avg);
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function attendanceToggle(source, key){
  DATA.attendance[source][key] = !DATA.attendance[source][key]; save(); render();
}
function setAttendanceField(source, key, val){
  DATA.attendance[source][key] = val; save(); render();

function setTeacherRating(val){ DATA.attendance.school.teacherRating = val; save(); render(); }
function gapDetectorList(){
  const gaps = [];
  allChapters().forEach(ch=>{
    const s = ch.sync;
    if(s.school==='done' && s.vedantu==='none') gaps.push(`⚠️ School has covered <b>${esc(ch.name)}</b>, but you haven't started the Vedantu lecture.`);
    if(s.aakash==='done' && s.selfStudy==='none') gaps.push(`⚠️ Aakash has finished <b>${esc(ch.name)}</b>, but your self-study is still pending.`);
    if((s.school==='done' || s.aakash==='done') && s.revisionSync==='none') gaps.push(`⚠️ <b>${esc(ch.name)}</b> is taught but not yet revised.`);
    if(s.vedantu==='done' && s.school==='none' && s.aakash==='none') gaps.push(`⚠️ Vedantu is ahead on <b>${esc(ch.name)}</b> — school/coaching haven't reached it yet.`);
  });
  return gaps.slice(0,8);
}

   One DATA.subjects database feeds tracker + planner + backlog +

function syllabusAuditRows(){
  const rows=[], seen=new Map();
  Object.keys(DATA.subjects||{}).forEach(subj=>{
    const allowed=new Set(allowedExamsForSubject(subj));
    const chapters=DATA.subjects[subj]?.chapters||[];
    const local=new Set();
    chapters.forEach(ch=>{
      const key=subj+'::'+String(ch.name||'').trim().toLowerCase();
      const issues=[];
      if(!String(ch.name||'').trim()) issues.push('Missing lesson name');
      if(local.has(key)) issues.push('Duplicate lesson');
      local.add(key);
      const level=chapterClassLevel(subj,ch);
      if(level!==11 && level!==12) issues.push('Invalid class level');
      if(!Array.isArray(ch.topics) || !ch.topics.length) issues.push('No topics');
      const tags=ch.examTags||{};
      Object.keys(tags).forEach(ex=>{
        if(tags[ex] && !allowed.has(ex)) issues.push('Invalid '+ex+' mapping');
      });
      if(!ch.examTags) issues.push('No exam mapping');
      if(!seen.has(key)) seen.set(key,[]); seen.get(key).push(subj);
      rows.push({subj,name:ch.name,level,issues,custom:!DEFAULT_CHAPTERS[subj]?.includes(ch.name)});
    });
  });
  return rows;
}

  const custom=rows.filter(r=>r.custom);
  const byClass=[11,12].map(level=>rows.filter(r=>r.level===level).length);

function isSchoolWeeklyTest(t){
  return t && (t.schoolWeekly===true || (t.source==='School' && (t.testType||'').toLowerCase().includes('weekly')));

function schoolWeeklyTestReadiness(t){
  const chapters=t?.chapters||[];
  if(!chapters.length)return 0;
  const vals=chapters.map(x=>chapterReadiness(x.subject,x.chapter).score||0);
  return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
}
function schoolWeeklyPrepPlan(t){
  const d=daysBetween(todayStr(),t.date);
  const r=schoolWeeklyTestReadiness(t);
  if(d<0)return {phase:'completed',label:'Test completed',detail:'Analyse the paper and feed mistakes back into the planner.'};
  if(d===0)return {phase:'test',label:'Test day',detail:'Only final recall and confidence checks — do not start a large new topic.'};
  if(d<=1)return {phase:'final',label:'Final revision',detail:'NCERT/notes → active recall → timed questions → mistakes.'};
  if(d<=3)return {phase:'practice',label:'Practice phase',detail:'Question bank + timed practice + reattempt weak questions.'};
  if(d<=7)return {phase:'learn',label:'Complete portion first',detail:'Finish learning the complete school-test portion, then practise.'};
  return {phase:'early',label:'Early preparation',detail:'Build the concept steadily; keep the portion comfortably ahead of the final week.'};
}

function testOverlapScore(test){
  const sources = ['School','Aakash','Vedantu'];
  const scores = {};
  sources.forEach(src=>{
    const otherTests = DATA.upcomingTests.filter(t=>t.source===src && t.id!==test.id);
    if(!otherTests.length){ scores[src] = null; return; }
    const otherChapterKeys = new Set();
    otherTests.forEach(t=> t.chapters.forEach(c=> otherChapterKeys.add(c.subject+'::'+c.chapter)));
    const matched = test.chapters.filter(c=> otherChapterKeys.has(c.subject+'::'+c.chapter)).length;
    scores[src] = Math.round((matched/test.chapters.length)*100);
  });
  return scores;
}
function testAlignmentAnalysis(){
  const tests = DATA.upcomingTests;
  if(tests.length<2) return null;
  const bySource = {};
  tests.forEach(t=>{ t.chapters.forEach(c=>{
    const key = c.subject+'::'+c.chapter;
    if(!bySource[key]) bySource[key] = {subject:c.subject, chapter:c.chapter, sources:new Set(), priorityType:false};
    bySource[key].sources.add(t.source);
    if(isPriorityTestType(t.testType)) bySource[key].priorityType = true;
  }); });
  const all = Object.values(bySource);
  const common = all.filter(c=>c.sources.size>=3);
  const priority = all.slice().sort((a,b)=> (b.sources.size-a.sources.size) || ((b.priorityType?1:0)-(a.priorityType?1:0)));
  return {all, common, priority};
}
function todaysStudyRecommendation(){

  weak.forEach(w=> items.push(`${w.chapter} (weak — ${w.avg}% avg)`));
  const align = testAlignmentAnalysis();
  if(align){ align.priority.slice(0,2).forEach(p=>{ if(!items.some(i=>i.startsWith(p.chapter))) items.push(`${p.chapter} (common to ${[...p.sources].join(' + ')})${p.priorityType?' — 📌 periodic/month-end priority':''}`); }); }
  const due = getDueRevisions().slice(0,2);
  due.forEach(d=> items.push(`Revise ${d.chapter||d.name||'due topic'}`));
  if(!items.length) items.push('Add an exam or upcoming test to unlock personalised recommendations.');
  return items.slice(0,5);
}

let gDriveState = { tokenClient: null, accessToken: null, lastSync: null };
function loadGISScript(cb){
  if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = cb;
  s.onerror = () => toast('⚠️ Could not load Google sign-in — check your internet connection.');
  document.head.appendChild(s);
}
function connectGoogleDrive(){
  const clientId = document.getElementById('gd_clientid').value.trim();
  if(!clientId) return toast('Paste your Google OAuth Client ID first.');
  DATA.meta.gdriveClientId = clientId; save();
  loadGISScript(() => {
    try{
      gDriveState.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => {
          if(resp.error){ toast('Google sign-in failed: '+resp.error); return; }
          gDriveState.accessToken = resp.access_token;
          toast('✅ Connected to Google Drive.');
          render();
        }
      });
      gDriveState.tokenClient.requestAccessToken();
    }catch(e){ toast('⚠️ Could not start Google sign-in. Check your Client ID and authorized origin.'); }
  });
}
async function findDriveBackupFile(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='pragati-backup.json' and trashed=false&spaces=drive&fields=files(id,name)`, {
    headers: { 'Authorization': 'Bearer '+gDriveState.accessToken }
  });
  if(!res.ok) return null;
  const data = await res.json();
  return data.files && data.files.length ? data.files[0].id : null;
}
async function backupToDrive(){
  if(!gDriveState.accessToken) return toast('Connect Google Drive first.');
  try{
    const content = JSON.stringify(DATA, null, 2);
    const existingId = await findDriveBackupFile();
    const metadata = { name: 'pragati-backup.json', mimeType: 'application/json' };
    const boundary = 'pragati_boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
    const url = existingId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: existingId ? 'PATCH' : 'POST',
      headers: { 'Authorization': 'Bearer '+gDriveState.accessToken, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if(res.ok){ gDriveState.lastSync = new Date().toLocaleString('en-IN'); toast('✅ Backed up to Google Drive.'); render(); }
    else toast('⚠️ Backup failed — try reconnecting.');
  }catch(e){ toast('⚠️ Backup failed: '+e.message); }
}
async function restoreFromDrive(){
  if(!gDriveState.accessToken) return toast('Connect Google Drive first.');
  try{
    const id = await findDriveBackupFile();
    if(!id) return toast('No backup file found in your Drive yet — click Backup Now first.');

    const json = await res.json();

  }catch(e){ toast('⚠️ Restore failed: '+e.message); }

/* ============================================================
   PWA — INSTALLABLE / OFFLINE SUPPORT
   ============================================================ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if(currentRoute()==='settings') render();
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; toast('✅ Pragati installed.'); });
function pwaInstallAvailable(){ return !!deferredInstallPrompt; }
async function promptPwaInstall(){
  if(!deferredInstallPrompt) return toast('Install isn\'t available in this browser right now — use your browser\'s "Add to Home Screen" option from its menu instead.');
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  render();
}
function setupPWA(){
  try{
    // Manifest is built at runtime (as a Blob) so this stays a single self-contained file —
    // no separate manifest.json or icon files to host.
    const manifest = {
      name: 'Pragati — NEET / JEE Study Command Center',
      short_name: 'Pragati',
      start_url: location.pathname + location.search,
      scope: location.pathname,
      display: 'standalone',
      background_color: '#FAF8F4',
      theme_color: '#7E9C7A',
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237E9C7A'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E",
        sizes: '100x100', type: 'image/svg+xml', purpose: 'any'
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.getElementById('pwaManifestLink');
    if(link) link.href = URL.createObjectURL(manifestBlob);
  }catch(e){ /* manifest is a nice-to-have — never block boot on it */ }

  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    // Minimal cache-first service worker so a reload works offline once the page has loaded once.
    // Registered from a Blob URL so no separate file needs to be hosted alongside this one.
    const swSource = `
      const CACHE = 'pragati-shell-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { self.clients.claim(); });
      self.addEventListener('fetch', e => {
        if(e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(cached => {
            const fetchPromise = fetch(e.request).then(res => {
              if(res && res.status===200){ caches.open(CACHE).then(c => c.put(e.request, res.clone())); }
              return res;
            }).catch(() => cached);
            return cached || fetchPromise;
          })
        );
      });
    `;
    try{
      const swUrl = URL.createObjectURL(new Blob([swSource], {type:'text/javascript'}));
      navigator.serviceWorker.register(swUrl).catch(()=>{ /* offline caching is best-effort */ });
    }catch(e){ /* ignore */ }
  }
}

boot();
setupPWA();

<script id="pragati-feedback-engine-js">
(function(){
"use strict";
const F=window.PRAGATI_V3||(window.PRAGATI_V3={});
F.feedback=F.feedback||{};
F.feedback.lastUpdated=F.feedback.lastUpdated||null;
const fsave=()=>localStorage.setItem("pragati_v3_data",JSON.stringify(F));
const fesc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ftoast=m=>window.prToast?window.prToast(m):null;

/* Infer topic-level pressure from the data already recorded in Pragati.
   No score is invented when there is no evidence. */
function topicFeedbackIndex(){
 const result=[];
 const subjects=F.subjects||{};
 const mistakes=Array.isArray(F.mistakes)?F.mistakes:[];
 const pyqs=Array.isArray(F.pyqs)?F.pyqs:[];
 const tests=Array.isArray(F.tests)?F.tests:[];
 Object.keys(subjects).forEach(subject=>{
   const s=subjects[subject]||{};
   (s.chapters||[]).forEach(ch=>{
     (ch.topics||[]).forEach(t=>{
       const name=(t.name||"").trim(); if(!name)return;
       ensureTopicStudyState?.(t);
       const states=t.studyState||{};
       const mistakeCount=mistakes.filter(m=>
         (m.subject||"")===subject && (m.chapter||"")===ch.name &&
         ((m.topic||"").toLowerCase()==name.toLowerCase() || !m.topic)
       ).length;
       const pyqFor=pyqs.filter(q=>
         (q.subject||"")===subject && (q.chapter||"")===ch.name &&
         ((q.topic||"").toLowerCase()==name.toLowerCase() || !q.topic)
       );
       const wrongPyq=pyqFor.filter(q=>q.correct===false || q.result==="wrong" || q.status==="wrong").length;
       const relevantTests=tests.filter(test=>
         Array.isArray(test.topics)&&test.topics.some(x=>
           (x.subject||subject)===subject && (x.chapter||ch.name)===ch.name &&
           (x.topic||"").toLowerCase()===name.toLowerCase()
         )
       );
       const stateValues=STUDY_EXAMS.map(e=>states[e]).filter(Boolean);
       const worst=stateValues.includes("error")?"error":
         stateValues.includes("practicing")?"practicing":
         stateValues.includes("understanding")?"understanding":
         stateValues.includes("learning")?"learning":
         stateValues.includes("examready")?"examready":
         stateValues.includes("mastered")?"mastered":"notstarted";
       let pressure=mistakeCount*2+wrongPyq*1.5+(worst==="error"?4:worst==="practicing"?2:worst==="learning"?1:0);
       let action="Keep the current state and continue normal revision.";
       if(mistakeCount>=3 || wrongPyq>=4 || worst==="error"){
         action="Error review + reattempt; keep this topic active in the next plan.";
       }else if(worst==="practicing"){
         action="Timed question practice / PYQs, then review errors.";
       }else if(worst==="understanding"){
         action="Active recall + a small question set.";
       }else if(worst==="learning"||worst==="notstarted"){
         action="Concept learning + NCERT/notes.";
       }else if(worst==="examready"){
         action="Timed mixed practice to confirm exam readiness.";
       }else if(worst==="mastered"){
         action="Spaced revision only; avoid over-scheduling.";
       }
       result.push({subject,chapter:ch.name,topic:name,states:stateValues,mistakes:mistakeCount,wrongPyq,tests:relevantTests.length,pressure,action});
     });
   });
 });
 return result.sort((a,b)=>b.pressure-a.pressure);
}

function renderFeedbackEngine(){
 const root=document.getElementById("prFeedbackRoot");if(!root)return;
 const all=topicFeedbackIndex();
 const active=all.filter(x=>x.pressure>0);
 const error=all.filter(x=>x.mistakes>=3||x.wrongPyq>=4||x.states.includes("error")).length;
 const practice=all.filter(x=>x.states.includes("practicing")).length;
 const ready=all.filter(x=>x.states.includes("examready")||x.states.includes("mastered")).length;
 root.querySelector("#prFbError").textContent=error;
 root.querySelector("#prFbPractice").textContent=practice;
 root.querySelector("#prFbReady").textContent=ready;
 root.querySelector("#prFbList").innerHTML=active.length?active.slice(0,8).map(x=>`
  <div class="pr-feedback-item">
   <div class="pr-feedback-item-head">
    <div><b>${fesc(x.topic)}</b><div style="font-size:10px;color:#777">${fesc(x.subject)} · ${fesc(x.chapter)}</div></div>
    <span class="pr-feedback-state">${x.states.length?fesc(x.states.join(" / ")):"Not Started"}</span>
   </div>
   <div class="pr-feedback-action">
    ${x.mistakes?`Mistakes: <strong>${x.mistakes}</strong> · `:""}${x.wrongPyq?`Wrong PYQs: <strong>${x.wrongPyq}</strong> · `:""}
    ${fesc(x.action)}
   </div>
  </div>`).join(""):"<div style='font-size:12px;color:#777'>No evidence requiring intervention yet. Complete some topic tracking, PYQs, mistakes or tests and Pragati will adapt.</div>";
 F.feedback.lastUpdated=new Date().toISOString();fsave();
}

/* Called by the planner before a Smart Plan is generated.
   It adds evidence-driven priorities to the existing planner priority engine. */
window.pragatiFeedbackBoost=function(items){
 const idx=topicFeedbackIndex();
 if(!Array.isArray(items))return items;
 const map=new Map(idx.map(x=>[x.subject+"::"+x.chapter+"::"+x.topic,x.pressure]));
 return items.map(p=>{
   const key=p.subject+"::"+p.chapter+"::"+(p.topic||"");
   const boost=map.get(key)||0;
   return Object.assign({},p,{feedbackBoost:boost,_originalPriority:p.priority||0,priority:(p.priority||0)+boost});
 }).sort((a,b)=>(b.priority||0)-(a.priority||0));
};

/* Recompute the feedback layer whenever the app redraws or data changes. */
const oldRender=window.render;
if(typeof oldRender==="function" && !window.__pragatiFeedbackRenderWrapped){
 window.render=function(){
   const r=oldRender.apply(this,arguments);
   setTimeout(renderFeedbackEngine,0);
   return r;
 };
 window.__pragatiFeedbackRenderWrapped=true;
}
document.addEventListener("DOMContentLoaded",()=>{
 const host=document.getElementById("pragatiV3Panel");if(!host)return;
 const sec=document.createElement("section");sec.className="pr-feedback";sec.id="prFeedbackRoot";
 sec.innerHTML=`
  <h2>🔄 Feedback Engine</h2>
  <div class="pr-feedback-sub">Mistakes, PYQs and Study States now influence what Pragati recommends next.</div>
  <div class="pr-feedback-grid">
   <div class="pr-feedback-card"><b id="prFbError">0</b><span>Topics needing error review</span></div>
   <div class="pr-feedback-card"><b id="prFbPractice">0</b><span>Topics in practice stage</span></div>
   <div class="pr-feedback-card"><b id="prFbReady">0</b><span>Exam-ready / mastered topics</span></div>
  </div>
  <div id="prFbList" class="pr-feedback-list"></div>`;
 host.appendChild(sec);renderFeedbackEngine();
});
})();
</script>

<script id="tomorrow-exam-fix">
(function(){
  function localDateOnly(v){
    if(!v) return '';
    const s=String(v).slice(0,10);
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
  }
  function tomorrowLocal(){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  window.pragatiTomorrowExams=function(){
    const target=tomorrowLocal();
    return (DATA.upcomingTests||[]).filter(t=>localDateOnly(t.date)===target);
  };
  window.pragatiExamTodayContext=function(){
    const today=localDateOnly(todayStr());
    const tomorrow=tomorrowLocal();
    const exams=pragatiTomorrowExams();
    const todayExams=(DATA.upcomingTests||[]).filter(t=>localDateOnly(t.date)===today);
    return {tomorrow, today, exams, todayExams};
  };
})();
</script>
