<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg: #FAF8F4;
  --bg-soft: #F3EEE4;
  --card: #FFFFFF;
  --card-border: #EAE4D8;
  --ink: #362F2A;
  --ink-soft: #766F65;
  --ink-faint: #A69F93;

  --sage: #7E9C7A;
  --sage-soft: #E4EBE1;
  --lavender: #9A8FC2;
  --lavender-soft: #EBE7F5;
  --sky: #6FA0C4;
  --sky-soft: #E4EEF5;
  --amber: #D9A441;
  --amber-soft: #F7ECD8;
  --coral: #C97064;
  --coral-soft: #F6E5E1;

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --shadow: 0 2px 10px rgba(54,47,42,0.05), 0 1px 2px rgba(54,47,42,0.04);
  --shadow-hover: 0 8px 24px rgba(54,47,42,0.09);

  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}
html[data-theme="dark"]{
  --bg: #22201C;
  --bg-soft: #2B2823;
  --card: #29261F;
  --card-border: #3A362E;
  --ink: #EDE8DD;
  --ink-soft: #B3AB9C;
  --ink-faint: #7C7568;

  --sage: #8FB088;
  --sage-soft: #2E3A2B;
  --lavender: #AC9FDA;
  --lavender-soft: #322C48;
  --sky: #7FB1D6;
  --sky-soft: #24333D;
  --amber: #E3B45B;
  --amber-soft: #3D3220;
  --coral: #DE897C;
  --coral-soft: #3D2724;

  --shadow: 0 2px 10px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.2);
  --shadow-hover: 0 8px 24px rgba(0,0,0,0.35);
}
html[data-theme="dark"] .hero-mission{ background: linear-gradient(135deg, #26301F 0%, #1D2528 100%); }
html[data-theme="dark"] .btn-primary{ background: var(--sage); color:#1A2318; }
html[data-theme="dark"] .btn-primary:hover{ background:#A0C398; }
html{ transition: background .2s; }
body{ transition: background .2s, color .2s; }

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background: var(--lavender-soft); }
::-webkit-scrollbar{ width:10px; height:10px;}
::-webkit-scrollbar-thumb{ background: var(--card-border); border-radius:10px;}
::-webkit-scrollbar-track{ background: transparent; }

a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input, textarea, select{font-family:inherit; font-size:14px;}

h1,h2,h3,h4{ font-family: var(--font-display); font-weight:600; letter-spacing:-0.01em; color:var(--ink); }

.mono{ font-family: var(--font-mono); }

/* ============ APP SHELL ============ */
#app{ display:flex; min-height:100vh; }

/* ---------- Sidebar ---------- */
#sidebar{
  width: 248px;
  flex-shrink:0;
  background: var(--card);
  border-right:1px solid var(--card-border);
  display:flex; flex-direction:column;
  position:fixed; top:0; left:0; bottom:0;
  z-index:50;
  transition: transform .25s ease;
}
#sidebar .brand{
  padding: 22px 20px 16px 22px;
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid var(--card-border);
}
#sidebar .brand .mark{
  width:34px; height:34px; border-radius:10px;
  background: linear-gradient(135deg, var(--sage), var(--sky));
  display:flex; align-items:center; justify-content:center;
  color:white; font-family:var(--font-display); font-weight:700; font-size:17px;
  flex-shrink:0;
}
#sidebar .brand .title{ font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.1;}
#sidebar .brand .sub{ font-size:10.5px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase; margin-top:2px;}

#navScroll{ flex:1; overflow-y:auto; padding: 10px 12px 16px; }
.nav-group{ margin-top:14px; }
.nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); padding: 0 10px 6px; font-weight:600;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding: 9px 10px; border-radius: var(--radius-sm);
  font-size:13.5px; font-weight:500; color: var(--ink-soft);
  margin-bottom:2px;
  transition: background .15s, color .15s;
  white-space:nowrap;
}
.nav-item .ic{ width:18px; text-align:center; flex-shrink:0; font-size:15px;}
.nav-item:hover{ background: var(--bg-soft); color:var(--ink); }
.nav-item.active{ background: var(--sage-soft); color:#3E5A3B; font-weight:600; }
.nav-item .badge{
  margin-left:auto; background:var(--coral); color:white; font-size:10px; font-weight:700;
  border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;
}

#sidebarFooter{ padding:14px; border-top:1px solid var(--card-border); }
.streak-pill{
  display:flex; align-items:center; gap:8px; background: var(--amber-soft);
  border-radius: var(--radius-sm); padding:8px 10px; font-size:12.5px; font-weight:600; color:#8A5F1D;
}

/* ---------- Main ---------- */
#main{ margin-left:248px; flex:1; min-width:0; padding: 26px 34px 60px; max-width:1240px; }
#pragatiV3Panel:empty{ display:none; }
#pragatiV3Panel{ margin-left:248px; padding: 0 34px 40px; max-width:1240px; }
#pragatiV3Panel .pr-feedback{ margin-top:0; }
#topbar{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:22px; gap:20px; flex-wrap:wrap;}
#topbar .greet h1{ font-size:26px; }
#topbar .greet .date{ font-size:13px; color:var(--ink-soft); margin-top:3px;}
#topbar .stats{ display:flex; gap:10px; flex-wrap:wrap; }
.pill-stat{
  background:var(--card); border:1px solid var(--card-border); border-radius: var(--radius-sm);
  padding:8px 14px; text-align:center; box-shadow: var(--shadow); min-width:88px;
}
.pill-stat .n{ font-family:var(--font-mono); font-size:16px; font-weight:600; }
.pill-stat .l{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:1px;}

.menu-toggle{ display:none; }

/* ---------- Cards / grid ---------- */
.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-4{ grid-template-columns: repeat(4, 1fr); }
@media (max-width:1050px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width:640px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }

.card{
  background: var(--card); border:1px solid var(--card-border); border-radius: var(--radius-md);
  padding:18px 20px; box-shadow: var(--shadow);
}
.card.pad-lg{ padding:24px 26px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px;}
.card-head h3{ font-size:15.5px; }
.card-head .eyebrow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:700; margin-bottom:3px;}
.card-sub{ font-size:12px; color:var(--ink-soft); }

.section-title{ font-size:22px; margin-bottom:4px; }
.section-desc{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:6px; border-radius: var(--radius-sm);
  padding:8px 14px; font-size:13px; font-weight:600; border:1px solid transparent;
  transition: transform .1s, box-shadow .15s, background .15s;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: var(--ink); color:white; }
.btn-primary:hover{ background:#4a413a; }
.btn-soft{ background: var(--sage-soft); color:#3E5A3B; }
.btn-soft:hover{ background:#d8e5d4; }
.btn-outline{ border-color: var(--card-border); color:var(--ink-soft); background:transparent; }
.btn-outline:hover{ border-color: var(--ink-faint); color:var(--ink); }
.btn-danger{ background: var(--coral-soft); color:#93332A; }
.btn-sm{ padding:5px 10px; font-size:12px; border-radius:8px; }
.icon-btn{ width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; color:var(--ink-faint); background:transparent; border:1px solid transparent;}
.icon-btn:hover{ background:var(--bg-soft); color:var(--ink); }

/* ---------- Forms ---------- */
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--card-border); border-radius: var(--radius-sm);
  padding:9px 11px; font-size:13.5px; background:var(--bg); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--sky); outline-offset:0; border-color:transparent; }
.field textarea{ resize:vertical; min-height:70px; }
.field-row{ display:flex; gap:10px; }
.field-row > .field{ flex:1; }
.checkbox-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
.checkbox-row input{ width:16px; height:16px; accent-color: var(--sage); }

/* ---------- Progress bars ---------- */
.bar-track{ height:8px; background: var(--bg-soft); border-radius:20px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:20px; background: linear-gradient(90deg, var(--sage), #A6C4A2); transition: width .4s ease; }
.bar-fill.blue{ background: linear-gradient(90deg, var(--sky), #9FC3DD); }
.bar-fill.amber{ background: linear-gradient(90deg, var(--amber), #E8C173); }
.bar-fill.coral{ background: linear-gradient(90deg, var(--coral), #DA9A91); }
.bar-fill.lav{ background: linear-gradient(90deg, var(--lavender), #C0B6E0); }
.bar-row{ display:flex; align-items:center; gap:10px; margin:9px 0; }
.bar-row .lbl{ width:120px; font-size:12.5px; color:var(--ink-soft); flex-shrink:0; }
.bar-row .val{ width:38px; text-align:right; font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); flex-shrink:0;}

/* ---------- Tags / badges ---------- */
.tag{ display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; }
.tag-high{ background: var(--coral-soft); color:#93332A; }
.tag-med{ background: var(--amber-soft); color:#8A5F1D; }
.tag-low{ background: var(--sage-soft); color:#3E5A3B; }
.tag-info{ background: var(--sky-soft); color:#2A5673; }
.tag-lav{ background: var(--lavender-soft); color:#544A82; }
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.dot-green{ background:var(--sage); } .dot-yellow{ background:var(--amber); } .dot-red{ background:var(--coral); }

/* ---------- Empty state ---------- */
.empty{ text-align:center; padding:34px 20px; color:var(--ink-faint); }
.empty .big{ font-size:28px; margin-bottom:8px; }
.empty p{ font-size:13px; }

/* ---------- Table ---------- */
table{ width:100%; border-collapse:collapse; font-size:13px; }
th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:8px 10px; border-bottom:1px solid var(--card-border); font-weight:700;}
td{ padding:10px 10px; border-bottom:1px solid var(--card-border); vertical-align:middle;}
tr:last-child td{ border-bottom:none; }
tr:hover td{ background: var(--bg-soft); }

/* ---------- Todo / list items ---------- */
.list-item{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--card-border); }
.list-item:last-child{ border-bottom:none; }
.list-item input[type=checkbox]{ width:17px; height:17px; accent-color:var(--sage); flex-shrink:0; }
.list-item .txt{ flex:1; font-size:13.5px; }
.list-item .txt.done{ text-decoration:line-through; color:var(--ink-faint); }
.list-item .meta{ font-size:11px; color:var(--ink-faint); }

/* ---------- Chapter row ---------- */
.chapter-card{ border:1px solid var(--card-border); border-radius: var(--radius-md); padding:16px 18px; margin-bottom:12px; background:var(--card); }
.chapter-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
.chapter-card h4{ font-size:15px; font-weight:600; font-family:var(--font-body); }
.check-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:6px 14px; margin:10px 0; }
.check-grid label{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
.check-grid input{ width:14px; height:14px; accent-color:var(--sage);}
.mini-stats{ display:flex; gap:16px; font-size:11.5px; color:var(--ink-soft); margin-top:8px; flex-wrap:wrap;}
.mini-stats b{ color:var(--ink); font-family:var(--font-mono); }

/* ---------- Modal ---------- */
.overlay{ position:fixed; inset:0; background:rgba(54,47,42,0.35); backdrop-filter: blur(2px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{ background:var(--card); border-radius: var(--radius-lg); padding:26px 28px; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; box-shadow: var(--shadow-hover); }
.modal.wide{ max-width:640px; }
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-head h3{ font-size:17px; }

/* ---------- Toast ---------- */
#toastHost{ position:fixed; bottom:22px; right:22px; z-index:400; display:flex; flex-direction:column; gap:8px;}
.toast{ background: var(--ink); color:white; padding:11px 16px; border-radius: var(--radius-sm); font-size:13px; box-shadow: var(--shadow-hover); animation: slideIn .25s ease; }
@keyframes slideIn{ from{ transform:translateY(10px); opacity:0;} to{ transform:translateY(0); opacity:1;} }

/* ---------- Wellness: breathing circle ---------- */
.breath-circle{
  width:96px; height:96px; margin:6px auto 0; border-radius:50%;
  background: linear-gradient(135deg, var(--lavender-soft), var(--sky-soft));
  border:2px solid var(--lavender);
  display:flex; align-items:center; justify-content:center;
  color:#544A82; text-align:center; padding:6px;
  transform:scale(0.72);
}
html[data-theme="dark"] .breath-circle{ color:#D8D0F2; }
.breath-circle.running{ animation: breathe 16s ease-in-out infinite; }
.breath-circle span{ font-size:11.5px; font-weight:700; line-height:1.2; }
@keyframes breathe{
  0%{ transform:scale(0.72); }
  25%{ transform:scale(1.18); }
  50%{ transform:scale(1.18); }
  75%{ transform:scale(0.72); }
  100%{ transform:scale(0.72); }
}
.wellness-quick-btns{ display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- Heatmap ---------- */
.heatmap{ display:grid; grid-template-columns: repeat(auto-fill, 15px); gap:3px; }
.heat-cell{ width:15px; height:15px; border-radius:3px; background: var(--bg-soft); }

/* ---------- Focus Mode ---------- */
.focus-overlay{ position:fixed; inset:0; z-index:500; background:rgba(34,32,28,0.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px; animation: slideIn .2s ease; }
.focus-card{ background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow-hover); padding:28px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; }
.focus-card.center{ text-align:center; }
@media (max-width:640px){ .focus-card{ padding:20px; } }

/* ---------- Command center hero ---------- */
.hero-mission{
  background: linear-gradient(135deg, #3E4A3B 0%, #2E3A3D 100%);
  border-radius: var(--radius-lg); padding:26px 28px; color:#F3EFE6; position:relative; overflow:hidden;
}
.hero-mission::after{ content:''; position:absolute; top:-60px; right:-60px; width:220px; height:220px; border-radius:50%; background: radial-gradient(circle, rgba(217,164,65,0.18), transparent 70%); }
.hero-mission .eyebrow{ color:#B9CFB4; font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
.hero-mission h2{ color:#fff; font-size:22px; margin:4px 0 14px; }
.mission-item{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,0.1); font-size:13.5px; }
.mission-item:first-of-type{ border-top:none; }
.mission-item .dot{ margin-top:5px; flex-shrink:0; }

/* Utility */
.flex{ display:flex; }
.flex-between{ display:flex; align-items:center; justify-content:space-between; }
.flex-wrap{ flex-wrap:wrap; }
.gap-8{ gap:8px; } .gap-10{gap:10px;} .gap-16{gap:16px;}
.muted{ color: var(--ink-soft); }
.faint{ color: var(--ink-faint); }
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-20{margin-top:20px;}
.mb-8{margin-bottom:8px;} .mb-12{margin-bottom:12px;}
.text-sm{ font-size:12.5px; } .text-xs{font-size:11px;}
.w-full{width:100%;}
.hidden{ display:none !important; }
.center{ text-align:center; }
.float-timer{ bottom:168px; right:20px; }
.float-fab{ bottom:100px; right:20px; }

/* Responsive sidebar */
#bottomNav{ display:none; }
@media (max-width: 900px){
  #sidebar{ transform: translateX(-100%); }
  #sidebar.open{ transform: translateX(0); }
  #main{ margin-left:0; padding: 20px 16px 84px; }
  #pragatiV3Panel{ margin-left:0; padding: 0 16px 84px; }
  .menu-toggle{ display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:10px; background:var(--card); border:1px solid var(--card-border); margin-right:10px; }
  #sidebarScrim{ position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:40; }
  #bottomNav{
    display:flex; position:fixed; left:0; right:0; bottom:0; z-index:45;
    background:var(--card); border-top:1px solid var(--card-border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 16px rgba(54,47,42,0.06);
  }
  #bottomNav a{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 2px; border-radius:12px; color:var(--ink-faint); font-size:10.5px; font-weight:600;
  }
  #bottomNav a .bn-ic{ font-size:19px; line-height:1; }
  #bottomNav a.active{ color:var(--sage); background:var(--sage-soft); }
  .float-timer{ bottom:238px; }
  .float-fab{ bottom:170px; }
}

/* ===== Pragati Smart Today — aesthetic layer ===== */
.smart-today-card{
  position:relative; overflow:hidden; border:1px solid var(--card-border);
  background:linear-gradient(135deg,var(--card-bg),var(--sky-soft));
  box-shadow:0 8px 28px rgba(40,50,70,.06);
}
.smart-today-card::after{
  content:""; position:absolute; width:180px; height:180px; right:-70px; top:-80px;
  border-radius:50%; background:var(--sage-soft); opacity:.65; pointer-events:none;
}
.smart-today-card .smart-content{position:relative;z-index:1}
.smart-kpi{
  background:rgba(255,255,255,.55); border:1px solid var(--card-border);
  border-radius:12px; padding:10px 12px; min-width:100px;
}
.smart-kpi .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.smart-kpi .v{font-family:var(--font-mono);font-size:19px;font-weight:800;margin-top:3px}
.smart-lane{
  border-radius:10px; padding:9px 11px; border:1px solid var(--card-border);
  background:var(--card-bg);
}

// A prereq counts as "not ready" once completion drops under this — well below "weak" (60%),
// since the point is to catch chapters that are barely touched, not merely below target.
const PREREQ_READY_THRESHOLD = 35;
function chapterPrereqWarning(subject, chapterName){
  const prereqs = (CHAPTER_PREREQS[subject]||{})[chapterName];
  if(!prereqs || !prereqs.length) return null;
  const notReady = prereqs
    .map(name => findChapterByName(subject, name))
    .filter(Boolean)
    .filter(c => chapterCompletion(c) < PREREQ_READY_THRESHOLD);
  if(!notReady.length) return null;
  return `Usually comes after ${notReady.map(c=>esc(c.name)).join(', ')} — those are still under ${PREREQ_READY_THRESHOLD}% complete.`;
}
// Called once per schedule generation — collects prereq warnings for whatever chapters actually
// got scheduled today, so out-of-order sequencing surfaces as one quiet toast rather than nagging
// on every chapter card every time.
function collectPrereqWarningsForEvents(events){
  const seen = new Set(), warnings = [];
  events.forEach(e=>{
    if(!e.chapter || !e.subject) return;
    const key = e.subject+'::'+e.chapter;
    if(seen.has(key)) return;
    seen.add(key);
    const w = chapterPrereqWarning(e.subject, e.chapter);
    if(w) warnings.push(`${e.chapter} (${e.subject})`);
  });
  return warnings;
}
// Builds the topic checklist for one chapter — Physics/Chemistry entries carry their own
// [name, jeeWeight, neetWeight] tuple; Biology/Maths entries are plain names that get a
// flat weight applied since the whole subject only matters for one exam.
function buildTopicsFor(subject, chapterName){
  const raw = (DEFAULT_TOPICS[subject]||{})[chapterName];
  if(!raw) return [];
  if(subject==='Biology') return raw.map(name=>({id:uid(), name, done:false, status:'notstarted', jee:0, neet:3}));
  if(subject==='Maths') return raw.map(name=>({id:uid(), name, done:false, status:'notstarted', jee:3, neet:0}));
  return raw.map(t=>({id:uid(), name:t[0], done:false, status:'notstarted', jee:t[1], neet:t[2]}));
}

const STUDY_EXAMS=['CBSE','NEET','JEE'];
const EXAM_SUBJECTS = { CBSE:['Physics','Chemistry','Biology','Maths'], NEET:['Physics','Chemistry','Biology'], JEE:['Physics','Chemistry','Maths'] };
function examAppliesToSubject(exam, subject){ return (EXAM_SUBJECTS[exam]||[]).includes(subject); }
function allowedExamsForSubject(subject){ return STUDY_EXAMS.filter(ex=>examAppliesToSubject(ex,subject)); }

function normalizeStudyState(v){
  if(v==='practiced') return 'practicing';
  if(v==='mastered') return 'mastered';
  if(STUDY_STATE_ORDER.includes(v)) return v;
  return 'notstarted';
}
function ensureTopicStudyState(t){
  if(!t) return;
  t.studyState=t.studyState||{};
  STUDY_EXAMS.forEach(e=>{
    t.studyState[e]=normalizeStudyState(t.studyState[e]);
  });
}
function getTopicStudyState(t,exam){
  ensureTopicStudyState(t);
  return t.studyState[exam];
}
function setTopicStudyState(t,exam,state){
  if(!t || !STUDY_EXAMS.includes(exam) || !STUDY_STATE_ORDER.includes(state)) return;
  ensureTopicStudyState(t);
  t.studyState[exam]=state;
  t.status=state;
  t.done=state==='mastered';
}
function stateForPlannerBlock(b){
  const subject=b?.subject||'', chapter=b?.chapter||'', topic=b?.topic||b?.activity||'';
  const ch = (DATA.subjects?.[subject]?.chapters||[]).find(c=>c.name===chapter);
  const t = ch?.topics?.find(x=>x.name===topic || x.id===topic);
  const exam=b?.exam;
  if(t && STUDY_EXAMS.includes(exam)) return getTopicStudyState(t,exam);
  return 'notstarted';
}
function nextRecommendedAction(state){
  return STUDY_STATE_META[normalizeStudyState(state)]?.action || STUDY_STATE_META.notstarted.action;
}
function topicReadinessState(t,exam){
  const s=getTopicStudyState(t,exam);
  return {state:s,...STUDY_STATE_META[s]};
}
function cycleTopicStudyState(subject,chId,topicId,exam){
  const ch=DATA.subjects?.[subject]?.chapters?.find(c=>c.id===chId);
  const t=ch?.topics?.find(x=>x.id===topicId);
  if(!t || !STUDY_EXAMS.includes(exam)) return;
  ensureTopicStudyState(t);
  const i=STUDY_STATE_ORDER.indexOf(t.studyState[exam]);
  const next=STUDY_STATE_ORDER[(i+1)%STUDY_STATE_ORDER.length];
  setTopicStudyState(t,exam,next);
  save(); render(); checkAchievements?.();
}
function studyStateBadge(t,exam){
  const s=getTopicStudyState(t,exam), m=STUDY_STATE_META[s];
  return `<span class="study-state-badge state-${s}" title="${esc(m.action)}">${m.icon} ${m.label}</span>`;
}
function studyStateProgress(t,exam){
  const s=getTopicStudyState(t,exam);
  return Math.round(STUDY_STATE_ORDER.indexOf(s)/(STUDY_STATE_ORDER.length-1)*100);
}

function topicStatusOf(t){ return t.status || (t.done ? 'mastered' : 'notstarted'); }
function topicStatusIcon(t){ return (TOPIC_STATUSES.find(s=>s.key===topicStatusOf(t))||TOPIC_STATUSES[0]).icon; }
function cycleTopicStatus(subj, chId, topicId){
  const ch = DATA.subjects[subj]?.chapters.find(c=>c.id===chId);
  const t = ch?.topics?.find(x=>x.id===topicId);

  ensureTopicStudyState(t);
  const exam = window.__topicExamChoice || (t.jee>0 && t.neet>0 ? 'NEET' : t.jee>0 ? 'JEE' : 'CBSE');
  cycleTopicStudyState(subj,chId,topicId,exam);
}

function nextMayThird(){
  const now = new Date(); let y = now.getFullYear();
  const target = new Date(`${y}-05-03`);
  if(target < now) y += 1;
  return `${y}-05-03`;
}
function nextDateLike(month, day){
  const now = new Date(); let y = now.getFullYear();
  const mm = String(month).padStart(2,'0'), dd = String(day).padStart(2,'0');
  let target = new Date(`${y}-${mm}-${dd}`);
  if(target < now) y += 1;
  return `${y}-${mm}-${dd}`;
}

// ---- Sleep-aware energy suggestion ----
// If sleep hours are logged low and the student hasn't manually overridden today's
// energy level, auto-suggest (and apply) a lighter energy setting so the planner
// doesn't ask for a full day off too little rest. A manual pick always wins.
function suggestedEnergyFromSleep(sleepHrs){
  if(sleepHrs==null || sleepHrs==='' || isNaN(sleepHrs)) return null;
  const h = Number(sleepHrs);
  if(h < 5) return 'exhausted';
  if(h < 6.5) return 'tired';
  return null; // enough sleep — leave whatever energy is already set
}
function maybeAutoSuggestEnergyFromSleep(date){
  date = date || todayStr();
  const rec = DATA.health[date] || {};
  if(rec.energyManual) return; // student already chose today's energy themselves — don't override
  const suggestion = suggestedEnergyFromSleep(rec.sleep);
  if(!suggestion || rec.energy===suggestion) return;
  setEnergy(date, suggestion, false);
  toast(`${ENERGY_LEVELS[suggestion].icon} Only ${rec.sleep}h sleep logged — set today's energy to "${ENERGY_LEVELS[suggestion].label}" so the plan stays realistic. Change it anytime in Health.`, 4200);
}

   LocalStorage remains the offline cache. When configured and signed in,
   DATA is mirrored to /users/<uid>/data and changes sync across devices.

const FIREBASE_CONFIG_KEY = 'pragati_firebase_config_v1';

let cloudUser = null, cloudRef = null, cloudListener = null;
let cloudSaveTimer = null, cloudApplying = false, cloudReady = false;
let cloudLastLocalWrite = 0, cloudLastRemoteWrite = 0;

function getFirebaseConfig(){
  try { return JSON.parse(localStorage.getItem(FIREBASE_CONFIG_KEY)||'null'); } catch(e){ return null; }
}
function setFirebaseConfig(cfg){ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); }
function clearFirebaseConfig(){ localStorage.removeItem(FIREBASE_CONFIG_KEY); }
function firebaseConfigured(){ return !!getFirebaseConfig() && typeof firebase!=='undefined'; }
function cloudStatusText(){
  if(!firebaseConfigured()) return 'Not configured';
  if(!cloudUser) return 'Configured · not signed in';
  if(!cloudReady) return `Signed in as ${cloudUser.email||'Google account'} · connecting…`;
  return `☁️ Synced · ${cloudUser.email||'Google account'}`;
}
function parseFirebaseConfigInput(raw){
  const text=(raw||'').trim();
  if(!text) throw new Error('Empty Firebase config.');

  // Accept Firebase Console's normal JavaScript Config snippet OR plain JSON.
  // The user should never have to manually convert Firebase's snippet to JSON.
  let cfg=null;
  try{
    const parsed=JSON.parse(text);
    if(parsed && typeof parsed==='object' && !Array.isArray(parsed)) cfg=parsed;
  }catch(e){}

  if(!cfg){
    let body=text;
    const match=text.match(/(?:const|let|var)\s+firebaseConfig\s*=\s*\{([\s\S]*?)\}\s*;?/);
    if(match) body=match[1];
    else {
      const start=text.indexOf('{'), end=text.lastIndexOf('}');
      if(start>=0 && end>start) body=text.slice(start+1,end);
      else throw new Error('Firebase config object not found.');
    }
    cfg={};
    const keys=['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId','measurementId'];
    keys.forEach(key=>{
      const re=new RegExp('(?:^|[,\\n])\\s*'+key+'\\s*:\\s*(["\\\'])(.*?)\\1','m');
      const m=body.match(re);
      if(m) cfg[key]=m[2];
    });
  }

  const required=['apiKey','authDomain','projectId','appId'];
  if(!required.every(k=>cfg[k])) throw new Error('Missing required Firebase config fields: '+required.filter(k=>!cfg[k]).join(', '));

  // Firebase Console may omit databaseURL from the Web App config.
  // For the default Realtime Database created for a project, derive the exact
  // URL automatically from projectId so the student does not have to edit code.
  if(!cfg.databaseURL && cfg.projectId){
    cfg.databaseURL=`https://${cfg.projectId}-default-rtdb.firebaseio.com`;
  }
  return cfg;
}

function saveFirebaseConfigFromForm(){
  try{
    const cfg=parseFirebaseConfigInput(document.getElementById('fb_config').value);
    // If the app was previously initialized with another config, reset it so
    // the newly saved configuration is actually used.
    try{ if(firebaseApp && typeof firebase!=='undefined' && firebase.apps?.length){ firebase.app().delete().catch(()=>{}); } }catch(e){}
    firebaseApp=null; firebaseAuth=null; firebaseDb=null; cloudUser=null; cloudRef=null; cloudListener=null; cloudReady=false;
    setFirebaseConfig(cfg);
    closeModal();
    render();
    toast('✅ Firebase config saved. Connecting…');
    initFirebaseCloud(true);
  }catch(e){
    console.error('Firebase config parse failed',e);

  }
}
function clearCloudSetup(){
  try{ if(firebaseAuth) firebaseAuth.signOut(); }catch(e){}
  cloudUser=null; cloudReady=false; cloudRef=null;
  clearFirebaseConfig();
  toast('Cloud configuration cleared.'); closeModal(); render();
}
function initFirebaseCloud(showToast=false){
  if(typeof firebase==='undefined'){ if(showToast) toast('⚠️ Firebase library did not load. Check your internet connection.'); return; }
  const cfg=getFirebaseConfig(); if(!cfg){ return; }
  try{
    if(!firebaseApp) firebaseApp=firebase.initializeApp(cfg);
    firebaseAuth=firebase.auth(); firebaseDb=firebase.database();
    if(!firebaseAuth.__pragatiListener){
      firebaseAuth.__pragatiListener=true;
      firebaseAuth.onAuthStateChanged(async user=>{
        cloudUser=user||null; cloudReady=false;
        if(cloudListener && cloudRef){ try{cloudRef.off('value',cloudListener);}catch(e){} }
        cloudListener=null; cloudRef=null;
        if(user){ await attachCloudUser(user, showToast); initPrashnBridge(); }
        else { render(); }
      });
    }
    if(showToast && !cloudUser) signInWithGoogle();
  }catch(e){ console.error('Firebase init failed',e); if(showToast) toast('⚠️ Firebase setup failed — check your config and database URL.'); }
}
async function attachCloudUser(user, showToast=false){
  try{
    cloudRef=firebaseDb.ref(`users/${user.uid}/data`);
    const snap=await cloudRef.once('value');
    const cloudData=snap.val();
    const localMeaningful = hasMeaningfulLocalData(DATA);
    if(cloudData){
      const useCloud = confirm('Pragati found cloud data for this account.\n\nOK = use cloud data on this device.\nCancel = keep this device\'s data and upload it to the cloud.');
      if(useCloud){
        cloudApplying=true; DATA=migrateData(cloudData); localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); cloudApplying=false;
      } else {
        await cloudRef.set(firebaseSafeData(DATA));
      }
    } else if(localMeaningful){
      await cloudRef.set(firebaseSafeData(DATA));
    }
    cloudLastRemoteWrite=Date.now();
    cloudReady=true;
    cloudListener=(snapshot)=>{
      if(cloudApplying) return;
      // Ignore the immediate echo of our own recent write; a genuine other-device
      // update will arrive after this short window and will replace the local cache.
      if(cloudLastLocalWrite && Date.now()-cloudLastLocalWrite < 2500) return;
      const incoming=snapshot.val();
      if(!incoming || !cloudReady) return;
      cloudApplying=true;
      DATA=migrateData(incoming);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
      cloudApplying=false;
      cloudLastRemoteWrite=Date.now();
      render();
      toast('☁️ Updated from your other device.');
    };
    cloudRef.on('value',cloudListener);
    initPrashnBridge();
    if(showToast) toast('☁️ Cloud sync connected.');
    render();
  }catch(e){ console.error('Cloud attach failed',e); toast('⚠️ Could not connect to the cloud database. Check your Firebase rules.'); }
}
function hasMeaningfulLocalData(d){
  try { return (d.studyLog?.length||0)+(d.mocks?.length||0)+(d.doubts?.length||0)+(d.plannerEvents?.length||0)>0 || Object.values(d.subjects||{}).some(x=>(x.chapters||[]).some(c=>chapterCompletion(c)>0)); }
  catch(e){ return false; }
}
async function signInWithGoogle(){
  if(!firebaseAuth){
    initFirebaseCloud();
    setTimeout(()=>signInWithGoogle(),250);
    return;
  }
  try{
    const provider=new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    await firebaseAuth.signInWithPopup(provider);
  }catch(e){
    console.error('Pragati Google sign-in error:', e);
    const code=e?.code||'unknown';
    const msg=e?.message||'No additional error message was provided.';
    if(code==='auth/popup-blocked') toast('⚠️ Popup blocked. Allow popups for this site, then try again.');
    else if(code==='auth/unauthorized-domain') toast('⚠️ Unauthorized domain. Add rshvani2509-oss.github.io in Firebase → Authentication → Settings → Authorized domains.');
    else if(code==='auth/operation-not-allowed') toast('⚠️ Google provider is not enabled in this Firebase project.');
    else if(code==='auth/network-request-failed') toast('⚠️ Network request failed. Check internet/VPN/ad-blocker and try again.');
    else if(code==='auth/popup-closed-by-user') toast('⚠️ Google sign-in window was closed before completion.');
    else if(code==='auth/cancelled-popup-request') toast('⚠️ Another Google sign-in popup is already running. Wait a moment and try again.');
    else toast('⚠️ Google sign-in error: '+code+' — '+msg);
  }
}
async function cloudSignOut(){

function firebaseSafeData(value){
  // Firebase Realtime Database rejects undefined values and non-finite numbers.
  // Pragati intentionally uses undefined for some optional fields, so strip those
  // fields before sending the in-memory DATA object to Firebase.
  if(value === undefined) return undefined;
  if(typeof value === 'number' && !Number.isFinite(value)) return null;
  if(value === null || typeof value === 'string' || typeof value === 'boolean') return value;
  if(Array.isArray(value)){
    return value.map(firebaseSafeData).map(v => v === undefined ? null : v);
  }
  if(typeof value === 'object'){
    const out = {};
    for(const [k,v] of Object.entries(value)){
      const safe = firebaseSafeData(v);
      if(safe !== undefined) out[k] = safe;
    }
    return out;
  }
  return undefined;
}

function scheduleCloudSave(){
  if(!cloudReady || !cloudRef || cloudApplying) return;
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async()=>{
    try{
      cloudLastLocalWrite=Date.now();
      await cloudRef.set(firebaseSafeData(DATA));
      cloudLastRemoteWrite=Date.now();
      render();
    }catch(e){ console.error('Cloud save failed',e); toast('⚠️ Cloud sync failed: '+(e?.message||e?.code||'unknown error')+' — local data is still saved.'); }
  },700);
}
function forceCloudSync(){
  if(!cloudReady || !cloudRef){ toast('☁️ Sign in to cloud sync first.'); return; }
  clearTimeout(cloudSaveTimer);
  cloudLastLocalWrite=Date.now();
  cloudRef.set(firebaseSafeData(DATA)).then(()=>{ cloudLastRemoteWrite=Date.now(); toast('☁️ Synced now.'); render(); }).catch(e=>{ console.error('Cloud force-sync failed',e); toast('⚠️ Cloud sync failed: '+(e?.message||e?.code||'unknown error')); });
}

let DATA = loadData();
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshData();
    const parsed = JSON.parse(raw);
    return migrateData(parsed);
  }catch(e){
    console.warn('Storage read failed, using fresh data', e);
    return freshData();
  }
}
function migrateData(d){
  const fresh = freshData();
  // shallow-merge top level keys so new fields introduced later don't break old saves
  const merged = Object.assign({}, fresh, d);
  merged.meta = Object.assign({}, fresh.meta, d.meta||{});
  merged.meta.wellness = Object.assign({}, fresh.meta.wellness, (d.meta&&d.meta.wellness)||{});
  if(!merged.meta.monthlySnapshots) merged.meta.monthlySnapshots = {};
  if(merged.meta.lastSeenChangelogVersion===undefined) merged.meta.lastSeenChangelogVersion = 0;
  merged.goals = Object.assign({}, fresh.goals, d.goals||{});
  merged.streak = Object.assign({}, fresh.streak, d.streak||{});
  if(!merged.subjects) merged.subjects = fresh.subjects;
  Object.keys(DEFAULT_CHAPTERS).forEach(s => { if(!merged.subjects[s]) merged.subjects[s] = {chapters: DEFAULT_CHAPTERS[s].map(n=>makeChapter(n, s))}; });
  // Backfill module tracker (Aakash/Tatva) + auto-priority mode on any chapters saved before these features existed
  Object.entries(merged.subjects).forEach(([subjKey, subjData]) => {
    const allowed = new Set(allowedExamsForSubject(subjKey));

    (subjData.chapters||[]).forEach(ch => {
      if(!ch.modules) ch.modules = makeModules();
      else MODULE_DEFS.forEach(md => {
        const m = ch.modules[md.key];
        if(!m) { ch.modules[md.key] = {total:0, correct:0, wrong:0}; }
        else if(m.correct===undefined){ // old shape was {solved,total} — best-effort convert: assume prior "solved" were correct
          ch.modules[md.key] = {total:Number(m.total)||0, correct:Number(m.solved)||0, wrong:0};
        }
      });
      if(!ch.priorityMode) ch.priorityMode = 'auto';
      if(!ch.sync) ch.sync = { school:'none', aakash:'none', vedantu:'none', selfStudy:'none', revisionSync:'none' };
      if(ch.understanding===undefined) ch.understanding = 0;
      if(!Array.isArray(ch.ncertSections)) ch.ncertSections = [];
      if(ch.skipped===undefined) ch.skipped = false;
      if(ch.resourceLink===undefined) ch.resourceLink = '';
      // Enforce exam eligibility on saved chapter/topic mappings.
      ch.examTags = ch.examTags || {};
      ['CBSE','NEET','JEE'].forEach(ex=>{ if(!allowed.has(ex)) ch.examTags[ex]=false; });
      if(!Array.isArray(ch.topics)) ch.topics = buildTopicsFor(subjKey, ch.name);
      else ch.topics.forEach(t => { if(!t.status) t.status = t.done ? 'mastered' : 'notstarted'; });
    });
  });
  if(!Array.isArray(merged.missingContentReports)) merged.missingContentReports = [];
  merged.prgPack ||= {mode:'CBSE',achievements:{},snapshots:[]};
  merged.practiceCounts ||= {};
  merged.oneTapPlan ||= {lastGenerated:'',lastSummary:null};
  merged.paf ||= {lastAutoReplan:'',lastClean:''};
  if(!Array.isArray(merged.studyCompletions)) merged.studyCompletions=[];
  if(!Array.isArray(merged.studySessionLogs)) merged.studySessionLogs=[];
  if(!merged.prashnSync) merged.prashnSync={};
  merged.revisionQueue ||= [];
  if(!merged.examRecords) merged.examRecords = [];
  if(!merged.upcomingTests) merged.upcomingTests = [];
  merged.upcomingTests.forEach(t=>{ if(!t.analysisStatus) t.analysisStatus='pending'; if(!t.testType) t.testType = 'Other'; if(!t.examType) t.examType='NEET'; });
  if(!merged.scheduleOverrides) merged.scheduleOverrides = {};
  merged.routine = Object.assign({}, fresh.routine, d.routine||{});
  merged.slipTests = Object.assign({}, fresh.slipTests, d.slipTests||{});
  merged.slipTests.schedule = Object.assign({}, fresh.slipTests.schedule, (d.slipTests&&d.slipTests.schedule)||{});
  if(merged.streak.freezesAvailable===undefined) merged.streak.freezesAvailable = 1;
  if(!merged.streak.freezesUsedDates) merged.streak.freezesUsedDates = [];
  if(merged.streak.freezesGrantedForMilestone===undefined) merged.streak.freezesGrantedForMilestone = 0;
  if(!merged.dailyReviews) merged.dailyReviews = {};
  if(!merged.attendance) merged.attendance = fresh.attendance;
  else merged.attendance = { school:{...fresh.attendance.school, ...(d.attendance&&d.attendance.school)}, aakash:{...fresh.attendance.aakash, ...(d.attendance&&d.attendance.aakash)}, vedantu:{...fresh.attendance.vedantu, ...(d.attendance&&d.attendance.vedantu)} };
  if(merged.focusSession===undefined) merged.focusSession = null;
  if(!Array.isArray(merged.focusSessionLog)) merged.focusSessionLog = [];
  if(!merged.mitChecks) merged.mitChecks = {};
  merged.backlog = Object.assign({}, fresh.backlog, d.backlog||{});
  if(!Array.isArray(merged.backlog.history)) merged.backlog.history = [];

  // Syllabus/exam cleanup migration: fix old saved data without deleting user progress.
  Object.entries(merged.subjects).forEach(([subjKey, subjData])=>{
    (subjData.chapters||[]).forEach(ch=>{
      if(ch.classLevel!==11 && ch.classLevel!==12) ch.classLevel=autoClassLevel(subjKey,ch.name);
      const allowed=allowedExamsForSubject(subjKey);
      ch.examTags=Object.assign({CBSE:false,NEET:false,JEE:false},ch.examTags||{});
      STUDY_EXAMS.forEach(ex=>{ if(!allowed.includes(ex)) ch.examTags[ex]=false; });
      allowed.forEach(ex=>{ if(ch.examTags[ex]===undefined) ch.examTags[ex]=true; });
      (ch.topics||[]).forEach(t=>{
        if(subjKey==='Biology') t.jee=0;
        if(subjKey==='Maths') t.neet=0;
        if(!allowed.includes('JEE') && t.studyState) delete t.studyState.JEE;
        if(!allowed.includes('NEET') && t.studyState) delete t.studyState.NEET;
      });
    });
    if(subjKey==='Maths' && !(subjData.chapters||[]).some(c=>c.name==='Linear Programming')){
      const ch=makeChapter('Linear Programming','Maths');
      ch.classLevel=12;
      subjData.chapters.push(ch);
    }
  });

  return merged;
}

// ---- Cost-of-Delay tracking for weak chapters ----
// Records the first day a chapter was seen as "weak" (level==='high') and clears it once it
// stops being weak, so the chapter card can show a gentle "weak for Nd" nudge — same idea as the
// doubt-aging feature, applied to chapters that quietly stay weak for a long time.
function updateWeakSinceTracking(){
  if(DATA.meta.weakSinceLastRun === todayStr()) return; // once per day is plenty
  DATA.meta.weakSinceLastRun = todayStr();
  let changed = false;
  allChapters().forEach(c=>{
    const ch = DATA.subjects[c.subject]?.chapters.find(x=>x.id===c.id);
    if(!ch) return;
    const isWeak = chapterLevel(ch).level === 'high';
    if(isWeak && !ch.weakSince){ ch.weakSince = todayStr(); changed = true; }
    else if(!isWeak && ch.weakSince){ ch.weakSince = null; changed = true; }
  });
  if(changed) save();
}

/* ---------------- Smart notifications: nudge when the next block is about to start ---------------- */
// Notifications require a "real" origin — most browsers refuse to grant permission (or never
// even show the prompt) when a page is opened directly from disk as a file:// URL, which is
// exactly how a downloaded single-file HTML app like this one is normally opened. That's the
// #1 reason "Allow Notifications" appears to do nothing — it isn't a bug in the click handler,
// the browser is silently declining before it ever reaches our code. Detect and say so plainly.
function isFileProtocol(){ return location.protocol === 'file:'; }
function notificationPermissionStatus(){
  if(!('Notification' in window)) return 'unsupported';
  return Notification.permission; // 'granted' | 'denied' | 'default'
}
function notificationStatusBadgeHTML(){
  if(isFileProtocol()) return `<span class="tag" style="background:var(--coral-soft); color:#8A4238; font-weight:700;">🚫 Won't work opened as a file</span>`;
  const status = notificationPermissionStatus();
  if(status==='granted') return `<span class="tag" style="background:var(--sage-soft); color:var(--sage); font-weight:700;">🔔 Allowed</span>`;
  if(status==='denied') return `<span class="tag" style="background:var(--coral-soft); color:#8A4238; font-weight:700;">🚫 Blocked in browser</span>`;
  if(status==='unsupported') return `<span class="tag" style="background:var(--bg-soft); color:var(--ink-faint); font-weight:700;">Not supported here</span>`;
  return `<span class="tag" style="background:var(--amber-soft); color:#8A6A2E; font-weight:700;">Not yet allowed</span>`;
}
function requestNotificationPermission(onDone){
  if(isFileProtocol()){
    toast('🚫 Notifications need this page opened at an http/https address — they can\'t be granted when opened directly from a downloaded file. Host it (e.g. GitHub Pages, Netlify Drop) or run it via a local server, then try again.', 6000);
    onDone(false);
    return;
  }
  const status = notificationPermissionStatus();
  if(status==='unsupported'){ toast('Notifications are not supported in this browser.'); onDone(false); return; }
  if(status==='denied'){ toast('🚫 Notifications are blocked for this site. Tap the 🔒/ⓘ icon next to the address bar → Notifications → Allow, then try again.'); onDone(false); return; }
  if(status==='granted'){ onDone(true); return; }
  try{
    // Notification.requestPermission() is Promise-based in modern browsers but callback-based
    // in older ones (older Safari) — support both instead of assuming a Promise is returned.
    const result = Notification.requestPermission(perm => {
      onDone(perm==='granted');
      if(perm!=='granted') toast('Notification permission was not granted.');
    });
    if(result && typeof result.then === 'function'){
      result.then(perm=>{ onDone(perm==='granted'); if(perm!=='granted') toast('Notification permission was not granted.'); })
            .catch(()=>{ toast('⚠️ The browser blocked the notification request — this can happen inside an embedded/preview frame. Open the file in its own browser tab and try again.'); onDone(false); });
    }
  }catch(e){
    toast('⚠️ Could not request notification permission here — try opening this page in its own browser tab (not an embedded preview).');
    onDone(false);
  }
}
function enableAllNotifications(){
  requestNotificationPermission(granted=>{
    if(granted){
      DATA.meta.notifications = true;
      DATA.meta.wellness = DATA.meta.wellness || {};
      DATA.meta.wellness.waterReminderEnabled = true;
      DATA.meta.wellness.waterLastReminderAt = Date.now();

let notifiedBlockIds = new Set();
let notifiedEndBlockIds = new Set();
let notifiedForDate = todayStr();
// Covers both ends of every task/subtask block: a heads-up just before it starts, and a
// "time's up" alert right after its scheduled end if it's still sitting incomplete — the second
// one is what makes the Reschedule buttons on the timeline actually get noticed and used.
function checkUpcomingBlockNotifications(){
  if(!DATA.meta.notifications) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(todayStr() !== notifiedForDate){ notifiedForDate = todayStr(); notifiedBlockIds = new Set(); notifiedEndBlockIds = new Set(); }
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  (DATA.plannerEvents||[]).filter(b=>b.date===todayStr() && b.subject!=='Fixed').forEach(b=>{
    const start = toMin(b.startTime);
    const end = toMin(b.endTime);
    // Starting soon — lists pending subtasks so the notification itself says what to do.
    if(!b.done && start!=null && !notifiedBlockIds.has(b.id) && start - nowMin <= 2 && start - nowMin >= 0){
      notifiedBlockIds.add(b.id);
      const subs = Array.isArray(b.subtasks) ? b.subtasks.filter(s=>!s.done) : [];
      const subtaskList = subs.length ? ' — ' + subs.map(s=>s.label).join(', ') : '';
      try{ new Notification('⏰ Time for '+b.subject, { body:(b.activity||'Study block')+subtaskList+' · '+fmtTime(b.startTime)+'–'+fmtTime(b.endTime)+' · '+studyTechniqueForBlock(b).title, tag:'pragati-start-'+b.id }); }catch(e){}
    }
    // Time's up and it's still not marked done — nudges toward the ↻/→ reschedule buttons.
    if(!b.done && end!=null && !notifiedEndBlockIds.has(b.id) && nowMin - end >= 0 && nowMin - end <= 2){
      notifiedEndBlockIds.add(b.id);
      try{ new Notification("⏳ Time's up — "+b.subject, { body:(b.activity||'This block')+" wasn't marked done. Open the Planner to finish it or move it to a new slot.", tag:'pragati-end-'+b.id }); }catch(e){}
    }
  });
}
setInterval(checkUpcomingBlockNotifications, 30000);

  requestNotificationPermission(granted=>{
    DATA.meta.notifications = granted;

function checkWaterReminder(){
  const w = DATA.meta.wellness;
  if(!w || !w.waterReminderEnabled) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now = Date.now();
  const intervalMs = (w.waterIntervalMin||60) * 60000;
  if(!w.waterLastReminderAt){ w.waterLastReminderAt = now; save(); return; }
  if(now - w.waterLastReminderAt >= intervalMs){
    w.waterLastReminderAt = now; save();
    try{ new Notification('💧 Hydration check', { body:"Time for a glass of water. You've got this.", tag:'pragati-water' }); }catch(e){}
  }
}
setInterval(checkWaterReminder, 30000);

/* ---------------- Wellness: guided breathing / meditation timer ---------------- */
function formatMMSS(sec){
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function meditationWidgetHTML(){
  if(meditationState.running){
    const phase = BREATH_PHASES[meditationState.phaseIdx].name;
    return `
    <div style="text-align:center;">
      <div class="breath-circle running"><span id="meditationPhase">${phase}</span></div>
      <div id="meditationTime" class="mono" style="font-size:15px; font-weight:700; margin-top:10px;">${formatMMSS(meditationState.remainingSec)}</div>
      <button class="btn btn-outline btn-sm mt-8" onclick="stopMeditation(false)">Stop &amp; log</button>
    </div>`;
  }
  return `
    <div class="wellness-quick-btns">
      <button class="btn btn-outline btn-sm" onclick="startMeditation(2)">2 min</button>
      <button class="btn btn-outline btn-sm" onclick="startMeditation(5)">5 min</button>
      <button class="btn btn-primary btn-sm" onclick="startMeditation(10)">10 min</button>
    </div>
    <div class="text-xs faint mt-8">Guided box breathing — in, hold, out, hold (4s each).</div>`;
}
function renderMeditationWidget(){
  const el = document.getElementById('meditationWidget');
  if(el) el.innerHTML = meditationWidgetHTML();
}
function startMeditation(minutes){
  if(meditationState.running) return;
  clearInterval(meditationState.intervalId);
  meditationState = { running:true, remainingSec:minutes*60, totalSec:minutes*60, intervalId:null, phaseIdx:0, phaseRemaining:BREATH_PHASES[0].sec };
  meditationState.intervalId = setInterval(tickMeditation, 1000);
  renderMeditationWidget();
}
function tickMeditation(){
  if(!meditationState.running) return;
  meditationState.remainingSec--;
  meditationState.phaseRemaining--;
  if(meditationState.phaseRemaining <= 0){
    meditationState.phaseIdx = (meditationState.phaseIdx + 1) % BREATH_PHASES.length;
    meditationState.phaseRemaining = BREATH_PHASES[meditationState.phaseIdx].sec;
  }
  if(meditationState.remainingSec <= 0){ finishMeditation(); return; }
  const phaseEl = document.getElementById('meditationPhase');
  const timeEl = document.getElementById('meditationTime');
  if(phaseEl) phaseEl.textContent = BREATH_PHASES[meditationState.phaseIdx].name;
  if(timeEl) timeEl.textContent = formatMMSS(meditationState.remainingSec);
}
function finishMeditation(){
  clearInterval(meditationState.intervalId);
  const mins = Math.round(meditationState.totalSec/60);
  const date = todayStr();
  DATA.health[date] = DATA.health[date] || {};
  DATA.health[date].meditation = (DATA.health[date].meditation||0) + mins;
  addXP('habit'); save();
  meditationState = { running:false, remainingSec:0, totalSec:0, intervalId:null, phaseIdx:0, phaseRemaining:4 };
  toast(`🧘 Meditation complete — +${mins} min logged.`);
  render();
}
function stopMeditation(discard){
  clearInterval(meditationState.intervalId);
  if(!discard && meditationState.totalSec > 0){
    const doneSec = meditationState.totalSec - meditationState.remainingSec;
    const mins = Math.round(doneSec/60);
    if(mins > 0){
      const date = todayStr();
      DATA.health[date] = DATA.health[date] || {};
      DATA.health[date].meditation = (DATA.health[date].meditation||0) + mins;
      addXP('habit'); save();
      toast(`🧘 +${mins} min meditation logged.`);
    }
  }
  meditationState = { running:false, remainingSec:0, totalSec:0, intervalId:null, phaseIdx:0, phaseRemaining:4 };
  render();
}

// ---- Data Health Check ----
// A lightweight diagnostic pass over the tracker's own data, looking for the kind of thing that
// only creeps in from manual entry mistakes — not exhaustive validation, just the checks likely
// to actually catch something: a chapter with real logged study time but 0% completion (progress
// checkboxes probably never ticked), and mocks with numbers that can't be real.
function runDataHealthCheck(){
  const issues = [];
  // Chapters with meaningful logged time but 0% completion
  const minutesByChapter = {};
  (DATA.plannerEvents||[]).forEach(e=>{
    if(!e.done || !e.chapter || !e.subject) return;
    const s = toMin(e.startTime), en = toMin(e.endTime);
    if(s==null || en==null) return;
    const dur = Math.max(0, en - s);
    const key = e.subject+'::'+e.chapter;
    minutesByChapter[key] = (minutesByChapter[key]||0) + dur;
  });
  Object.entries(minutesByChapter).forEach(([key, mins])=>{
    if(mins < 90) return; // ignore small/one-off blocks
    const [subj, name] = key.split('::');
    const ch = findChapterByName(subj, name);
    if(ch && chapterCompletion(ch)===0){
      issues.push({type:'Chapter stuck at 0%', detail:`${name} (${subj}) has ${(mins/60).toFixed(1)}h of completed study blocks logged, but no NCERT/Lecture/Notes/Mock/Revision checkbox is ticked yet.`});
    }
  });
  // Mocks with impossible numbers
  DATA.mocks.forEach(m=>{
    const bad = [];
    if(m.accuracy!=null && (m.accuracy<0 || m.accuracy>100)) bad.push(`accuracy ${m.accuracy}%`);
    if(m.percentile!=null && (m.percentile<0 || m.percentile>100)) bad.push(`percentile ${m.percentile}`);
    if(m.totalQuestions>0 && (m.totalCorrect+m.totalWrong+m.totalUnattempted) !== m.totalQuestions) bad.push(`correct+wrong+unattempted (${m.totalCorrect+m.totalWrong+m.totalUnattempted}) ≠ total questions (${m.totalQuestions})`);
    if(m.date && new Date(m.date) > new Date(new Date().setDate(new Date().getDate()+1))) bad.push(`date ${m.date} is in the future`);
    if(bad.length) issues.push({type:'Mock with inconsistent numbers', detail:`${m.name||'Unnamed mock'} (${fmtDate(m.date)}) — ${bad.join(', ')}.`});
  });
  // Duplicate mocks — same name and date
  const seenMocks = {};
  DATA.mocks.forEach(m=>{
    const key = (m.name||'')+'|'+m.date;
    seenMocks[key] = (seenMocks[key]||0)+1;
  });
  Object.entries(seenMocks).filter(([,c])=>c>1).forEach(([key,c])=>{
    issues.push({type:'Possible duplicate mock', detail:`"${key.split('|')[0]}" on ${fmtDate(key.split('|')[1])} appears ${c} times.`});
  });
  // Chapters marked fully complete but with 0% accuracy logged
  subjectNames().forEach(subj=>{
    (DATA.subjects[subj]?.chapters||[]).forEach(ch=>{
      if(chapterCompletion(ch)===100 && ch.mockTested && (ch.accuracy===0)){
        issues.push({type:'Chapter fully done but 0% accuracy', detail:`${ch.name} (${subj}) is marked fully complete and mock-tested, but accuracy is still 0% — likely never updated.`});
      }
    });
  });
  return issues;
}
function openDataHealthCheckModal(){
  const issues = runDataHealthCheck();
  openModal(`
    <div class="modal-head"><h3>🩺 Data Health Check</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    ${issues.length ? `
      <p class="text-sm muted mb-12">${issues.length} thing${issues.length===1?'':'s'} worth a look:</p>
      ${issues.map(i=>`<div class="card mb-10" style="background:var(--coral-soft); border:none;"><div class="text-xs" style="font-weight:700;">${esc(i.type)}</div><div class="text-sm mt-4">${esc(i.detail)}</div></div>`).join('')}
    ` : `<div class="empty text-sm">Nothing flagged — data looks internally consistent.</div>`}
    <div class="text-xs faint mt-8">This is a heuristic scan, not proof of a mistake — just things worth double-checking.</div>
  `);

// ---- Catch-Up Mode ----
// Compares remaining Class 12 (live-syllabus) chapters against days left to the nearest
// upcoming exam and recent study pace, and — when behind — suggests either more daily hours
// or specific low-yield chapters to compress/skip so the realistic syllabus still finishes in time.
// ---- Pre-Exam Taper Mode ----
// In the final 1-3 days before a big exam (JEE/NEET/board dates in Settings → Exams), pushing
// brand-new chapters is usually the wrong move — consolidation (revision, mock review, formula
// recall) pays off more than fresh content squeezed in under pressure. Detected automatically so
// the student doesn't have to remember to switch modes themselves.
const TAPER_WINDOW_DAYS = 3;
function isTaperWindow(date){
  const exam = nearestUpcomingExam(date);
  if(!exam || exam.days > TAPER_WINDOW_DAYS || exam.days < 0) return null;
  return exam;
}
// In taper mode, only chapters that are already "known" (due for revision, flagged from a recent
// mock, or clearly weak) qualify — a chapter whose only score is exam-nearness (i.e. genuinely
// brand new) gets excluded so the day doesn't turn into last-minute new-content cramming.
function filterPrioritiesForTaper(priorities){
  return priorities.filter(p => p.revisionScore>0 || p.mockFixScore>0 || p.weakScore>=15);
}
// ---- Recap Window (early ramp-down) ----
// Full Taper Mode (above) only kicks in 1-3 days out — a sharp, late switch. In the wider run-up
// to a big exam (up to RECAP_WINDOW_DAYS out), new content still flows normally, but each day also
// gets one fixed, protected revision-only block so consolidation starts gradually well before the
// final cram window, instead of appearing all at once.
const RECAP_WINDOW_DAYS = 10;
const RECAP_BLOCK_MIN = 30;
function isRecapWindow(date){
  const exam = nearestUpcomingExam(date);
  if(!exam || exam.days > RECAP_WINDOW_DAYS || exam.days <= TAPER_WINDOW_DAYS) return null;
  return exam;
}
// Picks what the day's fixed recap block should cover — due revisions first, then a mock-flagged
// or clearly weak chapter, falling back to the mistake notebook if nothing else qualifies.
function recapBlockPick(date){
  const due = getDueRevisions();
  if(due.length) return {label: `📉 Recap — Revision due: ${due[0].chapter||due[0].name||'chapter review'}`, subject: due[0].subject};
  const weak = weakChapters(60)[0];
  if(weak) return {label: `📉 Recap — Revisit ${weak.name} (${weak.accuracy}% accuracy)`, subject: weak.subject, chapter: weak.name};
  return {label: DATA.mistakes.length ? '📉 Recap — Mistake Notebook review' : '📉 Recap — Quick revision / flashcards', subject:'Revision'};
}
function nearestUpcomingExam(fromDate){
  fromDate = fromDate || todayStr();
  const entries = Object.entries(DATA.meta.exams||{}).map(([k,v])=>({key:k, date:v, days:daysBetween(fromDate, v)})).filter(e=>e.days>=0);
  entries.sort((a,b)=>a.days-b.days);
  return entries[0] || null;
}
function chapterExamWeight(ch){
  return (ch.topics||[]).reduce((a,t)=>a+(Number(t.jee)||0)+(Number(t.neet)||0), 0);
}
function recentAvgStudyHoursPerDay(days=14){
  let total = 0;
  for(let i=0;i<days;i++){ const d=new Date(); d.setDate(d.getDate()-i); total += hoursOnDate(d.toISOString().slice(0,10)); }
  return total/days;
}
const HOURS_PER_CHAPTER_ESTIMATE = 4; // rough average hours to take a live-syllabus chapter to solid completion
function computeCatchUpStatus(){
  const exam = nearestUpcomingExam();
  if(!exam || exam.days<=0) return { behind:false };
  const liveChapters = allChapters().filter(c => chapterClassLevel(c.subject, c)===12 && !c.skipped);
  const remaining = liveChapters.filter(c => chapterCompletion(c) < 80);
  if(!remaining.length) return { behind:false, daysLeft:exam.days, examKey:exam.key, remainingChapters:0 };
  const requiredHoursTotal = remaining.length * HOURS_PER_CHAPTER_ESTIMATE;
  const requiredHoursPerDay = requiredHoursTotal / exam.days;
  const actualHoursPerDay = recentAvgStudyHoursPerDay(14);
  const behind = actualHoursPerDay < requiredHoursPerDay * 0.8;
  return {
    behind, daysLeft: exam.days, examKey: exam.key,
    remainingChapters: remaining.length, requiredHoursPerDay: Math.round(requiredHoursPerDay*10)/10,
    actualHoursPerDay: Math.round(actualHoursPerDay*10)/10,
    extraHoursNeeded: Math.max(0, Math.round((requiredHoursPerDay-actualHoursPerDay)*10)/10)
  };
}
function compressionCandidates(limit=8){
  return allChapters()
    .filter(c => chapterClassLevel(c.subject, c)===12 && !c.skipped && chapterCompletion(c) < 80)
    .map(c => ({...c, weight: chapterExamWeight(c)}))
    .sort((a,b) => a.weight - b.weight)
    .slice(0, limit);
}
function toggleChapterSkip(subj, chId){
  const ch = DATA.subjects[subj]?.chapters.find(c=>c.id===chId);
  if(!ch) return;
  ch.skipped = !ch.skipped;
  save(); render();
  toast(ch.skipped ? `⏭ ${ch.name} compressed out of daily planning.` : `↩ ${ch.name} back in the rotation.`);
}
function openCatchUpModal(){
  const status = computeCatchUpStatus();
  const candidates = compressionCandidates();
  openModal(`
    <div class="modal-head"><h3>⏩ Catch-Up Mode</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="text-sm mb-12">You have <strong>${status.remainingChapters}</strong> Class 12 chapters left with <strong>${status.daysLeft}</strong> days to go — that needs roughly <strong>${status.requiredHoursPerDay}h/day</strong>, but you're averaging <strong>${status.actualHoursPerDay}h/day</strong> over the last two weeks.</div>
    <div class="text-sm mb-16">Pick one lever, or both: study ~${status.extraHoursNeeded}h more per day, or compress a few of the lowest-yield chapters below so the ones that matter most for your exams get full attention.</div>
    <div class="text-xs faint mb-8" style="text-transform:uppercase; letter-spacing:.05em; font-weight:700;">Lowest-yield chapters left (candidates to compress)</div>
    ${candidates.length ? candidates.map(c=>`
      <div class="list-item">
        <span class="txt">${esc(c.name)} <span class="faint text-xs">(${esc(c.subject)}) · exam weight ${c.weight}</span></span>
        <button class="btn btn-outline btn-sm" onclick="toggleChapterSkip('${c.subject}','${c.id}'); openCatchUpModal();">⏭ Compress</button>
      </div>
    `).join('') : `<div class="text-xs faint">No good compression candidates found.</div>`}
    <div class="text-xs faint mt-12">Compressed chapters drop out of the daily planner and priority engine — you can bring any of them back anytime from the subject page.</div>
  `);
}
function catchUpBannerHTML(){

function updateStreak(){
  const s = DATA.streak;
  if(s.freezesAvailable===undefined) s.freezesAvailable = 1;
  if(!s.freezesUsedDates) s.freezesUsedDates = [];
  if(s.freezesGrantedForMilestone===undefined) s.freezesGrantedForMilestone = 0;
  const dates = [...new Set(DATA.studyLog.map(l=>l.date))].sort();
  if(!dates.length){ s.current=0; return; }
  const dateSet = new Set(dates);
  let cur = 0;
  let d = new Date();
  const usedThisWalk = [];
  // walk backward from today while consecutive days have logs — a missed day can be
  // covered once by a streak freeze (earned every 7-day streak, capped at 3 in the bank)
  while(true){
    const ds = d.toISOString().slice(0,10);
    if(dateSet.has(ds)){ cur++; d.setDate(d.getDate()-1); continue; }
    if(ds === todayStr()){ d.setDate(d.getDate()-1); continue; } // allow today to be empty without breaking streak yet
    const alreadyUsed = s.freezesUsedDates.includes(ds);
    const freezesLeft = s.freezesAvailable - usedThisWalk.length;
    if(!alreadyUsed && freezesLeft > 0){ usedThisWalk.push(ds); cur++; d.setDate(d.getDate()-1); continue; }
    break;
  }
  if(usedThisWalk.length){
    s.freezesUsedDates = [...s.freezesUsedDates, ...usedThisWalk];
    s.freezesAvailable -= usedThisWalk.length;
  }
  s.current = cur;
  s.longest = Math.max(s.longest||0, cur);
  // earn a fresh freeze every full 7-day streak reached, capped at 3 banked at once
  const milestone = Math.floor(s.longest/7);
  if(milestone > s.freezesGrantedForMilestone){
    const grant = Math.min(3 - s.freezesAvailable, milestone - s.freezesGrantedForMilestone);
    if(grant > 0) s.freezesAvailable += grant;
    s.freezesGrantedForMilestone = milestone;
  }
}

// Efficiency Score — how well a day's study effort is being converted into results.
// Plan Adherence 40% (planner blocks actually ticked done) · Goal Hours 20% · Accuracy 20% · Consistency 20% (streak)
function computeEfficiencyScore(date){
  date = date || todayStr();
  const blocks = (DATA.plannerEvents||[]).filter(b=>b.date===date);
  let pastBlocks = blocks;
  if(date===todayStr()){
    const nowMin = new Date().getHours()*60 + new Date().getMinutes();
    pastBlocks = blocks.filter(b => (toMin(b.endTime)||0) <= nowMin);
  }
  const planPct = pastBlocks.length ? Math.round(pastBlocks.filter(b=>b.done).length/pastBlocks.length*100) : null;

  const hrs = hoursOnDate(date);
  const goalPct = DATA.goals.daily.hours ? clamp(Math.round(hrs/DATA.goals.daily.hours*100),0,100) : 0;

  const chs = allChapters().filter(c=>c.accuracy>0);
  const accPct = chs.length ? Math.round(chs.reduce((a,c)=>a+c.accuracy,0)/chs.length) : 0;

  const streakPct = clamp(Math.round((DATA.streak.current/14)*100),0,100);

  const planScoreUsed = planPct===null ? goalPct : planPct; // no blocks logged yet? lean on hours instead
  const total = Math.round(planScoreUsed*0.4 + goalPct*0.2 + accPct*0.2 + streakPct*0.2);
  return { total: clamp(total,0,100), planPct: planPct===null?0:planPct, hasBlocks: blocks.length>0, goalPct, accPct, streakPct, hrs };
}

// Turns the per-mistake "reason" log (careless, concept gap, etc.) into a periodic readout —
// this month's #1 mistake type plus how it compares to last month, so the data that's already
// being captured on every mistake actually gets surfaced instead of only sitting in the notebook.
function mistakesInMonth(monthsAgo=0){
  const d = new Date(); d.setMonth(d.getMonth()-monthsAgo);
  const y = d.getFullYear(), m = d.getMonth();
  return DATA.mistakes.filter(mk => { if(!mk.date) return false; const md = new Date(mk.date); return md.getFullYear()===y && md.getMonth()===m; });

function mistakePatternDigest(){
  const thisMonth = mistakesInMonth(0);
  const lastMonth = mistakesInMonth(1);
  const statsFor = (list)=>{
    const reasons = {};
    list.forEach(m => { const r = m.reason || 'Unspecified'; reasons[r] = (reasons[r]||0)+1; });
    return Object.entries(reasons).map(([reason,count])=>({reason, count})).sort((a,b)=>b.count-a.count);
  };
  const cur = statsFor(thisMonth), prev = statsFor(lastMonth);
  const top = cur[0] || null;
  const prevTopSameReasonCount = top ? (prev.find(p=>p.reason===top.reason)?.count || 0) : 0;
  return {
    total: thisMonth.length,
    top,
    topPct: top ? Math.round(top.count/thisMonth.length*100) : 0,
    trend: top ? top.count - prevTopSameReasonCount : 0,
    breakdown: cur
  };
}

function predictScore(){

  let base = 0, count=0;
  const recentMocks = [...DATA.mocks].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,3);
  if(recentMocks.length){
    base = recentMocks.reduce((a,m)=>a+Number(m.totalScore||0),0)/recentMocks.length;
    count = recentMocks.length;
  } else {
    // fallback from chapter accuracy — 4 subjects × 100 marks each, uniform +4/-1 pattern
    const chs = allChapters().filter(c=>c.accuracy>0);
    const avgAcc = chs.length ? chs.reduce((a,c)=>a+c.accuracy,0)/chs.length/100 : 0.5;
    const totalMax = 400;
    base = totalMax * avgAcc;
  }
  const spread = 12 + (3-count)*4;
  return { mid: Math.round(base), low: Math.round(base-spread), high: Math.round(base+spread) };
}

function generateMission(){
  const items = [];
  // 1. Due revisions (highest leverage)
  const due = getDueRevisions().slice(0,2);
  due.forEach(r => items.push({dot:'red', text:`Revise ${r.chapter} (${r.subject}) — ${estimateRevisionTime(r)} min`, kind:'revision', ref:r.id}));
  // 2. Weakest chapter below 55%
  const weak = weakChapters(55)[0];
  if(weak) items.push({dot:'red', text:`Strengthen ${weak.name} (${weak.subject}) — accuracy is ${weak.accuracy}%`, kind:'weak'});
  // 3. Overdue todos
  const overdueTodo = DATA.todos.find(t=>t.status!=='done' && t.deadline && t.deadline < todayStr());
  if(overdueTodo) items.push({dot:'yellow', text:`Finish overdue task: ${overdueTodo.text}`, kind:'todo'});
  // 4. Mistake notebook review
  if(DATA.mistakes.length >= 5) items.push({dot:'yellow', text:`Review 10 questions from your Mistake Notebook`, kind:'mistakes'});
  // 5. Subject with least recent hours
  const subs = subjectNames();
  const hoursBySubj = subs.map(s=>({s, h: subjectHoursTotal(s,7)}));
  hoursBySubj.sort((a,b)=>a.h-b.h);
  if(hoursBySubj.length) items.push({dot:'green', text:`Give ${hoursBySubj[0].s} extra focus today — only ${hoursBySubj[0].h.toFixed(1)}h this week`, kind:'balance'});
  // 6. Pending doubt
  const doubt = DATA.doubts.find(d=>d.status==='Pending');
  if(doubt) items.push({dot:'yellow', text:`Resolve doubt: ${doubt.question.slice(0,50)}${doubt.question.length>50?'…':''}`, kind:'doubt'});
  return items.slice(0,5);
}
function estimateRevisionTime(){ return 15 + Math.floor(Math.random()*30); }

// "Next Best Task" — the single highest-priority chapter right now, with a plain-English
// explanation of why, built from the same priority engine that drives Generate My Day.
function nextBestTask(){
  const rows = computeChapterPriorities(todayStr());
  if(!rows.length) return null;
  const top = rows[0];
  const ch = findChapterByName(top.subject, top.chapter);
  const reasons = [];
  if(top.examScore>=40) reasons.push(`it's covered in an exam within the next day`);
  else if(top.examScore>=30) reasons.push(`it's covered in an exam within 3 days`);
  else if(top.examScore>=15) reasons.push(`it's covered in an exam within a week`);
  if(top.examTypeBoost>0) reasons.push(`that exam is a ${top.priorityTestName}, which gets slightly higher priority`);
  if(top.revisionScore>0) reasons.push(`its spaced revision is due today${top.revisionStage?` (stage ${top.revisionStage})`:''}`);
  if(top.slipScore>0) reasons.push(`today's slip test covers this subject`);
  if(top.mockFixScore>0) reasons.push(`it was flagged as a costly chapter in a recent mock`);
  if(top.homeworkScore>0) reasons.push(`you have pending homework in ${top.subject}`);
  if(top.missedScore>0) reasons.push(`it didn't get finished in yesterday's plan`);
  if(ch && ch.accuracy>0) reasons.push(`your accuracy here is only ${ch.accuracy}%, making it one of your weaker chapters`);
  else if(!reasons.length) reasons.push(`it's the highest-leverage topic left untouched today`);
  const minutes = 45;
  return { subject:top.subject, chapter:top.chapter, minutes, reasons, total:top.total };
}

   PRAGATI 2.2+ — STUDY STRATEGIST LAYER
   Adds decision-ready preparation data without replacing existing trackers.

function chapterReadinessScore(ch, subject){
  if(!ch) return 0;
  const completion = chapterCompletion(ch);
  const acc = Number(ch.accuracy)||0;
  const understanding = Number(ch.understanding)||0;
  const q = Math.min(100, Number(ch.questions||0)/40*100);
  const pyq = Math.min(100, Number(ch.pyqCount||0)/15*100);
  const rev = (ch.revision1?25:0)+(ch.revision2?25:0)+(ch.revision3?25:0);
  const tested = acc>0 ? acc : 0;
  return Math.round(completion*.25 + understanding*.15 + q*.15 + pyq*.15 + tested*.20 + Math.min(100,rev)*.10);
}
function readinessBand(score){
  if(score>=80) return {label:'Exam-ready',icon:'🟢',cls:'tag-low'};
  if(score>=60) return {label:'Practice-ready',icon:'🟡',cls:'tag-med'};
  if(score>=35) return {label:'Build',icon:'🟠',cls:'tag-high'};
  return {label:'Foundation',icon:'🔴',cls:'tag-high'};
}
function chapterStudyTechnique(subject, ch){
  const s=(subject||'').toLowerCase(), n=(ch?.name||'').toLowerCase();
  if(s==='biology') return {method:'NCERT active recall → diagrams/terms → 25–40 MCQs → error review',why:'Biology gains most from precise recall plus question practice.'};
  if(s==='physics') return {method:'Concept map → 2 solved examples → timed numericals → mistake reattempt',why:'Physics needs a short concept pass followed by problem solving.'};
  if(s==='chemistry'){
    if(/organic|hydrocarbon|halo|aldehyde|ketone|amine|alcohol|ether|acid|goc/.test(n)) return {method:'Reaction/mechanism recall → NCERT examples → PYQs → error loop',why:'Organic retention improves when reactions are recalled before practice.'};
    if(/equilibrium|thermo|electro|kinetic|solution|chemical/.test(n)) return {method:'Formula/concept recall → 3 worked problems → timed set → error review',why:'Physical Chemistry benefits from concept-to-numerical repetition.'};
    return {method:'NCERT/notes → active recall → questions → PYQs',why:'Use a concept-first pass, then convert it into questions.'};
  }
  if(s==='maths') return {method:'Formula/theorem recall → 2 examples → timed problem set → error reattempt',why:'Maths improves through repeated problem patterns and error correction.'};
  return {method:'Recall → questions → PYQs → error review',why:'A balanced cycle keeps the chapter moving toward exam readiness.'};
}
function studyStrategistPick(){
  const ov=DATA.strategistOverride;
  if(ov && ov.date===todayStr()){
    const ch=findChapterByName(ov.subject,ov.chapter);
    if(ch) return {subject:ov.subject,chapter:ov.chapter,ch,score:99999,completion:chapterCompletion(ch),acc:Number(ch.accuracy)||0,readiness:chapterReadinessScore(ch,ov.subject),tech:chapterStudyTechnique(ov.subject,ch),highYield:highYieldTags(ov.subject,ch.name).length};
  }

  const rows=[];
  subjectNames().forEach(subject=>{
    (DATA.subjects[subject]?.chapters||[]).forEach(ch=>{
      const completion=chapterCompletion(ch), acc=Number(ch.accuracy)||0;
      const due=ch.lastRevised ? daysBetween(ch.lastRevised,todayStr()) : 30;
      const examTags=Object.entries(ch.examTags||{}).filter(([,v])=>v).map(([k])=>k);
      const highYield=highYieldTags(subject,ch.name).length;
      const weak=Math.max(0,100-(acc||55));
      const unfinished=Math.max(0,100-completion);
      const stale=Math.min(30,due*2);
      const score=Math.round(unfinished*.28 + weak*.28 + stale*.18 + highYield*8 + (ch.mistakes||0)*3 + (examTags.length?5:0));
      rows.push({subject,chapter:ch.name,ch,score,completion,acc,readiness:chapterReadinessScore(ch,subject),tech:chapterStudyTechnique(subject,ch),highYield});
    });
  });
  return rows.sort((a,b)=>b.score-a.score)[0]||null;
}

let prashnBridgeRef=null, prashnBridgeListener=null;
function prashnBridgeData(){return DATA.prashnSync?.data||null}
function prashnBridgeSummary(){
  const d=prashnBridgeData();
  if(!d)return {attempts:0,wrong:0,skipped:0,pyqs:0,accuracy:0,chapters:[],mistakes:[]};
  const logs=Array.isArray(d.attemptLog)?d.attemptLog:Object.values(d.attemptLog||{});
  const attempted=logs.filter(x=>!x.skipped).length, correct=logs.filter(x=>!x.skipped&&x.correct).length;
  const wrong=logs.filter(x=>!x.skipped&&!x.correct).length;
  const skipped=logs.filter(x=>x.skipped).length;
  const pyqs=logs.filter(x=>x.pyq).length;
  const chapters=Object.values(d.chapterStats||{}).map(x=>({...x,accuracy:x.attempts?Math.round(100*x.correct/x.attempts):0})).sort((a,b)=>a.accuracy-b.accuracy).slice(0,8);
  return {attempts:attempted,wrong,skipped,pyqs,accuracy:attempted?Math.round(100*correct/attempted):0,chapters,mistakes:Array.isArray(d.mistakeQuestions)?d.mistakeQuestions:Object.values(d.mistakeQuestions||{})};
}

/* Convert a Prashn wrong-question record into Pragati's native mistake schema.
   A stable prashnId prevents duplicate notebook entries when Firebase updates. */
function syncPrashnMistakesIntoNotebook(d){
  if(!d)return {added:0,updated:0};
  DATA.mistakes=Array.isArray(DATA.mistakes)?DATA.mistakes:[];
  const source=[];
  const mq=Array.isArray(d.mistakeQuestions)?d.mistakeQuestions:Object.values(d.mistakeQuestions||{});
  mq.forEach((q,i)=>{
    if(!q)return;
    source.push({
      prashnId:String(q.id||q.questionId||q.qid||q.key||`mq-${i}`),
      subject:q.subject||q.sub||'',
      chapter:q.chapter||q.ch||'',
      topic:q.topic||'',
      question:q.q||q.question||q.text||q.prompt||'',
      reason:q.reason||q.mistakeReason||'Prashn wrong attempt',
      correctConcept:q.correctConcept||q.explanation||q.solution||'',
      examSource:q.exam||q.examSource||q.source||'Prashn',
      date:q.date||q.createdAt||todayStr(),
      wrongCount:Number(q.wrongCount||q.attempts||1),
      nextReview:q.nextReview||''
    });
  });

  // Also catch wrong attempts even when Prashn hasn't created a mistakeQuestions
  // entry yet. This makes a wrong answer itself sufficient to reach the notebook.
  const logs=Array.isArray(d.attemptLog)?d.attemptLog:Object.values(d.attemptLog||{});
  logs.filter(x=>!x.skipped&&!x.correct).forEach((q,i)=>{
    const id=String(q.id||q.questionId||q.qid||q.key||`attempt-${q.date||''}-${i}`);
    if(source.some(x=>x.prashnId===id))return;
    source.push({
      prashnId:id,
      subject:q.subject||q.sub||'',
      chapter:q.chapter||q.ch||'',
      topic:q.topic||'',
      question:q.q||q.question||q.text||q.prompt||'',
      reason:q.reason||q.mistakeReason||'Prashn wrong attempt',
      correctConcept:q.correctConcept||q.explanation||q.solution||'',
      examSource:q.exam||q.examSource||q.source||'Prashn',
      date:q.date||q.createdAt||todayStr(),
      wrongCount:1,
      nextReview:q.nextReview||''
    });
  });

  let added=0,updated=0;
  source.forEach(q=>{
    if(!q.question||!q.subject||!q.chapter)return;
    let m=DATA.mistakes.find(x=>x.source==='Prashn'&&String(x.prashnId)===q.prashnId);
    if(!m){
      m={id:uid(),source:'Prashn',prashnId:q.prashnId,subject:q.subject,chapter:q.chapter,topic:q.topic,
         question:q.question,reason:q.reason,examSource:q.examSource,correctConcept:q.correctConcept,
         date:String(q.date).slice(0,10)||todayStr(),revisionDates:[],wrongCount:q.wrongCount||1,
         nextReview:q.nextReview||'',mastered:false};
      DATA.mistakes.push(m);added++;
    }else{
      m.subject=q.subject||m.subject;m.chapter=q.chapter||m.chapter;m.topic=q.topic||m.topic;
      m.question=q.question||m.question;m.reason=q.reason||m.reason;m.examSource=q.examSource||m.examSource;
      m.correctConcept=q.correctConcept||m.correctConcept;m.nextReview=q.nextReview||m.nextReview;
      m.wrongCount=Math.max(Number(m.wrongCount||1),Number(q.wrongCount||1));
      m.lastSynced=todayStr();updated++;
    }

function initPrashnBridge(){
  if(typeof firebase==='undefined' || !cloudUser || !firebaseDb)return;
  try{
    prashnBridgeRef=firebaseDb.ref(`users/${cloudUser.uid}/prashn`);
    if(prashnBridgeListener)prashnBridgeRef.off('value',prashnBridgeListener);
    prashnBridgeListener=snap=>{
      const d=snap.val()||{};
      const sync=syncPrashnMistakesIntoNotebook(d);
      DATA.prashnSync={connected:!!snap.val(),updatedAt:d.updatedAt||null,data:d};
      saveLocalOnly();
      render();
      if(sync.added) toast(`📒 ${sync.added} Prashn mistake${sync.added===1?'':'s'} added to Mistake Notebook.`);
    };
    prashnBridgeRef.on('value',prashnBridgeListener);
  }catch(e){console.error('Prashn bridge failed',e)}
}
