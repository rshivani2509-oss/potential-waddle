// GitHub-style contribution calendar — one column per week, Mon-Sun rows, scrolls back ~6 months.
// Green shades = hours studied that day; red = a day that had passed since tracking began with zero hours logged.
function githubHeatmapHTML(weeksBack){
  weeksBack = weeksBack || 26;
  const today = new Date(); today.setHours(0,0,0,0);
  const createdAt = DATA.meta.createdAt ? new Date(DATA.meta.createdAt) : null;
  // Find the Monday on/before (today - weeksBack weeks), then walk forward to build columns.
  const dayIdx = (today.getDay()+6)%7; // 0=Mon
  const endOfWeek = new Date(today); endOfWeek.setDate(today.getDate() + (6-dayIdx)); // this week's Sunday
  const start = new Date(endOfWeek); start.setDate(endOfWeek.getDate() - (weeksBack*7-1));
  const totalDays = weeksBack*7;
  const cellsByWeek = [];
  const monthLabels = [];
  let lastMonth = null;
  for(let w=0; w<weeksBack; w++){
    const week = [];
    for(let d=0; d<7; d++){
      const dt = new Date(start); dt.setDate(start.getDate() + w*7 + d);
      const dateStr = dt.toISOString().slice(0,10);
      week.push(dateStr);
      if(d===0){
        const mn = dt.toLocaleDateString('en-IN',{month:'short'});
        if(mn !== lastMonth){ monthLabels.push({w, label:mn}); lastMonth = mn; }
      }
    }
    cellsByWeek.push(week);
  }
  const goalHours = DATA.goals?.daily?.hours || 8;
  function cellColor(dateStr){
    const dt = new Date(dateStr);
    if(dt > today) return 'transparent'; // future — render invisible placeholder
    if(createdAt && dt < createdAt) return 'var(--bg-soft)'; // before tracking started
    const h = hoursOnDate(dateStr);
    if(h<=0) return 'var(--coral)'; // missed day — red
    const ratio = h/goalHours;
    if(ratio>=0.9) return 'var(--sage)';
    if(ratio>=0.5) return '#B9D2B4';
    return '#DCE9DA';
  }
  const weeksHTML = cellsByWeek.map(week => `
    <div style="display:grid; grid-template-rows:repeat(7,12px); gap:3px;">
      ${week.map(dateStr => {
        const dt = new Date(dateStr);
        const future = dt > today;
        const h = hoursOnDate(dateStr);
        const title = future ? '' : `${fmtDate(dateStr)}: ${h}h studied`;
        return `<div title="${title}" style="width:12px; height:12px; border-radius:3px; background:${cellColor(dateStr)}; ${future?'visibility:hidden;':''}"></div>`;
      }).join('')}
    </div>`).join('');
  const monthsHTML = monthLabels.map(ml => `<span style="position:absolute; left:${ml.w*15}px; font-size:10px; color:var(--ink-faint);">${ml.label}</span>`).join('');
  return `
  <div style="overflow-x:auto; padding-bottom:6px;">
    <div style="position:relative; height:14px; margin-bottom:4px; min-width:${weeksBack*15}px;">${monthsHTML}</div>
    <div style="display:flex; gap:3px; min-width:${weeksBack*15}px;">${weeksHTML}</div>
  </div>
  <div class="text-xs faint mt-8">🟩 productive day (green shades = hours vs your ${goalHours}h daily goal) · 🟥 missed day · ⬜ before tracking started</div>`;
}

function timeVsMarksHTML(subs){
  const rows = subs.map(s => ({s, hours: subjectHoursTotal(s,7), acc: subjectAccuracy(s)}));

    const weakest = [...rows].sort((a,b)=>a.acc-b.acc)[0];

    }
  }
  return rows.map(r=>`<div class="bar-row"><div class="lbl">${r.s}</div><div class="bar-track" style="flex:1;"><div class="bar-fill blue" style="width:${clamp(r.hours*8,0,100)}%"></div></div><div class="val">${r.hours.toFixed(1)}h</div></div>`).join('') + insight;
}

let periodMode = 'week'; // 'week' | 'month'
let periodOffset = 0;    // 0 = current, -1 = previous, etc.
function periodRange(mode, offset){
  const now = new Date();
  if(mode==='week'){
    const day = now.getDay();
    const monday = new Date(now); monday.setDate(now.getDate() - ((day+6)%7) + offset*7);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const start = monday.toISOString().slice(0,10), end = sunday.toISOString().slice(0,10);
    return { start, end, label: `${fmtDate(start)} – ${fmtDate(end)}` };
  }
  const base = new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const start = new Date(base.getFullYear(), base.getMonth(), 1).toISOString().slice(0,10);
  const end = new Date(base.getFullYear(), base.getMonth()+1, 0).toISOString().slice(0,10);
  return { start, end, label: base.toLocaleDateString('en-IN',{month:'long', year:'numeric'}) };
}
function computePeriodStats(range){
  const {start,end} = range;
  const inRange = d => !!d && d>=start && d<=end;
  const totalDays = daysBetween(start,end)+1;

  const hoursEntries = DATA.studyLog.filter(l=>inRange(l.date));
  const totalHours = Math.round(hoursEntries.reduce((a,l)=>a+(parseFloat(l.hours)||0),0)*10)/10;
  const bySubject = {};
  hoursEntries.forEach(l=>{ bySubject[l.subject] = Math.round(((bySubject[l.subject]||0)+(parseFloat(l.hours)||0))*10)/10; });
  const daysStudied = new Set(hoursEntries.map(l=>l.date)).size;

  const mocks = DATA.mocks.filter(m=>inRange(m.date)).map(m=>({date:m.date, name:m.name, kind:'Mock', score:m.totalScore, max:null, pct:m.accuracy!=null?m.accuracy:null}));
  const exams = DATA.examRecords.filter(r=>inRange(r.date)).map(r=>({date:r.date, name:r.name, kind:r.source, score:r.totalObtained, max:r.totalMax, pct:examPercentage(r)}));
  const allTests = [...mocks, ...exams].sort((a,b)=>a.date.localeCompare(b.date));
  const testPcts = allTests.filter(t=>t.pct!=null).map(t=>t.pct);
  const avgTestPct = testPcts.length ? Math.round(testPcts.reduce((a,b)=>a+b,0)/testPcts.length) : null;

  const pyqs = DATA.pyqs.filter(p=>inRange(p.date));
  const pyqAcc = pyqs.length ? Math.round(pyqs.filter(p=>p.correct).length/pyqs.length*100) : null;

  const revisionsCompleted = DATA.revisions.filter(r=>inRange(r.lastDone)).length;

  const vedantuBlocks = (DATA.plannerEvents||[]).filter(b=>b.subject==='Vedantu' && inRange(b.date));
  const vedantuAttended = vedantuBlocks.filter(b=>b.done).length;

  const slipBlocks = (DATA.plannerEvents||[]).filter(b=>b.subject==='Slip Test' && inRange(b.date));
  const slipDone = slipBlocks.filter(b=>b.done).length;

  const generatedBlocks = (DATA.plannerEvents||[]).filter(b=>b.generated && inRange(b.date));
  const planAdherence = generatedBlocks.length ? Math.round(generatedBlocks.filter(b=>b.done).length/generatedBlocks.length*100) : null;

  let effSum=0, effCount=0;
  for(let d=new Date(start); d<=new Date(end) && d<=new Date(); d.setDate(d.getDate()+1)){
    const ds = d.toISOString().slice(0,10);
    if(ds>todayStr()) break;
    effSum += computeEfficiencyScore(ds).total; effCount++;
  }
  const avgEfficiency = effCount ? Math.round(effSum/effCount) : null;

  const mistakesLogged = DATA.mistakes.filter(m=>inRange(m.date)).length;

  return { start, end, totalDays, totalHours, bySubject, daysStudied, allTests, avgTestPct, testCount:allTests.length,
    pyqCount:pyqs.length, pyqAcc, revisionsCompleted, vedantuScheduled:vedantuBlocks.length, vedantuAttended,
    slipScheduled:slipBlocks.length, slipDone, planAdherence, avgEfficiency, mistakesLogged };
}
// Planned-vs-actual, block by block. "Planned" = the block's scheduled duration. "Actual" = banked
// subtask-timer minutes when available (real, precise); falls back to the block's own duration if
// it was ticked done with no timer used (best guess), or 0 if untouched.
function computePlannedVsActual(range){
  const {start,end} = range;
  const inRange = d => !!d && d>=start && d<=end;
  const skip = new Set(['Fixed','Break','Sleep']);
  const taskBlocks = (DATA.plannerEvents||[]).filter(b=>inRange(b.date) && !skip.has(b.subject));
  const bySubject = {};
  const rows = [];
  let plannedMin = 0, actualMin = 0;
  taskBlocks.forEach(b=>{
    const planned = Math.max(0, (toMin(b.endTime)||0) - (toMin(b.startTime)||0));
    let actual = 0, hasTimerData = false;
    if(Array.isArray(b.subtasks) && b.subtasks.length){
      const timedMs = b.subtasks.reduce((a,st)=>a+(st.timerAccumMs||0),0);
      if(timedMs>0){ actual = Math.round(timedMs/60000); hasTimerData = true; }
      else actual = b.done ? planned : 0;
    } else {
      actual = b.done ? planned : 0;
    }
    plannedMin += planned; actualMin += actual;
    if(!bySubject[b.subject]) bySubject[b.subject] = {planned:0, actual:0};
    bySubject[b.subject].planned += planned;
    bySubject[b.subject].actual += actual;
    rows.push({id:b.id, date:b.date, subject:b.subject, activity:b.activity||b.chapter||'', startTime:b.startTime, endTime:b.endTime, planned, actual, hasTimerData, done:!!b.done, variance: actual-planned});
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date) || (a.startTime||'').localeCompare(b.startTime||''));
  return { plannedMin, actualMin, bySubject, rows, adherencePct: plannedMin ? Math.round(actualMin/plannedMin*100) : null };
}
function plannedVsActualGapRows(pva, limit){
  return pva.rows.filter(r=>r.planned>0).slice().sort((a,b)=>Math.abs(b.variance)-Math.abs(a.variance)).slice(0, limit||15);
}

function periodDelta(cur, prev, key){
  if(prev==null || cur==null) return null;
  if(typeof cur!=='number' || typeof prev!=='number') return null;
  return Math.round((cur-prev)*10)/10;
}
function deltaTagHTML(delta, suffix=''){
  if(delta==null) return '';
  if(delta===0) return `<span class="text-xs faint">±0${suffix}</span>`;
  const up = delta>0;
  return `<span class="text-xs" style="color:${up?'#3E5A3B':'#93332A'}; font-weight:600;">${up?'▲':'▼'} ${Math.abs(delta)}${suffix}</span>`;
}
function periodSummaryText(s, prev){
  const bits = [];
  bits.push(`You studied <strong>${s.totalHours}h</strong> across <strong>${s.daysStudied}/${s.totalDays}</strong> days`);
  if(s.testCount) bits.push(`attempted <strong>${s.testCount}</strong> test${s.testCount===1?'':'s'}${s.avgTestPct!=null?` averaging <strong>${s.avgTestPct}%</strong>`:''}`);
  if(s.pyqCount) bits.push(`solved <strong>${s.pyqCount}</strong> PYQs${s.pyqAcc!=null?` at <strong>${s.pyqAcc}%</strong> accuracy`:''}`);
  if(s.revisionsCompleted) bits.push(`completed <strong>${s.revisionsCompleted}</strong> revision${s.revisionsCompleted===1?'':'s'}`);
  let text = bits.join(', ') + '.';
  if(prev && prev.totalHours!=null){
    const hd = periodDelta(s.totalHours, prev.totalHours);
    if(hd!=null && Math.abs(hd)>=0.5) text += ` That's ${hd>0?'up':'down'} ${Math.abs(hd)}h from the previous ${periodMode}.`;
  }
  return text;
}

function setHealth(key, val){
  const date = todayStr();
  DATA.health[date] = DATA.health[date]||{};

}
function toggleHabit(habit){
  const date = todayStr();

  if(DATA.habitsLog[date][habit]) addXP('habit');
  save(); render();
}

function buildProgressSummaryText(scope){
  scope = scope || 'daily';
  const lines = [];
  const name = DATA.meta.name || 'Student';
  lines.push(`📊 ${name}'s Study Progress — ${scope==='weekly'?'This Week':fmtDate(todayStr())}`);
  lines.push('');
  lines.push(`Overall syllabus: ${overallSyllabusPct()}% complete`);
  subjectNames().forEach(s => lines.push(`  · ${s}: ${subjectCompletion(s)}%`));
  lines.push('');
  if(scope==='weekly'){
    let total = 0;
    for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); total += hoursOnDate(d.toISOString().slice(0,10)); }
    lines.push(`Hours studied this week: ${total.toFixed(1)}h (avg ${(total/7).toFixed(1)}h/day)`);
  } else {
    lines.push(`Hours studied today: ${todayHours().toFixed(1)}h`);
  }
  lines.push(`Current streak: 🔥 ${DATA.streak.current} day${DATA.streak.current===1?'':'s'}`);
  lines.push(`Revisions due: ${getDueRevisions().length}`);
  lines.push(`Pending doubts: ${DATA.doubts.filter(d=>d.status==='Pending').length}`);
  const weak = weakChapters(55).slice(0,3);
  if(weak.length){
    lines.push('');
    lines.push('Chapters needing attention:');
    weak.forEach(w => lines.push(`  · ${w.name} (${w.subject}) — ${w.accuracy}% accuracy`));
  }
  const upcoming = (DATA.upcomingTests||[]).filter(t=>daysBetween(todayStr(),t.date)>=0 && daysBetween(todayStr(),t.date)<=7).sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(upcoming.length){
    lines.push('');
    lines.push('Tests in the next 7 days:');
    upcoming.forEach(t => lines.push(`  · ${fmtDate(t.date)} — ${t.name} (${t.source})`));
  }
  const lastMock = [...DATA.mocks].sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
  if(lastMock){
    lines.push('');
    lines.push(`Most recent mock: ${lastMock.name} — ${lastMock.totalScore} marks, ${lastMock.accuracy}% accuracy`);
  }
  lines.push('');
  lines.push(`Days to ${Object.entries(DATA.meta.exams||{}).sort((a,b)=>new Date(a[1])-new Date(b[1]))[0]?.[0]||'exam'}: ${daysBetween(todayStr(), DATA.meta.examDate)}`);
  return lines.join('\n');
}
function openProgressSummaryModal(scope){
  scope = scope || 'daily';
  const text = buildProgressSummaryText(scope);
  openModal(`
    <div class="modal-head"><h3>📤 Progress Summary</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="flex gap-8 mb-12">

// ---- Backup Reminder Nudge ----
// Data lives only in this browser's storage — no account, no cloud sync — so a silent gap since
// the last export is a real risk (cleared browser data, switched device, etc.). Nudge, don't nag:
// once a week at most, and only after there's actually meaningful data worth losing.
function daysSinceLastBackup(){
  if(!DATA.meta.lastBackupAt) return null;
  return Math.floor((Date.now()-DATA.meta.lastBackupAt)/86400000);
}
function shouldShowBackupNudge(){
  const hasData = DATA.studyLog.length + DATA.mocks.length + DATA.doubts.length >= 5;
  if(!hasData) return false;
  const days = daysSinceLastBackup();
  if(days===null) return DATA.studyLog.length >= 10; // never backed up, but clearly has real data now
  return days >= 7 && DATA.meta.backupNudgeDismissedDate !== todayStr();
}
function dismissBackupNudge(){ DATA.meta.backupNudgeDismissedDate = todayStr(); save(); render(); }
function backupNudgeBannerHTML(){
  if(!shouldShowBackupNudge()) return '';
  const days = daysSinceLastBackup();
  return `
  <div class="card mb-16" style="background:var(--amber-soft); border:none;">
    <div class="flex-between flex-wrap gap-12" style="align-items:center;">
      <div>
        <div class="text-sm" style="font-weight:700;">💾 ${days===null ? "You haven't backed up yet" : `It's been ${days} days since your last backup`}</div>
        <div class="text-xs muted mt-4">Your data lives only in this browser — export a backup so a cleared cache or new device doesn't lose it.</div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-primary btn-sm" onclick="exportData()">Export Now</button>
        <button class="icon-btn" onclick="dismissBackupNudge()">✕</button>
      </div>
    </div>
  </div>`;
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      DATA = migrateData(parsed);
      save(); applyTheme(); render();
      toast('Backup restored successfully.');
    }catch(e){ toast('⚠️ Invalid backup file.'); }
  };
  reader.readAsText(file);
}
function confirmReset(){

  }
}

function examPercentage(rec){ return rec.totalMax ? Math.round((rec.totalObtained/rec.totalMax)*1000)/10 : 0; }
function gradeFor(pct){
  if(pct>=91) return 'A1'; if(pct>=81) return 'A2'; if(pct>=71) return 'B1'; if(pct>=61) return 'B2';
  if(pct>=51) return 'C1'; if(pct>=41) return 'C2'; if(pct>=33) return 'D'; return 'E';
}
function examStrongestWeakest(rec){
  let best=null, worst=null;
  Object.entries(rec.subjectMarks||{}).forEach(([s,m])=>{
    const pct = m.total ? (m.obtained/m.total)*100 : 0;
    if(!best || pct>best.pct) best = {subject:s, pct:Math.round(pct)};
    if(!worst || pct<worst.pct) worst = {subject:s, pct:Math.round(pct)};
  });
  return {best, worst};
}

    obtained += c*MARK_CORRECT + w*MARK_WRONG;
    total += (c+w+u)*MARK_CORRECT;
  });
  const pct = total ? Math.round(obtained/total*1000)/10 : 0;

function saveExamRecord(source){
  const subs = subjectNames();
  const name = document.getElementById('ex_name').value.trim();
  if(!name) return toast('Please enter a name.');
  const date = document.getElementById('ex_date').value || todayStr();
  const type = document.getElementById('ex_type').value;
  const mode = document.getElementById('ex_scoreMode').value;
  const subjectMarks = {}; let totalObtained=0, totalMax=0;
  if(mode==='mcq'){
    subs.forEach(s=>{
      const c = parseInt(document.getElementById(`ex_${s}_c`)?.value)||0;
      const w = parseInt(document.getElementById(`ex_${s}_w`)?.value)||0;
      const u = parseInt(document.getElementById(`ex_${s}_u`)?.value)||0;
      if(c+w+u>0){
        const obt = c*MARK_CORRECT + w*MARK_WRONG;
        const tot = (c+w+u)*MARK_CORRECT;
        subjectMarks[s] = {obtained:obt, total:tot, correct:c, wrong:w, unattempted:u};
        totalObtained += obt; totalMax += tot;
      }
    });
  } else {
    subs.forEach(s=>{
      const obtEl = document.getElementById(`ex_${s}_obt`), totEl = document.getElementById(`ex_${s}_total`);
      const obt = parseFloat(obtEl && obtEl.value), tot = parseFloat(totEl && totEl.value);
      if(!isNaN(obt) && !isNaN(tot) && tot>0){ subjectMarks[s] = {obtained:obt, total:tot}; totalObtained += obt; totalMax += tot; }
    });
  }
  if(totalMax===0) return toast('Enter marks for at least one subject.');

  subs.forEach(s=>{
    (DATA.subjects[s]?.chapters||[]).forEach(ch=>{

function chapterPerfStats(){
  const map = {};
  DATA.examRecords.forEach(rec=>{
    (rec.chapterEntries||[]).forEach(ce=>{
      const key = ce.subject+'::'+ce.chapter;
      if(!map[key]) map[key] = {subject:ce.subject, chapter:ce.chapter, scores:[], sources:new Set(), exams:[]};
      map[key].scores.push(ce.score);
      map[key].sources.add(rec.source);
      map[key].exams.push({name:rec.name, source:rec.source, date:rec.date, score:ce.score});
    });
  });
  return Object.values(map).map(v=>{
    const chObj = allChapters().find(c=>c.subject===v.subject && c.name===v.chapter);
    return {
      subject:v.subject, chapter:v.chapter,
      exams:v.scores.length,
      avg: Math.round(v.scores.reduce((a,b)=>a+b,0)/v.scores.length),
      low: Math.min(...v.scores), high: Math.max(...v.scores),
      sources:[...v.sources],
      mistakeCount: chObj ? (chObj.mistakes||0) : 0,
      timeline: v.exams.sort((a,b)=> new Date(a.date)-new Date(b.date))
    };
  }).sort((a,b)=> a.avg-b.avg);
}

function improvementTrackerHTML(stats){

  return withHistory.map(s=>{
    const first = s.timeline[0].score, last = s.timeline[s.timeline.length-1].score;
    const delta = last-first;
    return `
    <div class="mb-16">
      <div style="font-weight:600; font-size:13.5px; margin-bottom:8px;">${esc(s.chapter)} <span class="faint text-xs">(${s.subject})</span></div>

}

const SYNC_CYCLE = ['none','progress','done'];
const SYNC_ICON = {none:'⬜', progress:'🟡', done:'✅'};
function cycleSync(chId, field){
  const ch = allChapters().find(c=>c.id===chId);
  const real = DATA.subjects[ch.subject].chapters.find(c=>c.id===chId);
  const cur = real.sync[field] || 'none';
  const idx = SYNC_CYCLE.indexOf(cur);
  real.sync[field] = SYNC_CYCLE[(idx+1)%SYNC_CYCLE.length];
  save(); render();
}
function setUnderstanding(chId, val){
  const ch = allChapters().find(c=>c.id===chId);
  const real = DATA.subjects[ch.subject].chapters.find(c=>c.id===chId);
  real.understanding = val;
  save(); render();
}
function chapterMastery(ch){
  const fields = ['school','aakash','vedantu','selfStudy','revisionSync'];
  const vals = fields.map(f=> ch.sync[f]==='done'?100 : ch.sync[f]==='progress'?50 : 0);
  const syncAvg = vals.reduce((a,b)=>a+b,0)/vals.length;
  const understandingPct = (ch.understanding||0)/5*100;
  const perf = chapterPerfStats().find(s=>s.chapter===ch.name && s.subject===ch.subject);
  const parts = [syncAvg, understandingPct]; if(perf) parts.push(perf.avg);
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function attendanceToggle(source, key){
  DATA.attendance[source][key] = !DATA.attendance[source][key]; save(); render();
}
function setAttendanceField(source, key, val){
  DATA.attendance[source][key] = val; save(); render();
}
function setTeacherRating(val){ DATA.attendance.school.teacherRating = val; save(); render(); }
function gapDetectorList(){
  const gaps = [];
  allChapters().forEach(ch=>{
    const s = ch.sync;
    if(s.school==='done' && s.vedantu==='none') gaps.push(`⚠️ School has covered <b>${esc(ch.name)}</b>, but you haven't started the Vedantu lecture.`);
    if(s.aakash==='done' && s.selfStudy==='none') gaps.push(`⚠️ Aakash has finished <b>${esc(ch.name)}</b>, but your self-study is still pending.`);
    if((s.school==='done' || s.aakash==='done') && s.revisionSync==='none') gaps.push(`⚠️ <b>${esc(ch.name)}</b> is taught but not yet revised.`);
    if(s.vedantu==='done' && s.school==='none' && s.aakash==='none') gaps.push(`⚠️ Vedantu is ahead on <b>${esc(ch.name)}</b> — school/coaching haven't reached it yet.`);
  });
  return gaps.slice(0,8);
}

function deleteTest(id){ DATA.upcomingTests = DATA.upcomingTests.filter(t=>t.id!==id); save(); render(); }
function testOverlapScore(test){
  const sources = ['School','Aakash','Vedantu'];
  const scores = {};
  sources.forEach(src=>{
    const otherTests = DATA.upcomingTests.filter(t=>t.source===src && t.id!==test.id);
    if(!otherTests.length){ scores[src] = null; return; }
    const otherChapterKeys = new Set();
    otherTests.forEach(t=> t.chapters.forEach(c=> otherChapterKeys.add(c.subject+'::'+c.chapter)));
    const matched = test.chapters.filter(c=> otherChapterKeys.has(c.subject+'::'+c.chapter)).length;
    scores[src] = Math.round((matched/test.chapters.length)*100);
  });
  return scores;
}
function testAlignmentAnalysis(){
  const tests = DATA.upcomingTests;
  if(tests.length<2) return null;
  const bySource = {};
  tests.forEach(t=>{ t.chapters.forEach(c=>{
    const key = c.subject+'::'+c.chapter;
    if(!bySource[key]) bySource[key] = {subject:c.subject, chapter:c.chapter, sources:new Set(), priorityType:false};
    bySource[key].sources.add(t.source);
    if(isPriorityTestType(t.testType)) bySource[key].priorityType = true;
  }); });
  const all = Object.values(bySource);
  const common = all.filter(c=>c.sources.size>=3);
  const priority = all.slice().sort((a,b)=> (b.sources.size-a.sources.size) || ((b.priorityType?1:0)-(a.priorityType?1:0)));
  return {all, common, priority};
}
function todaysStudyRecommendation(){
  const items = [];
  const weak = chapterPerfStats().filter(s=>s.avg<60).slice(0,2);
  weak.forEach(w=> items.push(`${w.chapter} (weak — ${w.avg}% avg)`));
  const align = testAlignmentAnalysis();
  if(align){ align.priority.slice(0,2).forEach(p=>{ if(!items.some(i=>i.startsWith(p.chapter))) items.push(`${p.chapter} (common to ${[...p.sources].join(' + ')})${p.priorityType?' — 📌 periodic/month-end priority':''}`); }); }
  const due = getDueRevisions().slice(0,2);
  due.forEach(d=> items.push(`Revise ${d.chapter||d.name||'due topic'}`));
  if(!items.length) items.push('Add an exam or upcoming test to unlock personalised recommendations.');
  return items.slice(0,5);
}

  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = cb;
  s.onerror = () => toast('⚠️ Could not load Google sign-in — check your internet connection.');
  document.head.appendChild(s);
}
function connectGoogleDrive(){
  const clientId = document.getElementById('gd_clientid').value.trim();
  if(!clientId) return toast('Paste your Google OAuth Client ID first.');
  DATA.meta.gdriveClientId = clientId; save();
  loadGISScript(() => {
    try{
      gDriveState.tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (resp) => {
          if(resp.error){ toast('Google sign-in failed: '+resp.error); return; }
          gDriveState.accessToken = resp.access_token;
          toast('✅ Connected to Google Drive.');
          render();
        }
      });
      gDriveState.tokenClient.requestAccessToken();
    }catch(e){ toast('⚠️ Could not start Google sign-in. Check your Client ID and authorized origin.'); }
  });
}
async function findDriveBackupFile(){
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='pragati-backup.json' and trashed=false&spaces=drive&fields=files(id,name)`, {
    headers: { 'Authorization': 'Bearer '+gDriveState.accessToken }
  });
  if(!res.ok) return null;
  const data = await res.json();
  return data.files && data.files.length ? data.files[0].id : null;
}
async function backupToDrive(){
  if(!gDriveState.accessToken) return toast('Connect Google Drive first.');
  try{
    const content = JSON.stringify(DATA, null, 2);
    const existingId = await findDriveBackupFile();
    const metadata = { name: 'pragati-backup.json', mimeType: 'application/json' };
    const boundary = 'pragati_boundary';
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
    const url = existingId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res = await fetch(url, {
      method: existingId ? 'PATCH' : 'POST',
      headers: { 'Authorization': 'Bearer '+gDriveState.accessToken, 'Content-Type': `multipart/related; boundary=${boundary}` },
      body
    });
    if(res.ok){ gDriveState.lastSync = new Date().toLocaleString('en-IN'); toast('✅ Backed up to Google Drive.'); render(); }
    else toast('⚠️ Backup failed — try reconnecting.');
  }catch(e){ toast('⚠️ Backup failed: '+e.message); }
}
async function restoreFromDrive(){
  if(!gDriveState.accessToken) return toast('Connect Google Drive first.');
  try{
    const id = await findDriveBackupFile();
    if(!id) return toast('No backup file found in your Drive yet — click Backup Now first.');
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, { headers:{ 'Authorization':'Bearer '+gDriveState.accessToken }});
    if(!res.ok) return toast('⚠️ Could not read backup file.');
    const json = await res.json();
    DATA = migrateData(json);
    save(); applyTheme(); render();
    toast('✅ Restored from Google Drive.');
  }catch(e){ toast('⚠️ Restore failed: '+e.message); }
}

/* ============================================================
   PWA — INSTALLABLE / OFFLINE SUPPORT
   ============================================================ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  if(currentRoute()==='settings') render();
});
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; toast('✅ Pragati installed.'); });
function pwaInstallAvailable(){ return !!deferredInstallPrompt; }
async function promptPwaInstall(){
  if(!deferredInstallPrompt) return toast('Install isn\'t available in this browser right now — use your browser\'s "Add to Home Screen" option from its menu instead.');
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  render();
}
function setupPWA(){
  try{
    // Manifest is built at runtime (as a Blob) so this stays a single self-contained file —
    // no separate manifest.json or icon files to host.
    const manifest = {
      name: 'Pragati — NEET / JEE Study Command Center',
      short_name: 'Pragati',
      start_url: location.pathname + location.search,
      scope: location.pathname,
      display: 'standalone',
      background_color: '#FAF8F4',
      theme_color: '#7E9C7A',
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237E9C7A'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E",
        sizes: '100x100', type: 'image/svg+xml', purpose: 'any'
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const link = document.getElementById('pwaManifestLink');
    if(link) link.href = URL.createObjectURL(manifestBlob);
  }catch(e){ /* manifest is a nice-to-have — never block boot on it */ }

  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    // Minimal cache-first service worker so a reload works offline once the page has loaded once.
    // Registered from a Blob URL so no separate file needs to be hosted alongside this one.
    const swSource = `
      const CACHE = 'pragati-shell-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { self.clients.claim(); });
      self.addEventListener('fetch', e => {
        if(e.request.method !== 'GET') return;
        e.respondWith(
          caches.match(e.request).then(cached => {
            const fetchPromise = fetch(e.request).then(res => {
              if(res && res.status===200){ caches.open(CACHE).then(c => c.put(e.request, res.clone())); }
              return res;
            }).catch(() => cached);
            return cached || fetchPromise;
          })
        );
      });
    `;
    try{
      const swUrl = URL.createObjectURL(new Blob([swSource], {type:'text/javascript'}));
      navigator.serviceWorker.register(swUrl).catch(()=>{ /* offline caching is best-effort */ });
    }catch(e){ /* ignore */ }
  }
}

boot();
setupPWA();
